<!DOCTYPE html>
<html lang="en">
<head>

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    /* ── content ── */
    .content { padding: 16px 20px; }

    /* ── buttons ── */
    .btn { padding: 6px 12px; border-radius: 6px; cursor: pointer; font-size: 12px; border: 1px solid transparent; font-family: Arial, sans-serif; display: inline-flex; align-items: center; gap: 5px; }
    .btn-primary { background: #059669; color: white; border-color: #059669; }
    .btn-primary:hover { background: #047857; }
    .btn-secondary { background: white; color: #374151; border-color: #d1d5db; }

    .btn-danger { background: #ef4444; color: white; border-color: #ef4444; }

    td.mono { font-family: monospace; font-size: 11px; }

    /* ── line section header ── */
    .line-hdr { display: flex; align-items: center; gap: 10px; padding: 10px 14px; background: #ecfdf5; border: 1px solid #a7f3d0; border-radius: 8px; margin-bottom: 10px; margin-top: 16px; }
    .line-hdr h3 { font-size: 13px; font-weight: 700; color: #065f46; }

    .budget-bar.ok { background: #059669; }
    .budget-bar.over { background: #ef4444; }

    /* ── changeover row ── */

    .co-badge { display: inline-block; background: #fde68a; color: #92400e; padding: 1px 6px; border-radius: 8px; font-size: 10px; font-weight: 600; }
    .run-badge { display: inline-block; background: #d1fae5; color: #065f46; padding: 1px 6px; border-radius: 8px; font-size: 10px; font-weight: 600; }

    /* ── class pill ── */

    .cls-b { background: #fef3c7; color: #92400e; padding: 1px 6px; border-radius: 8px; font-size: 10px; font-weight: 700; }
    .cls-c { background: #f1f5f9; color: #475569; padding: 1px 6px; border-radius: 8px; font-size: 10px; font-weight: 700; }
    .flavour-pill { display: inline-block; padding: 1px 7px; border-radius: 8px; font-size: 10px; font-weight: 600; background: #e0f2fe; color: #0369a1; }

    /* ── upload zone ── */

    .warn-box { background: #fffbeb; border: 1px solid #fde68a; border-radius: 6px; padding: 10px 14px; font-size: 12px; color: #92400e; margin-bottom: 12px; }

    .cal-empty-day { background: #f8fafc; border: 1px dashed #e2e8f0; border-radius: 8px; min-height: 90px; }

    /* ── summary numbers ── */
    .summary-grid { display: flex; gap: 12px; flex-wrap: wrap; margin-bottom: 16px; }
    .summary-card { background: white; border: 1px solid #d1fae5; border-radius: 8px; padding: 12px 16px; min-width: 140px; box-shadow: 0 1px 4px rgba(5,150,105,.05); }
    .summary-card .val { font-size: 22px; font-weight: 700; color: #065f46; }

    .summary-card.warn .val { color: #d97706; }

    /* ── day bar ── */
    .day-bar { display: inline-block; height: 8px; border-radius: 4px; background: #059669; min-width: 4px; vertical-align: middle; }
    .day-bar.co { background: #fbbf24; }

    /* ── scrollable table ── */
    .tbl-scroll { max-height: calc(100vh - 240px); overflow-y: auto; }

    /* supply plan group header */
    .grp-row td { background: #f0faf4; font-weight: 700; font-size: 11px; color: #065f46; text-transform: uppercase; letter-spacing: .5px; padding: 5px 10px; border-bottom: 1px solid #d1fae5; }
  </style>
</head>

<div id="root"></div>
<script type="text/babel">
const { useState, useEffect, useRef, useCallback } = React;

// ─── CONSTANTS ───────────────────────────────────────────────────────────────

const RATE_LOOKUP = {

  'Pack of 6|120':5000,

};

const LINE_FOR_PACK = { 'Jar':'L1','Pouch':'L2','1kg':'L2','Sampler':'Sampler','Pack of 6':'Sampler' };
const ALL_LINES = ['L1','L2','Sampler'];
const LINE_LABELS = { L1:'L1 — Jars', L2:'L2 — Pouch / 1kg', Sampler:'Sampler / Pack-of-6' };

const FLAVOUR_COLORS = {

const DEFAULT_SKUS = [

  { code:'MWLJNTP.00027.B0_N', name:'LJ NutriMix 2+ 350g Choc Pouch',           flavour:'Chocolate',  pack_type:'Pouch',     pack_size:350,  brand:'LJ', cls:'A', asp:481.42,  targetDoi:60 },
  { code:'MWLJNTP.0003.B0_N',  name:'LJ NutriMix 2+ 350g Choc Jar',             flavour:'Chocolate',  pack_type:'Jar',       pack_size:350,  brand:'LJ', cls:'A', asp:495.78,  targetDoi:60 },
  { code:'MWLJNTP.00034.B0_N', name:'LJ NutriMix 2+ 350g Strawberry Jar',       flavour:'Strawberry', pack_type:'Jar',       pack_size:350,  brand:'LJ', cls:'A', asp:520.31,  targetDoi:60 },
  { code:'MWLJNTP.000709.B0_N',name:'LJ NutriMix Lite 2+ 1kg Pouch',            flavour:'Chocolate',  pack_type:'1kg',       pack_size:1000, brand:'LJ', cls:'A', asp:803.67,  targetDoi:60 },
  { code:'MWLJNTP.000836.B0_N',name:'LJ Nutrimix 2+ Vanilla Lite 350g Jar',     flavour:'Vanilla',    pack_type:'Jar',       pack_size:350,  brand:'LJ', cls:'B', asp:373.28,  targetDoi:45 },
  { code:'MWLJNTP.00122.B0_N', name:'LJ NutriMix 2+ 350g Vanilla Jar',          flavour:'Vanilla',    pack_type:'Jar',       pack_size:350,  brand:'LJ', cls:'A', asp:509.51,  targetDoi:60 },
  { code:'MWLJNTP.00126.B0_N', name:'LJ NutriMix 13+ 350g Jar',                 flavour:'Chocolate',  pack_type:'Jar',       pack_size:350,  brand:'LJ', cls:'A', asp:624.46,  targetDoi:60 },
  { code:'MWLJNTP.00339.B0_N', name:'LJ MamaMix 400g Pouch',                    flavour:'Vanilla',    pack_type:'Pouch',     pack_size:400,  brand:'LJ', cls:'A', asp:645.19,  targetDoi:60 },
  { code:'MWLJNTP.00481.B0_N', name:'LJ Millet Pancake Mix 150g Jar',           flavour:'Millet',     pack_type:'Jar',       pack_size:150,  brand:'LJ', cls:'C', asp:155.32,  targetDoi:30 },
  { code:'MWLJNTP.00483.B0_N', name:'LJ NutriMix 2+ Belgian Choc 350g Jar',     flavour:'Chocolate',  pack_type:'Jar',       pack_size:350,  brand:'LJ', cls:'C', asp:538.61,  targetDoi:60 },
  { code:'MWLJNTP.00507.B0_N', name:'LJ NutriMix 2+ Choc 1kg',                  flavour:'Chocolate',  pack_type:'1kg',       pack_size:1000, brand:'LJ', cls:'A', asp:1116.69, targetDoi:60 },
  { code:'MWLJNTP.00527.BO_N', name:'LJ NutriMix Lite Vanilla 1kg',             flavour:'Vanilla',    pack_type:'1kg',       pack_size:1000, brand:'LJ', cls:'C', asp:865.67,  targetDoi:30 },
  { code:'MWLJNTP.00541.BO_N', name:'LJ Nutrimix 13+ Choc 1kg ×3',              flavour:'Chocolate',  pack_type:'1kg',       pack_size:1000, brand:'LJ', cls:'C', asp:1349.91, targetDoi:30 },
  { code:'MWLJNTP.00553.BO_N', name:'LJ Proteinmix 250g Jar',                   flavour:'Protein',    pack_type:'Jar',       pack_size:250,  brand:'LJ', cls:'A', asp:439.83,  targetDoi:60 },
  { code:'MWLJNTP.00584.BO_N', name:'LJ Mothers Mix Vanilla 400g Jar',          flavour:'Vanilla',    pack_type:'Jar',       pack_size:400,  brand:'LJ', cls:'C', asp:654.37,  targetDoi:30 },
  { code:'MWLJNTP.00615.BO_N', name:'LJ Nutrimix 2+ 200g Choc Jar',             flavour:'Chocolate',  pack_type:'Jar',       pack_size:200,  brand:'LJ', cls:'C', asp:209.04,  targetDoi:30 },
  { code:'MWLJNTP.00618.BO_N', name:'LJ Nutrimix 2+ Pack of 6 Choc',            flavour:'Chocolate',  pack_type:'Pack of 6', pack_size:120,  brand:'LJ', cls:'C', asp:191.32,  targetDoi:30 },
  { code:'MWLJNTP.00664.BO_N', name:'LJ Nutrimix 13+ Vanilla 300g Jar',         flavour:'Vanilla',    pack_type:'Jar',       pack_size:300,  brand:'LJ', cls:'C', asp:611.13,  targetDoi:30 },
  { code:'MWLJNTP.00746.BO_N', name:'LJ Proteinmix 500g Jar',                   flavour:'Protein',    pack_type:'Jar',       pack_size:500,  brand:'LJ', cls:'C', asp:765.81,  targetDoi:30 },
  { code:'MWLJNTS.0001.B0_N',  name:'LJ NutriMix 2+ 20g Choc Sampler',          flavour:'Chocolate',  pack_type:'Sampler',   pack_size:20,   brand:'LJ', cls:'C', asp:37.97,   targetDoi:30 },
  { code:'MWLJNTS.00040.B0_N', name:'LJ NutriMix 2+ 20g Vanilla Sampler',       flavour:'Vanilla',    pack_type:'Sampler',   pack_size:20,   brand:'LJ', cls:'C', asp:44.01,   targetDoi:30 },
  { code:'MWLJNTS.0003.B0_N',  name:'LJ NutriMix 2+ 20g Strawberry Sampler',    flavour:'Strawberry', pack_type:'Sampler',   pack_size:20,   brand:'LJ', cls:'C', asp:42.79,   targetDoi:30 },
  { code:'MWLJNTP.00694.BO_N', name:'LJ Proteinmix 15g Sampler',                flavour:'Protein',    pack_type:'Sampler',   pack_size:15,   brand:'LJ', cls:'C', asp:42.52,   targetDoi:30 },
  { code:'MWLJNTP.00699.B0_N', name:'LJ NutriMix 2+ Unsweetened 350g Pouch',    flavour:'Chocolate',  pack_type:'Pouch',     pack_size:350,  brand:'LJ', cls:'C', asp:607.80,  targetDoi:30 },
  { code:'MWLJNTP.00551.BO_N', name:'LJ Nutrimix Pack of 6 CSV',                flavour:'Chocolate',  pack_type:'Pack of 6', pack_size:120,  brand:'LJ', cls:'C', asp:309.83,  targetDoi:30 },
  { code:'MWLJNTP.00519.B0_N', name:'LJ NutriMix 2+ Pack of 6',                 flavour:'Chocolate',  pack_type:'Pack of 6', pack_size:120,  brand:'LJ', cls:'C', asp:308.53,  targetDoi:30 },
];

const DEFAULT_CONFIG  = { shiftHours:12, changeoverSame:0.25, changeoverDiff:0.75, rateBasis:24 };
const DEFAULT_WD      = { L1:24, L2:24, Sampler:24 };

// ─── HELPERS ─────────────────────────────────────────────────────────────────
const getLine = pt => LINE_FOR_PACK[pt] || 'L1';
const getRph  = (pt, ps, rb) => (RATE_LOOKUP[`${pt}|${ps}`] || 0) / rb;
const fmt     = (n, d=0) => n == null ? '—' : Number(n).toLocaleString('en-IN', {maximumFractionDigits:d});
const fmtH    = h => { if (!h) return '0h'; const hr=Math.floor(h), mn=Math.round((h-hr)*60); return mn ? `${hr}h ${mn}m` : `${hr}h`; };
const clsPill = c => <span className={`cls-${(c||'').toLowerCase()}`}>{c}</span>;
const flvPill = f => <span className="flavour-pill" style={{background:FLAVOUR_COLORS[f]?`${FLAVOUR_COLORS[f]}22`:undefined, color:FLAVOUR_COLORS[f]||'#374151'}}>{f}</span>;

// ─── ENGINE ──────────────────────────────────────────────────────────────────
// scenario: 'A' = Revenue Max | 'B' = Min Changeover
function runEngine(supplyPlan, skus, config, workingDays, scenario='A', stockData={}) {
  const { shiftHours, changeoverSame, changeoverDiff, rateBasis } = config;

  // 3-Pass engine per line:
  //   Pass 1 (Survival):    FG < Demand → produce deficit, mandatory, line-specific priority
  //   Pass 2 (30-day floor): closing < 30×DRR → fill to 30-day cover, rev priority, budget-capped
  //   Pass 3 (Target cover): closing < TargetDOI×DRR (only if TargetDOI > 30) → fill remainder, budget-capped
  //   Skip:                 closing ≥ TargetDOI×DRR → don't produce

  // Pre-enrich all SKUs
  const enriched = skus.map(sku => {
    const demand = Number(supplyPlan[sku.code]) || 0;
    const fg     = Number(stockData[sku.code]?.stock) || 0;
    const drr    = Number(stockData[sku.code]?.drr)   || 0;
    const tDoi   = sku.targetDoi || 60;
    const rph    = getRph(sku.pack_type, sku.pack_size, rateBasis);
    const line   = getLine(sku.pack_type);
    const targetStock = tDoi * drr;
    const floor30     = 30 * drr;
    const closingNoProd = Math.max(0, fg - demand); // closing if nothing produced
    return { ...sku, demand, fg, drr, rph, line, tDoi, targetStock, floor30, closingNoProd };
  });

  // For backward compat (QueueTab uses planRows)
  const planRows = [];

  function makeGroup(key, sk) {
    const tRev = sk.reduce((s,r)=>s+r.rev,0);
    const tHrs = sk.reduce((s,r)=>s+r.hrs,0);
    return { flavour: key, skus: [...sk].sort((a,b)=>b.rev-a.rev), tRev, tHrs, rph: tHrs>0?tRev/tHrs:0 };
  }

  function buildGroups(rows, line, sc) {
    if (!rows.length) return [];
    // L1 (Jars): always sort by absolute revenue descending — no grouping
    if (line === 'L1') return [makeGroup('all', [...rows].sort((a,b)=>b.rev-a.rev))];
    if (sc === 'B') {
      const flMap = {};
      for (const r of rows) { (flMap[r.flavour] = flMap[r.flavour] || []).push(r); }
      const flGroups = Object.entries(flMap).map(([fl, flSkus]) => {
        const ptMap = {};
        for (const r of flSkus) { (ptMap[r.pack_type] = ptMap[r.pack_type] || []).push(r); }
        const subGroups = Object.entries(ptMap).map(([pt, sk]) => {
          const tRev = sk.reduce((s,r)=>s+r.rev,0);
          const tHrs = sk.reduce((s,r)=>s+r.hrs,0);
          return { flavour: fl, pack_type: pt, skus: [...sk].sort((a,b)=>b.rev-a.rev), tRev, tHrs, rph: tHrs>0?tRev/tHrs:0 };
        }).sort((a,b) => b.rph - a.rph);
        return { flavour: fl, subGroups, flTRev: flSkus.reduce((s,r)=>s+r.rev,0) };
      }).sort((a,b) => b.flTRev - a.flTRev);
      const groups = [];
      for (const fg of flGroups) for (const sg of fg.subGroups)
        groups.push({ flavour: sg.flavour, pack_type: sg.pack_type, skus: sg.skus, tRev: sg.tRev, tHrs: sg.tHrs, rph: sg.rph });
      return groups;
    } else {
      if (line === 'L2') {
        const gMap = {};
        for (const r of rows) { (gMap[r.pack_type] = gMap[r.pack_type] || []).push(r); }
        return Object.entries(gMap).map(([pt, sk]) => makeGroup(pt, sk)).sort((a,b) => b.rph - a.rph);
      }
      return [makeGroup('all', rows)];
    }
  }

  const results = {};
  for (const line of ALL_LINES) {
    const lineSkus = enriched.filter(s => s.line === line);
    if (!lineSkus.length) { results[line] = null; continue; }

    const budget = (workingDays[line] || 0) * shiftHours;
    const seq = [];
    let prevFl = null, prevPt = null, gRank = 0;
    let remaining = budget;

    // Helper: make a pass row with correct qty/rev/hrs for this pass
    const makePassRow = (s, qty, phase, closing) => {
      const hrs = s.rph > 0 ? qty / s.rph : 0;
      const rev = qty * s.asp;
      const cl = closing !== undefined ? closing : s.closingNoProd;
      return { ...s, qty, hrs, rev, rph_rev: hrs>0?rev/hrs:0, phase,
               plan: s.demand, targetStock: s.targetStock, closingStock: cl };
    };

    // Helper: insert one run into seq with changeover, returns false if no budget for C/O
    const insertRun = (row, capToRemaining) => {
      const curFl = row.flavour;
      const curPt = row.pack_type;
      let coH = 0;
      if (prevFl !== null) {
        const fc = prevFl !== curFl;
        const pc = !fc && prevPt !== curPt;
        coH = fc ? changeoverDiff : changeoverSame;
        if (capToRemaining && remaining <= coH) return false; // can't afford C/O
        const lbl = fc ? `Flavour change → ${curFl}` : pc ? `Pack type change → ${curPt}` : `SKU change (${curFl})`;
        seq.push({ type:'co', hours:coH, label:lbl });
        remaining -= coH;
      }
      let qty = row.qty;
      let capped = false;
      if (capToRemaining) {
        const maxQty = row.rph > 0 ? Math.floor(remaining * row.rph) : 0;
        if (maxQty <= 0) { remaining += coH; seq.pop(); return false; } // undo C/O
        if (qty > maxQty) { qty = maxQty; capped = true; }
      }
      const hrs = row.rph > 0 ? qty / row.rph : 0;
      const rev = qty * row.asp;
      seq.push({ type:'run', ...row, qty, hrs, rev, rph_rev:hrs>0?rev/hrs:0, gRank, capped });
      remaining -= hrs;
      prevFl = curFl; prevPt = curPt;
      planRows.push({ ...row, qty, hrs, rev, line, tier: row.phase==='P1'?1:2 });
      return true;
    };

    // Helper: run a capped pass over a set of rows
    const runPass = (passRows, label) => {
      if (!passRows.length) return;
      const groups = buildGroups(passRows, line, scenario);
      let skipped = 0;
      seq.push({ type:'tier', label });
      for (const g of groups) {
        gRank++;
        for (const s of g.skus) {
          if (remaining <= 0) { skipped++; continue; }
          const ok = insertRun(s, true);
          if (!ok) skipped++;
        }
      }
      if (skipped > 0)
        seq.push({ type:'tier', label: `⏭ ${skipped} SKU(s) skipped — no remaining capacity` });
    };

    // ── PASS 1: Survival (mandatory, no budget cap) ──────────────────────────
    const p1Rows = lineSkus
      .filter(s => s.fg < s.demand)
      .map(s => makePassRow(s, s.demand - s.fg, 'P1'));

    if (p1Rows.length) {
      seq.push({ type:'tier', label: '🔴 Pass 1 — Survival (Must Make)' });
      const groups1 = buildGroups(p1Rows, line, scenario);
      for (const g of groups1) {
        gRank++;
        for (const s of g.skus) insertRun(s, false); // false = no cap
      }
    }

    // Closing stock per SKU after Pass 1
    const p1ActualByCode = {};
    seq.filter(r=>r.type==='run'&&r.phase==='P1').forEach(r=>{ p1ActualByCode[r.code]=(p1ActualByCode[r.code]||0)+r.qty; });
    const closingAfterP1 = {};
    lineSkus.forEach(s => {
      closingAfterP1[s.code] = s.fg < s.demand
        ? 0  // after survival, closing = 0 (FG + deficit - demand = 0)
        : s.closingNoProd;
    });

    // ── PASS 2: 30-day floor (budget-capped) ─────────────────────────────────
    const p2Rows = lineSkus
      .filter(s => s.drr > 0 && closingAfterP1[s.code] < s.floor30 && s.closingNoProd < s.targetStock)
      .map(s => makePassRow(s, Math.max(0, s.floor30 - closingAfterP1[s.code]), 'P2', closingAfterP1[s.code]));

    if (p2Rows.length) runPass(p2Rows, '🟡 Pass 2 — 30-Day Cover (Best Effort)');

    // Closing after Pass 2
    const p2ActualByCode = {};
    seq.filter(r=>r.type==='run'&&r.phase==='P2').forEach(r=>{ p2ActualByCode[r.code]=(p2ActualByCode[r.code]||0)+r.qty; });
    const closingAfterP2 = {};
    lineSkus.forEach(s => {
      closingAfterP2[s.code] = closingAfterP1[s.code] + (p2ActualByCode[s.code]||0);
    });

    // ── PASS 3: Target DOI top-up beyond 30 days (budget-capped) ─────────────
    const p3Rows = lineSkus
      .filter(s => s.tDoi > 30 && s.drr > 0 && closingAfterP2[s.code] < s.targetStock && s.closingNoProd < s.targetStock)
      .map(s => makePassRow(s, Math.max(0, s.targetStock - closingAfterP2[s.code]), 'P3', closingAfterP2[s.code]));

    if (p3Rows.length) runPass(p3Rows, '🔵 Pass 3 — Target DOI Top-up (Best Effort)');

    // Skip notice
    const skipped = lineSkus.filter(s => s.closingNoProd >= s.targetStock);
    if (skipped.length) seq.push({ type:'tier', label:`⏭ ${skipped.length} SKU(s) not produced — closing stock ≥ target stock` });

    const runH  = seq.filter(s=>s.type==='run').reduce((s,r)=>s+r.hrs,0);
    const coH   = seq.filter(s=>s.type==='co').reduce((s,r)=>s+r.hours,0);
    const total = runH + coH;

    // All runs for this line (for QueueTab groups)
    const allLineRuns = seq.filter(r=>r.type==='run');
    const groups = buildGroups(allLineRuns, line, scenario);

    // Day schedule
    let acc = 0;
    const daySeq = seq.map(item => {
      if (item.type === 'tier') return { ...item, startDay: acc/shiftHours+1, endDay: acc/shiftHours+1, h: 0 };
      const h = item.type === 'run' ? item.hrs : item.hours;
      const sd = acc / shiftHours + 1;
      acc += h;
      return { ...item, startDay: sd, endDay: acc/shiftHours+1, h };
    });

    const allRows = seq.filter(r=>r.type==='run');
    results[line] = { groups, seq: allLineRuns, daySeq, budget, runH, coH, total, over: total>budget,
                      skuCount: allRows.length,
                      t1Count: p1Rows.length, t2Count: p2Rows.length, t3Count: p3Rows.length };
  }
  return results;
}

// ─── LOGIN ───────────────────────────────────────────────────────────────────
function LoginScreen({ sb }) {
  const [mode, setMode]     = useState('login');
  const [email, setEmail]   = useState('');
  const [pass, setPass]     = useState('');
  const [err, setErr]       = useState('');
  const [info, setInfo]     = useState('');
  const [loading, setLoading] = useState(false);

  async function submit(e) {
    e.preventDefault(); setErr(''); setInfo(''); setLoading(true);
    try {
      if (mode === 'login') {
        const { error } = await sb.auth.signInWithPassword({ email, password: pass });
        if (error) setErr(error.message);
      } else {
        const { error } = await sb.auth.signUp({ email, password: pass });
        if (error) setErr(error.message);
        else setInfo('Check your email to confirm your account.');
      }
    } finally { setLoading(false); }
  }

  return (
    <div className="login-wrap">
      <div className="login-card">
        <div style={{textAlign:'center',marginBottom:20}}>
          <div style={{fontSize:32}}>🗓️</div>
          <h2>Production Scheduler</h2>
          <p>Sapiens · Mosaic Wellness</p>
        </div>
        <div className="mode-toggle">
          <button className={`mode-btn${mode==='login'?' active':''}`} onClick={()=>{setMode('login');setErr('');setInfo('');}}>Log In</button>
          <button className={`mode-btn${mode==='signup'?' active':''}`} onClick={()=>{setMode('signup');setErr('');setInfo('');}}>Sign Up</button>
        </div>
        <form onSubmit={submit}>
          <div className="login-field"><label>Email</label><input type="email" value={email} onChange={e=>setEmail(e.target.value)} required placeholder="you@mosaicwellness.in"/></div>
          <div className="login-field"><label>Password</label><input type="password" value={pass} onChange={e=>setPass(e.target.value)} required minLength={6} placeholder="••••••••"/></div>
          {err  && <div className="err-box">{err}</div>}
          {info && <div className="info-box">{info}</div>}
          <button type="submit" className="btn-submit" disabled={loading}>{loading ? '...' : mode==='login' ? 'Log In' : 'Create Account'}</button>
        </form>
      </div>
    </div>
  );
}

// ─── SUPPLY PLAN TAB ─────────────────────────────────────────────────────────
function SupplyPlanTab({ skus, plan, setPlan, stockData, setStockData, onRun, results, config }) {
  const planRef  = useRef();
  const stockRef = useRef();
  const drrRef   = useRef();
  const [colPicker, setColPicker] = React.useState(null); // { rows, skuCol, numCols, field }

  function parseFile(file, field) {
    const reader = new FileReader();
    reader.onload = ev => {
      try {
        const wb = XLSX.read(ev.target.result, { type:'array' });
        const ws = wb.Sheets[wb.SheetNames[0]];
        const rows = XLSX.utils.sheet_to_json(ws, { defval:'' });
        if (!rows.length) { alert('File is empty.'); return; }
        const headers = Object.keys(rows[0]);
        let skuCol = null;
        for (const h of headers) {
          if (rows.filter(r => skus.find(s => s.code === String(r[h]).trim())).length > 0) { skuCol = h; break; }
        }
        if (!skuCol) { alert('No SKU codes found in file.'); return; }
        const numCols = headers.filter(h => h !== skuCol && rows.some(r => Number(r[h]) > 0));
        if (numCols.length === 1) {
          applyImport(rows, skuCol, numCols[0], field);
        } else {
          setColPicker({ rows, skuCol, numCols, field });
        }
      } catch(err) { alert('Could not read file: ' + err.message); }
    };
    reader.readAsArrayBuffer(file);
  }

  function applyImport(rows, skuCol, valCol, field) {
    let matched = 0;
    if (field === 'plan') {
      const newPlan = { ...plan };
      for (const row of rows) {
        const sku = skus.find(s => s.code === String(row[skuCol]).trim());
        const rawVal = String(row[valCol] ?? '').trim();
        if (sku && rawVal !== '') { newPlan[sku.code] = Number(rawVal); matched++; }
      }
      setPlan(newPlan);
    } else {
      const key = field; // 'stock' or 'drr'
      const newStock = { ...stockData };
      for (const row of rows) {
        const sku = skus.find(s => s.code === String(row[skuCol]).trim());
        const rawVal = String(row[valCol] ?? '').trim();
        if (sku && rawVal !== '') {
          newStock[sku.code] = { ...(newStock[sku.code]||{}), [key]: Number(rawVal) };
          matched++;
        }
      }
      setStockData(newStock);
    }
    setColPicker(null);
    const label = field === 'plan' ? 'Production Plan' : field === 'stock' ? 'FG Stock' : 'DRR';
    alert(`Imported ${matched} SKUs into ${label} from "${valCol}".`);
  }

  function clearPlan() { if (window.confirm('Clear all quantities?')) setPlan({}); }

  const totalQty = Object.values(plan).reduce((s,v)=>s+(Number(v)||0),0);
  const hasAny = totalQty > 0;

  // Live hours estimate per line
  const liveEst = {};
  for (const line of ALL_LINES) {
    const hrs = skus
      .filter(s => getLine(s.pack_type)===line && Number(plan[s.code])>0)
      .reduce((sum,s)=>{ const r=getRph(s.pack_type,s.pack_size,(config&&config.rateBasis)||24); return sum+(r>0?Number(plan[s.code])/r:0); },0);
    liveEst[line] = hrs;
  }

  // Group skus by line for display
  const byLine = {};
  for (const s of skus) { (byLine[getLine(s.pack_type)] = byLine[getLine(s.pack_type)] || []).push(s); }

  return (
    <div>
      <div className="toolbar">
        <button className="btn btn-secondary" onClick={()=>planRef.current.click()}>⬆ Production Plan</button>
        <input ref={planRef} type="file" accept=".xlsx,.xls,.csv" style={{display:'none'}} onChange={e=>{if(e.target.files[0])parseFile(e.target.files[0],'plan');e.target.value='';}}/>
        <button className="btn btn-secondary" onClick={()=>stockRef.current.click()}>⬆ FG Stock</button>
        <input ref={stockRef} type="file" accept=".xlsx,.xls,.csv" style={{display:'none'}} onChange={e=>{if(e.target.files[0])parseFile(e.target.files[0],'stock');e.target.value='';}}/>
        <button className="btn btn-secondary" onClick={()=>drrRef.current.click()}>⬆ DRR</button>
        <input ref={drrRef} type="file" accept=".xlsx,.xls,.csv" style={{display:'none'}} onChange={e=>{if(e.target.files[0])parseFile(e.target.files[0],'drr');e.target.value='';}}/>

        {hasAny && <button className="btn btn-secondary btn-sm" onClick={clearPlan}>✕ Clear</button>}
        <span className="spacer"/>
        <span style={{fontSize:12,color:'#64748b'}}>{Object.keys(plan).filter(k=>Number(plan[k])>0).length} SKUs · {fmt(totalQty)} units total</span>
        <button className="btn btn-primary" onClick={onRun} disabled={!hasAny}>▶ Run Scheduler</button>
      </div>

      {/* Line hour estimates */}
      <div className="summary-grid" style={{marginBottom:12}}>
        {ALL_LINES.map(line=>(
          <div className="summary-card" key={line}>
            <div className="val">{fmtH(liveEst[line])}</div>
            <div className="lbl">{LINE_LABELS[line]} — est. run hours</div>
          </div>
        ))}
      </div>

      <div className="info-box">Import Production Plan from XLSX (needs a SKU code column + quantity column). FG Stock &amp; DRR for DOI suggestion — enter manually or via API.</div>

      {/* Column picker modal */}
      {colPicker && (
        <div style={{position:'fixed',inset:0,background:'rgba(0,0,0,0.45)',zIndex:1000,display:'flex',alignItems:'center',justifyContent:'center'}}>
          <div style={{background:'#fff',borderRadius:12,padding:28,minWidth:340,boxShadow:'0 8px 32px rgba(0,0,0,0.18)'}}>
            <div style={{fontWeight:700,fontSize:16,marginBottom:4}}>Select Production Plan Column</div>
            <div style={{fontSize:13,color:'#64748b',marginBottom:16}}>SKU column: <b>{colPicker.skuCol}</b>. Which column has the {colPicker.field==='plan'?'production quantities':colPicker.field==='stock'?'FG stock':'DRR'} values?</div>
            <div style={{display:'flex',flexDirection:'column',gap:8}}>
              {colPicker.numCols.map(col => (
                <button key={col} className="btn btn-secondary" style={{textAlign:'left',justifyContent:'flex-start'}}
                  onClick={()=>applyImport(colPicker.rows, colPicker.skuCol, col, colPicker.field)}>
                  {col}
                </button>
              ))}
            </div>
            <button className="btn btn-secondary btn-sm" style={{marginTop:16}} onClick={()=>setColPicker(null)}>Cancel</button>
          </div>
        </div>
      )}

      <div className="tbl-wrap tbl-scroll">
        <table>
          <thead>
            <tr>
              <th>SKU Code</th>
              <th>Product</th>
              <th>Flavour</th>
              <th>Line</th>
              <th>Cls</th>
              <th className="right">Rate (u/hr)</th>
              <th className="right">Production Plan (units)</th>
              <th className="right">Est. Hours</th>
              <th className="right">FG Stock</th>
              <th className="right">DRR</th>
              <th className="right">Current DOI</th>
              <th className="right">Target Stock</th>
            </tr>
          </thead>
          <tbody>
            {ALL_LINES.map(line => {
              const lineSkus = byLine[line] || [];
              return [
                <tr key={`hdr-${line}`}><td colSpan={12} className="grp-row">{LINE_LABELS[line]}</td></tr>,
                ...lineSkus.map(sku => {
                  const qty      = Number(plan[sku.code]) || 0;
                  const rph      = getRph(sku.pack_type, sku.pack_size, DEFAULT_CONFIG.rateBasis);
                  const hrs      = rph > 0 && qty > 0 ? qty / rph : 0;
                  const stock    = Number(stockData[sku.code]?.stock) || 0;
                  const drr      = Number(stockData[sku.code]?.drr) || 0;
                  const doi      = drr > 0 ? stock / drr : null;
                  const tDoi     = sku.targetDoi || 60;
                  // DOI suggested = Max(targetDoi×DRR − Max(stock − demand, 0), 0)
                  // demand approximated as DRR × 25 working days when no separate demand field
                  const demand   = drr * 25;
                  const closing  = Math.max(0, stock - demand);
                  const suggested = drr > 0 ? Math.max(0, Math.round(tDoi * drr - closing)) : null;
                  return (
                    <tr key={sku.code}>
                      <td className="mono">{sku.code}</td>
                      <td style={{maxWidth:220,overflow:'hidden',textOverflow:'ellipsis'}}>{sku.name}</td>
                      <td>{flvPill(sku.flavour)}</td>
                      <td><span style={{fontWeight:600,color:'#065f46'}}>{line}</span></td>
                      <td>{clsPill(sku.cls)}</td>
                      <td className="right">{fmt(rph,0)}</td>
                      <td className="right">
                        <input
                          type="number" min="0" className={`num-input${qty>0?' has-val':''}`}
                          value={qty||''}
                          onChange={e=>setPlan(p=>({...p,[sku.code]:e.target.value}))}
                          placeholder="0"
                        />
                      </td>
                      <td className="right">{qty>0?fmtH(hrs):'—'}</td>
                      <td className="right">
                        <input type="number" min="0" className="num-input" value={stockData[sku.code]?.stock||''}
                          onChange={e=>setStockData(d=>({...d,[sku.code]:{...d[sku.code],stock:e.target.value}}))} placeholder="—"/>
                      </td>
                      <td className="right">
                        <input type="number" min="0" className="num-input" value={stockData[sku.code]?.drr||''}
                          onChange={e=>setStockData(d=>({...d,[sku.code]:{...d[sku.code],drr:e.target.value}}))} placeholder="—"/>
                      </td>
                      <td className="right">{doi!=null?<span style={{color:doi<30?'#dc2626':doi<45?'#d97706':'#059669',fontWeight:600}}>{fmt(doi,0)}d</span>:'—'}</td>
                      <td className="right">{suggested!=null?<span style={{color:'#6366f1',fontWeight:600}}>{fmt(suggested,0)}</span>:'—'}</td>
                    </tr>
                  );
                })
              ];
            })}
          </tbody>
        </table>
      </div>
    </div>
  );
}

// ─── QUEUE TAB ───────────────────────────────────────────────────────────────
function QueueTab({ results, workingDays, config, scenario='A' }) {
  const anyResult = results && ALL_LINES.some(l=>results[l]);
  if (!anyResult) return (
    <div className="empty"><div className="icon">📋</div><p>Run the scheduler to see the priority queue.</p></div>
  );

  const scenarioMeta = scenario === 'A'
    ? { label: 'A — Revenue Max', desc: 'L1/L3: absolute revenue · L2: Rev/hr by pack type', color: '#059669', bg: '#d1fae5' }
    : { label: 'B — Min Changeover', desc: 'Flavour clusters by revenue → pack type by Rev/hr → SKUs by revenue', color: '#7c3aed', bg: '#ede9fe' };

  return (
    <div>
      <div style={{display:'flex',alignItems:'center',gap:'10px',padding:'8px 14px',borderRadius:'8px',background:scenarioMeta.bg,border:`1px solid ${scenarioMeta.color}33`,marginBottom:'12px',fontSize:'12px'}}>
        <span style={{fontWeight:700,color:scenarioMeta.color}}>Scenario {scenarioMeta.label}</span>
        <span style={{color:'#64748b'}}>—</span>
        <span style={{color:'#374151'}}>{scenarioMeta.desc}</span>
      </div>
      {ALL_LINES.map(line => {
        const r = results[line];
        if (!r) return null;
        const pct = r.budget > 0 ? Math.min(100, r.total / r.budget * 100) : 0;
        return (
          <div key={line}>
            <div className="line-hdr">
              <h3>{LINE_LABELS[line]}</h3>
              <div className="budget-bar-wrap"><div className={`budget-bar ${r.over?'over':'ok'}`} style={{width:`${pct}%`}}/></div>
              <span className="budget-label">
                {fmtH(r.total)} / {fmtH(r.budget)}
                {r.over && <span style={{color:'#dc2626',fontWeight:700,marginLeft:6}}>⚠ OVER BY {fmtH(r.total-r.budget)}</span>}
              </span>
              <span className="budget-label" style={{color:'#94a3b8'}}>Run: {fmtH(r.runH)} · C/O: {fmtH(r.coH)}</span>
            </div>

            <div className="tbl-wrap" style={{marginBottom:8}}>
              <table>
                <thead>
                  <tr>
                    <th>Rank</th>
                    <th>Grp</th>
                    <th>SKU Code</th>
                    <th>Product</th>
                    <th>Flavour</th>
                    <th>Cls</th>
                    <th className="right">Qty</th>
                    <th className="right">Hours</th>
                    <th className="right">Revenue (₹)</th>
                    <th className="right">Rev / hr (₹)</th>
                  </tr>
                </thead>
                <tbody>
                  {(() => {
                    // Re-sort runs by priority (revenue for L1, rev/hr-by-group for L2)
                    const allRuns = r.seq.filter(s=>s.type==='run');
                    const displayGroups = buildGroups(allRuns, line, scenario);
                    let rank = 0;
                    let gNum = 0;
                    const rows = [];
                    for (const g of displayGroups) {
                      gNum++;
                      const grpRph = g.rph;
                      let firstInGrp = true;
                      for (const s of g.skus) {
                        rank++;
                        rows.push(
                          <tr key={s.code + rank}>
                            <td style={{fontWeight:700,color:'#065f46'}}>{rank}</td>
                            <td style={{textAlign:'center',fontWeight:600,color:'#64748b'}}>{gNum}</td>
                            <td className="mono">{s.code}</td>
                            <td style={{maxWidth:200,overflow:'hidden',textOverflow:'ellipsis'}}>{s.name}</td>
                            <td>{flvPill(s.flavour)}</td>
                            <td>{clsPill(s.cls)}</td>
                            <td className="right">{fmt(s.qty)}</td>
                            <td className="right">{fmtH(s.hrs)}</td>
                            <td className="right">₹{fmt(s.rev)}</td>
                            <td className="right" style={{color: firstInGrp ? '#065f46' : '#94a3b8', fontWeight: firstInGrp ? 700 : 400}}>
                              {firstInGrp ? <>₹{fmt(grpRph,0)} <span style={{fontSize:10,fontWeight:400,color:'#94a3b8'}}>(G{gNum})</span></> : <span style={{fontSize:11}}>↑</span>}
                            </td>
                          </tr>
                        );
                        firstInGrp = false;
                      }
                    }
                    return rows;
                  })()}
                </tbody>
              </table>
            </div>

            {/* Group summary — deduplicate by index */}
            <div style={{marginBottom:8,display:'flex',flexWrap:'wrap',gap:'6px'}}>
              {r.groups.map((g,i) => {
                const label = g.pack_type && g.pack_type !== g.flavour ? `${g.flavour} · ${g.pack_type}` : g.flavour;
                return (
                  <span key={i} style={{fontSize:11,color:'#374151',background:'#f1f5f9',borderRadius:'6px',padding:'2px 8px'}}>
                    <b>G{i+1} {label}</b>: {fmtH(g.tHrs)} · ₹{fmt(g.rph,0)}/hr
                  </span>
                );
              })}
            </div>
          </div>
        );
      })}
    </div>
  );
}

// ─── LINE SCHEDULE TAB ───────────────────────────────────────────────────────
function ScheduleTab({ results, workingDays, setWorkingDays, config, skus, stockData, plan }) {
  const anyResult = results && ALL_LINES.some(l=>results[l]);
  const [startDate, setStartDate] = React.useState(() => {
    // Default to 1st of next month
    const d = new Date();
    d.setDate(1);
    d.setMonth(d.getMonth() + 1);
    return d.toISOString().slice(0,10);
  });
  const [calView, setCalView] = React.useState(true);

  // Shared: build list of 25 working days from startDate
  function buildWorkDates(sd) {
    const DAYS = ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
    const MONTHS = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
    const workDates = [];
    let cal = 0;
    while (workDates.length < 25) {
      const d = new Date(sd); d.setDate(sd.getDate() + cal++);
      if (d.getDay() !== 0) workDates.push({ date: d, label: `${d.getDate()} ${MONTHS[d.getMonth()]}`, day: DAYS[d.getDay()], dateNum: d.getDate(), month: d.getMonth(), year: d.getFullYear(), dow: d.getDay() });
    }
    return workDates;
  }

  function getLineDayPlan(line, workDates) {
    const r = results && results[line];
    const sh = config.shiftHours;
    if (!r) return workDates.map(() => []);
    const dayPlan = workDates.map(() => []);
    for (const item of r.daySeq) {
      if (item.type !== 'run') continue;
      const accStart = item.startDay - 1;
      const accEnd   = item.endDay - 1;
      for (let d = Math.floor(accStart); d < Math.ceil(accEnd) && d < 25; d++) {
        const overlap = Math.min(accEnd, d+1) - Math.max(accStart, d);
        const units = Math.round(overlap * sh * item.rph);
        if (units > 0) dayPlan[d].push({ name: item.name, units });
      }
    }
    return dayPlan;
  }

  function exportDailyPlan() {
    const wb = XLSX.utils.book_new();
    const sd = new Date(startDate + 'T00:00:00');
    const workDates = buildWorkDates(sd);

    const planL1  = getLineDayPlan('L1', workDates);
    const planL2  = getLineDayPlan('L2', workDates);
    const planSmp = getLineDayPlan('Sampler', workDates);

    // Build rows — one row per working day, split if multiple SKUs on same day/line
    const header = ['Date','Day','L1 — Product','L1 Units','L2 — Product','L2 Units','Sampler — Product','Sampler Units'];
    const aoa = [header];

    for (let d = 0; d < 25; d++) {
      const { label, day } = workDates[d];
      const segs = [planL1[d], planL2[d], planSmp[d]];
      const maxSeg = Math.max(1, ...segs.map(s=>s.length));
      for (let s = 0; s < maxSeg; s++) {
        const row = [s===0?label:'', s===0?day:''];
        segs.forEach(seg => {
          if (seg[s]) { row.push(seg[s].name); row.push(seg[s].units); }
          else { row.push(''); row.push(''); }
        });
        aoa.push(row);
      }
    }

    const ws = XLSX.utils.aoa_to_sheet(aoa);
    ws['!cols'] = [{wch:10},{wch:5},{wch:36},{wch:10},{wch:36},{wch:10},{wch:36},{wch:10}];
    XLSX.utils.book_append_sheet(wb, ws, 'Daily Plan');
    XLSX.writeFile(wb, 'Daily_Production_Plan.xlsx');
  }

  // Calendar view renderer
  function CalendarView() {
    const sd = new Date(startDate + 'T00:00:00');
    const workDates = buildWorkDates(sd);
    const planL1  = getLineDayPlan('L1', workDates);
    const planL2  = getLineDayPlan('L2', workDates);
    const planSmp = getLineDayPlan('Sampler', workDates);

    // Build SKU totals from daySeq (sum hours × rph per SKU per line)
    const skuTotals = []; // { line, code, name, units }
    const LINE_PLANS = [
      { key:'L1', plans:planL1 }, { key:'L2', plans:planL2 },
      { key:'Sampler', plans:planSmp },
    ];
    LINE_PLANS.forEach(({ key, plans }) => {
      const r = results && results[key];
      if (!r) return;
      const map = {};
      r.daySeq.forEach(item => {
        if (item.type !== 'run') return;
        if (!map[item.code]) map[item.code] = { line: key, code: item.code, name: item.name, units: 0 };
        map[item.code].units += Math.round(item.h * item.rph);
      });
      Object.values(map).forEach(v => {
        const skuDef = (skus||[]).find(s=>s.code===v.code);
        v.packSize = skuDef ? (skuDef.pack_size||0) : 0;
        v.tons = v.packSize * v.units / 1e6;
        v.planQty = Number((plan||{})[v.code]) || 0;
        v.gap = v.units - v.planQty; // positive = over-scheduled, negative = under
        skuTotals.push(v);
      });
    });

    // Group working days into calendar weeks (Mon=1 .. Sat=6)
    // We'll lay out a week grid starting from the first day's week
    const firstDow = workDates[0].dow; // 1=Mon..6=Sat
    // build a flat array of "slots": null = empty slot, or workDates index
    const DOW_COLS = [1,2,3,4,5,6]; // Mon..Sat
    // find starting column offset (0-based index into DOW_COLS)
    const startCol = DOW_COLS.indexOf(firstDow);
    const slots = [];
    for (let i = 0; i < startCol; i++) slots.push(null); // empty before first day
    workDates.forEach((_,i) => slots.push(i));
    // pad to fill last week
    while (slots.length % 6 !== 0) slots.push(null);

    const LINES = [
      { key: 'L1', plans: planL1, cls: 'l1', label: 'L1' },
      { key: 'L2', plans: planL2, cls: 'l2', label: 'L2' },
      { key: 'Sampler', plans: planSmp, cls: 'smp', label: 'SMP' },
    ];

    // chunk into weeks of 6
    const weeks = [];
    for (let i = 0; i < slots.length; i += 6) weeks.push(slots.slice(i, i+6));

    const LINE_CLS = { L1:'l1', L2:'l2', L3:'l3', Sampler:'smp' };

    return (
      <div>
        {/* SKU Totals Summary */}
        {skuTotals.length > 0 && (()=>{
          const totalUnits = skuTotals.reduce((a,s)=>a+s.units,0);
          const totalTons  = skuTotals.reduce((a,s)=>a+s.tons,0);
          return (
          <div className="settings-card" style={{marginBottom:16}}>
            <h3>Plan vs Actual Production</h3>
            <div className="tbl-wrap">
              <table>
                <thead>
                  <tr>
                    <th>Line</th>
                    <th>SKU Code</th>
                    <th>Product</th>
                    <th className="right">Pack (g)</th>
                    <th className="right">Plan (units)</th>
                    <th className="right">Actual (units)</th>
                    <th className="right">Gap</th>
                    <th className="right">Tons</th>
                  </tr>
                </thead>
                <tbody>
                  {skuTotals.map((s,i) => {
                    const gapColor = s.gap < 0 ? '#dc2626' : s.gap > 0 ? '#059669' : '#64748b';
                    const gapLabel = s.gap === 0 ? '—' : (s.gap > 0 ? '+' : '') + s.gap.toLocaleString();
                    return (
                    <tr key={i}>
                      <td><span className={`cal-line-tag ${LINE_CLS[s.line]}`} style={{fontWeight:700,display:'inline-block'}}>{LINE_LABELS[s.line]}</span></td>
                      <td className="mono" style={{fontSize:11}}>{s.code}</td>
                      <td style={{fontSize:12}}>{s.name}</td>
                      <td className="right">{s.packSize}</td>
                      <td className="right">{s.planQty > 0 ? s.planQty.toLocaleString() : <span style={{color:'#94a3b8'}}>—</span>}</td>
                      <td className="right" style={{fontWeight:700}}>{s.units.toLocaleString()}</td>
                      <td className="right" style={{fontWeight:700,color:gapColor}}>{gapLabel}</td>
                      <td className="right">{s.tons.toFixed(3)}</td>
                    </tr>
                    );
                  })}
                  <tr style={{background:'#ecfdf5',fontWeight:700,borderTop:'2px solid #6ee7b7'}}>
                    <td colSpan={4} style={{fontWeight:700,color:'#065f46'}}>TOTAL</td>
                    <td className="right">{skuTotals.reduce((a,s)=>a+s.planQty,0).toLocaleString()}</td>
                    <td className="right">{totalUnits.toLocaleString()}</td>
                    <td className="right" style={{color: totalUnits >= skuTotals.reduce((a,s)=>a+s.planQty,0) ? '#059669':'#dc2626'}}>
                      {(()=>{const g=totalUnits-skuTotals.reduce((a,s)=>a+s.planQty,0); return g===0?'—':(g>0?'+':'')+g.toLocaleString();})()}
                    </td>
                    <td className="right">{totalTons.toFixed(3)} T</td>
                  </tr>
                </tbody>
              </table>
            </div>
          </div>
          );
        })()}

        {/* Legend */}
        <div style={{display:'flex',gap:8,alignItems:'center',marginBottom:10,flexWrap:'wrap'}}>
          <span style={{fontSize:11,fontWeight:700,color:'#64748b'}}>Lines:</span>
          {LINES.map(l=><span key={l.key} className={`cal-line-tag ${l.cls}`} style={{fontWeight:700}}>{LINE_LABELS[l.key]}</span>)}
        </div>
        {/* Day headers */}
        <div className="cal-hdr-row">
          {['Mon','Tue','Wed','Thu','Fri','Sat'].map(d=><div key={d} className="cal-hdr-cell">{d}</div>)}
        </div>
        {/* Weeks */}
        {weeks.map((week, wi) => (
          <div key={wi} className="cal-grid" style={{marginTop:0}}>
            {week.map((slot, ci) => {
              if (slot === null) return <div key={ci} className="cal-empty-day"/>;
              const wd = workDates[slot];
              return (
                <div key={ci} className="cal-day">
                  <div className="cal-day-hdr">
                    <span className="cal-date">{wd.dateNum}</span>
                    <span className="cal-dow">{wd.day}</span>
                  </div>
                  {LINES.map(line => {
                    const segs = line.plans[slot];
                    if (!segs || segs.length === 0) return null;
                    return segs.map((seg, si) => (
                      <div key={line.key+si} className={`cal-line-tag ${line.cls}`}>
                        <div className="cal-line-label">{line.label}</div>
                        <div className="cal-product">{seg.name}</div>
                        <div className="cal-units">{seg.units.toLocaleString()} units</div>
                      </div>
                    ));
                  })}
                </div>
              );
            })}
          </div>
        ))}
      </div>
    );
  }

  return (
    <div>
      {/* Settings */}
      <div className="settings-card" style={{marginBottom:16}}>
        <h3>Schedule Settings</h3>
        <div className="field-row">
          {ALL_LINES.map(line=>(
            <div className="field-group" key={line}>
              <label>{LINE_LABELS[line]} (days)</label>
              <input type="number" min="1" max="31" value={workingDays[line]||''} onChange={e=>setWorkingDays(d=>({...d,[line]:Number(e.target.value)}))}/>
            </div>
          ))}
          <div className="field-group">
            <label>Month Start Date</label>
            <input type="date" value={startDate} onChange={e=>setStartDate(e.target.value)}/>
          </div>
          <div className="field-group" style={{justifyContent:'flex-end'}}>
            <label>&nbsp;</label>
            <span style={{fontSize:11,color:'#64748b',paddingBottom:6}}>{config.shiftHours}h shift · 25 working days</span>
          </div>
        </div>
        <div style={{display:'flex',gap:8,alignItems:'center',marginTop:8,flexWrap:'wrap'}}>
          {anyResult && <button className="btn btn-secondary" onClick={exportDailyPlan}>📅 Export Daily Plan (Excel)</button>}
          {anyResult && (
            <div style={{display:'flex',background:'#f0faf4',borderRadius:8,padding:2,border:'1px solid #a7f3d0'}}>
              <button className={`btn btn-sm ${calView?'btn-primary':'btn-secondary'}`} style={{borderRadius:6}} onClick={()=>setCalView(true)}>📅 Calendar</button>
              <button className={`btn btn-sm ${!calView?'btn-primary':'btn-secondary'}`} style={{borderRadius:6}} onClick={()=>setCalView(false)}>📋 Timeline</button>
            </div>
          )}
        </div>
      </div>

      {!anyResult && <div className="empty"><div className="icon">📅</div><p>Run the scheduler to see the day-wise production calendar.</p></div>}

      {/* Calendar View */}
      {anyResult && calView && <CalendarView/>}

      {/* Engine Logic Legend */}
      {anyResult && !calView && (
        <div style={{background:'#f8fafc',border:'1px solid #e2e8f0',borderRadius:10,padding:'12px 16px',marginBottom:14,fontSize:12,color:'#374151'}}>
          <div style={{fontWeight:700,marginBottom:8,color:'#1e293b',fontSize:13}}>📖 How the engine prioritises production</div>
          <div style={{display:'grid',gridTemplateColumns:'repeat(auto-fit,minmax(220px,1fr))',gap:10}}>
            <div style={{background:'#fef2f2',borderRadius:8,padding:'8px 12px',borderLeft:'4px solid #dc2626'}}>
              <div style={{fontWeight:700,marginBottom:3}}>🔴 Pass 1 — Survival (Must Make)</div>
              <div style={{color:'#6b7280'}}>FG stock &lt; Supply Plan demand. The gap must be produced — no budget cap. Closing = 0 after this run.</div>
              <div style={{marginTop:4,fontFamily:'monospace',fontSize:11,color:'#dc2626'}}>Make = Plan − FG</div>
            </div>
            <div style={{background:'#fffbeb',borderRadius:8,padding:'8px 12px',borderLeft:'4px solid #f59e0b'}}>
              <div style={{fontWeight:700,marginBottom:3}}>🟡 Pass 2 — 30-Day Cover (Best Effort)</div>
              <div style={{color:'#6b7280'}}>After Pass 1, closing stock &lt; 30×DRR. Fill up to a 30-day buffer, capped to remaining hours. Higher revenue SKUs go first.</div>
              <div style={{marginTop:4,fontFamily:'monospace',fontSize:11,color:'#d97706'}}>Need = 30×DRR − Closing after P1</div>
            </div>
            <div style={{background:'#eff6ff',borderRadius:8,padding:'8px 12px',borderLeft:'4px solid #2563eb'}}>
              <div style={{fontWeight:700,marginBottom:3}}>🔵 Pass 3 — Target DOI Top-up (Best Effort)</div>
              <div style={{color:'#6b7280'}}>After Pass 2, closing &lt; Target DOI × DRR (only if target &gt; 30 days). Top up further within remaining hours.</div>
              <div style={{marginTop:4,fontFamily:'monospace',fontSize:11,color:'#2563eb'}}>Need = TargetDOI×DRR − Closing after P2</div>
            </div>
            <div style={{background:'#f0fdf4',borderRadius:8,padding:'8px 12px',borderLeft:'4px solid #059669'}}>
              <div style={{fontWeight:700,marginBottom:3}}>⏭ Skipped</div>
              <div style={{color:'#6b7280'}}>Closing stock (with no production) already ≥ Target DOI stock. No run needed this month.</div>
              <div style={{marginTop:4,fontFamily:'monospace',fontSize:11,color:'#059669'}}>FG − Demand ≥ TargetDOI × DRR</div>
            </div>
          </div>
          <div style={{marginTop:8,color:'#94a3b8',fontSize:11}}>✂ = run was truncated by remaining hour budget &nbsp;·&nbsp; C/O = changeover time between flavours/pack types</div>
        </div>
      )}

      {/* Timeline / Table View */}
      {anyResult && !calView && ALL_LINES.map(line => {
        const r = results[line];
        if (!r) return null;
        const maxDay = r.budget / config.shiftHours;

        return (
          <div key={line}>
            <div className="line-hdr">
              <h3>{LINE_LABELS[line]}</h3>
              <div className="budget-bar-wrap"><div className={`budget-bar ${r.over?'over':'ok'}`} style={{width:`${Math.min(100,r.total/r.budget*100)}%`}}/></div>
              <span className="budget-label">{fmtH(r.total)} / {fmtH(r.budget)} ({workingDays[line]} days × {config.shiftHours}h)</span>
              {r.over && <span style={{color:'#dc2626',fontWeight:700}}>⚠ OVER</span>}
            </div>

            <div className="tbl-wrap" style={{marginBottom:12}}>
              <table>
                <thead>
                  <tr>
                    <th style={{width:32}}>Step</th>
                    <th>Type</th>
                    <th>SKU / Event</th>
                    <th>Product</th>
                    <th>Flavour</th>
                    <th className="right">Hours</th>
                    <th className="right">Units</th>
                    <th>Qty Logic</th>
                  </tr>
                </thead>
                <tbody>
                  {r.daySeq.map((item, i) => {
                    const isRun  = item.type === 'run';
                    const isTier = item.type === 'tier';
                    if (isTier) return (
                      <tr key={i}>
                        <td colSpan={8} style={{background:'#f8fafc',borderTop:'2px solid #e2e8f0',padding:'6px 12px',fontSize:12,fontWeight:700,color:'#475569'}}>
                          {item.label}
                        </td>
                      </tr>
                    );
                    // Build qty math for RUN rows
                    let qtyMath = null;
                    if (isRun) {
                      const sd = (stockData||{})[item.code] || {};
                      const skuDef = (skus||[]).find(s=>s.code===item.code);
                      const fg       = Number(sd.stock) || 0;
                      const drr      = Number(sd.drr)   || 0;
                      const planQty  = Number((plan||{})[item.code]) || 0;
                      const tDoi   = skuDef ? (skuDef.targetDoi||60) : 60;
                      const targetStock  = Math.round(tDoi * drr);
                      const closingStock = Math.max(0, fg - planQty);
                      const need         = Math.max(0, targetStock - closingStock);
                      const units = item.qty != null ? item.qty : Math.round(item.h * item.rph);
                      const phase = item.phase || (fg < planQty ? 'P1' : closingStock < targetStock ? 'P2' : '');
                      qtyMath = { fg, drr, planQty, tDoi, targetStock, closingStock, need, units, phase };
                    }
                    return (
                      <tr key={i} className={isRun?'':'co-row'}>
                        <td style={{textAlign:'center',color:'#94a3b8',fontSize:11}}>{i+1}</td>
                        <td>{isRun ? <span className="run-badge">{item.capped ? '✂ RUN' : 'RUN'}</span> : <span className="co-badge">C/O</span>}</td>
                        <td className="mono" style={{fontSize:isRun?11:10,color:isRun?'#1e293b':'#92400e'}}>{isRun?item.code:''}</td>
                        <td style={{maxWidth:180,overflow:'hidden',textOverflow:'ellipsis',fontSize:isRun?12:11}}>{isRun?item.name:item.label}</td>
                        <td>{isRun?flvPill(item.flavour):''}</td>
                        <td className="right">{fmtH(item.h)}</td>
                        <td className="right" style={{fontWeight:700}}>{isRun && qtyMath ? fmt(qtyMath.units) : ''}</td>
                        <td style={{fontSize:11,color:'#374151',whiteSpace:'nowrap'}}>
                          {isRun && qtyMath && (
                            <span>
                              {(() => {
                                const deficit = Math.max(0, qtyMath.planQty - qtyMath.fg);
                                const floor30 = Math.round(30*(qtyMath.drr||0));
                                const p2need  = Math.max(0, floor30 - qtyMath.closingStock);
                                const p3need  = Math.max(0, qtyMath.targetStock - qtyMath.closingStock);
                                const actual  = qtyMath.units;
                                const capped  = item.capped;
                                if (qtyMath.phase==='P1')
                                  return <>🔴 Deficit: Plan <b>{fmt(qtyMath.planQty)}</b> − FG <b>{fmt(qtyMath.fg)}</b> = <b style={{color:'#dc2626'}}>{fmt(deficit)}</b> units</>;
                                if (qtyMath.phase==='P2')
                                  return <>🟡 30-day need: <b>{fmt(p2need)}</b>{capped ? <> · ✂ made <b style={{color:'#f59e0b'}}>{fmt(actual)}</b> (budget cap)</> : <> · DRR {(qtyMath.drr||0).toFixed(1)}</>}</>;
                                if (qtyMath.phase==='P3')
                                  return <>🔵 DOI top-up need: <b>{fmt(p3need)}</b>{capped ? <> · ✂ made <b style={{color:'#2563eb'}}>{fmt(actual)}</b> (budget cap)</> : <> · DRR {(qtyMath.drr||0).toFixed(1)}</>}</>;
                                return <>Cover: Target <b>{fmt(qtyMath.targetStock)}</b> − Closing <b>{fmt(qtyMath.closingStock)}</b> = <b style={{color:'#059669'}}>{fmt(Math.max(0, qtyMath.targetStock - qtyMath.closingStock))}</b> units</>;
                              })()}
                            </span>
                          )}
                        </td>
                      </tr>
                    );
                  })}
                </tbody>
              </table>
            </div>
          </div>
        );
      })}
    </div>
  );
}

// ─── SETTINGS TAB ────────────────────────────────────────────────────────────
function SettingsTab({ config, setConfig, skus, setSkus }) {
  return (
    <div>
      <div className="settings-card">
        <h3>Factory Config — Sapiens</h3>
        <div className="field-row">
          <div className="field-group"><label>Shift hours</label>
            <input type="number" value={config.shiftHours} onChange={e=>setConfig(c=>({...c,shiftHours:Number(e.target.value)}))}/>
          </div>
          <div className="field-group"><label>Rate basis (h/day)</label>
            <input type="number" value={config.rateBasis} onChange={e=>setConfig(c=>({...c,rateBasis:Number(e.target.value)}))}/>
          </div>
          <div className="field-group"><label>C/O same flavour (h)</label>
            <input type="number" step="0.05" value={config.changeoverSame} onChange={e=>setConfig(c=>({...c,changeoverSame:Number(e.target.value)}))}/>
          </div>
          <div className="field-group"><label>C/O diff flavour (h)</label>
            <input type="number" step="0.05" value={config.changeoverDiff} onChange={e=>setConfig(c=>({...c,changeoverDiff:Number(e.target.value)}))}/>
          </div>
        </div>
        <p style={{fontSize:11,color:'#64748b',marginTop:8}}>Rate basis = hours assumed in the u/day rates (24 = full day). Effective rate per hour = u/day ÷ rate basis.</p>
      </div>

      <div className="settings-card">
        <h3>SKU Master — Class & ASP</h3>
        <p style={{fontSize:11,color:'#64748b',marginBottom:10}}>Seeded from Sapiens SONDJFM workbook. Edit Class and ASP here; all other fields are derived from pack type.</p>
        <div className="tbl-wrap tbl-scroll" style={{maxHeight:360}}>
          <table>
            <thead>
              <tr>
                <th>Code</th><th>Product</th><th>Line</th><th>Flavour</th>
                <th>Pack Type</th><th className="right">Pack Size</th>
                <th className="right">Rate (u/day)</th><th>Class</th><th className="right">ASP (₹)</th>
                <th className="right">Target DOI (days)</th>
              </tr>
            </thead>
            <tbody>
              {skus.map((sku,i) => (
                <tr key={sku.code}>
                  <td className="mono" style={{fontSize:10}}>{sku.code}</td>
                  <td style={{maxWidth:180,overflow:'hidden',textOverflow:'ellipsis'}}>{sku.name}</td>
                  <td>{getLine(sku.pack_type)}</td>
                  <td>{flvPill(sku.flavour)}</td>
                  <td>{sku.pack_type}</td>
                  <td className="right">{sku.pack_size}g</td>
                  <td className="right">{fmt(RATE_LOOKUP[`${sku.pack_type}|${sku.pack_size}`]||0)}</td>
                  <td>
                    <select value={sku.cls} onChange={e=>{const n=[...skus];n[i]={...n[i],cls:e.target.value};setSkus(n);}}>
                      <option>A</option><option>B</option><option>C</option>
                    </select>
                  </td>
                  <td className="right">
                    <input type="number" className="num-input" value={sku.asp}
                      onChange={e=>{const n=[...skus];n[i]={...n[i],asp:Number(e.target.value)};setSkus(n);}}/>
                  </td>
                  <td className="right">
                    <input type="number" min="1" className="num-input" value={sku.targetDoi||60}
                      onChange={e=>{const n=[...skus];n[i]={...n[i],targetDoi:Number(e.target.value)};setSkus(n);}}/>
                  </td>
                </tr>
              ))}
            </tbody>
          </table>
        </div>
      </div>

      <div className="settings-card">
        <h3>Supabase Setup — run this SQL once</h3>
        <pre className="sql">{`-- Run in Supabase SQL Editor
create table if not exists scheduler_data (
  id          uuid default gen_random_uuid() primary key,
  user_id     uuid references auth.users not null,
  factory_key text not null,
  name        text not null,
  data        jsonb not null default '{}',
  updated_at  timestamptz default now(),
  unique(user_id, factory_key)
);
alter table scheduler_data enable row level security;
create policy "scheduler_own" on scheduler_data
  for all using (auth.uid() = user_id);`}</pre>
      </div>
    </div>
  );
}

// ─── APP ─────────────────────────────────────────────────────────────────────
function App() {
  const sbRef     = useRef(null);
  const userRef   = useRef(null);
  const saveTimer = useRef(null);

  const [authState, setAuthState] = useState('loading');
  const [tab, setTab]             = useState('plan');
  const [skus, setSkus]           = useState(DEFAULT_SKUS);
  const [config, setConfig]       = useState(DEFAULT_CONFIG);
  const [workingDays, setWorkingDays] = useState(DEFAULT_WD);
  const [plan, setPlan]           = useState({});
  const [stockData, setStockData] = useState({});
  const [results, setResults]     = useState(null);
  const [scenario, setScenario]   = useState('A'); // 'A' = Revenue Max | 'B' = Min Changeover
  const [saveStatus, setSaveStatus] = useState('');

  // ── init supabase ──
  useEffect(() => {
    (async () => {
      const res = await fetch('/api/config');
      const { supabaseUrl, supabaseKey } = await res.json();
      const sb = window.supabase.createClient(supabaseUrl, supabaseKey);
      sbRef.current = sb;
      const { data: { session } } = await sb.auth.getSession();
      if (session) { userRef.current = session.user; await loadFromDB(sb, session.user.id); setAuthState('app'); }
      else setAuthState('login');
      sb.auth.onAuthStateChange(async (_e, session) => {
        if (session) { userRef.current = session.user; await loadFromDB(sb, session.user.id); setAuthState('app'); }
        else { userRef.current = null; setAuthState('login'); }
      });
    })();
  }, []);

  async function loadFromDB(sb, userId) {
    try {
      const { data, error } = await sb.from('scheduler_data').select('*').eq('user_id', userId).eq('factory_key', 'sapiens').single();
      if (error || !data) return;
      const d = data.data || {};
      if (d.skus) {
        const mapped = d.skus.map(s => { const def = DEFAULT_SKUS.find(x=>x.code===s.code); return def ? {...def,...s, targetDoi: s.targetDoi ?? def.targetDoi} : s; });
        const savedCodes = new Set(d.skus.map(s=>s.code));
        const newDefaults = DEFAULT_SKUS.filter(x=>!savedCodes.has(x.code));
        setSkus([...mapped, ...newDefaults]);
      }
      if (d.config)      setConfig(d.config);
      if (d.workingDays) setWorkingDays(d.workingDays);
      if (d.plan)        setPlan(d.plan);
      if (d.stockData)   setStockData(d.stockData);
    } catch(e) { console.warn('loadFromDB:', e.message); }
  }

  async function saveToDB(snapshot) {
    const sb = sbRef.current; const user = userRef.current;
    if (!sb || !user) return;
    setSaveStatus('saving…');
    try {
      await sb.from('scheduler_data').upsert({
        user_id: user.id, factory_key: 'sapiens', name: 'Sapiens',
        data: snapshot, updated_at: new Date().toISOString(),
      }, { onConflict: 'user_id,factory_key' });
      setSaveStatus('saved ✓');
      setTimeout(() => setSaveStatus(''), 2000);
    } catch(e) { setSaveStatus('save failed'); }
  }

  // Auto-save on state change (debounced)
  function triggerSave(patch) {
    clearTimeout(saveTimer.current);
    saveTimer.current = setTimeout(() => {
      saveToDB({ skus, config, workingDays, plan, stockData, ...patch });
    }, 1200);
  }

  // Wrap setters to trigger save
  const setPlanSaving     = v => { setPlan(v);        triggerSave({ plan: typeof v==='function' ? v(plan) : v }); };
  const setStockSaving    = v => { setStockData(v);   triggerSave({ stockData: typeof v==='function' ? v(stockData) : v }); };
  const setConfigSaving   = v => { setConfig(v);      triggerSave({ config: typeof v==='function' ? v(config) : v }); };
  const setSkusSaving     = v => { setSkus(v);        triggerSave({ skus: v }); };
  const setWDSaving       = v => { setWorkingDays(v); triggerSave({ workingDays: typeof v==='function' ? v(workingDays) : v }); };

  function handleRun(sc) {
    const r = runEngine(plan, skus, config, workingDays, sc || scenario, stockData);
    setResults(r);
    setTab('queue');
  }

  async function logout() {
    await sbRef.current?.auth.signOut();
  }

  if (authState === 'loading') return <div style={{padding:40,textAlign:'center',color:'#94a3b8'}}>Loading…</div>;
  if (authState === 'login')   return <LoginScreen sb={sbRef.current}/>;

  const TABS = [
    { key:'plan',     label:'Supply Plan' },
    { key:'queue',    label:'Priority Queue' },
    { key:'schedule', label:'Line Schedule' },
    { key:'settings', label:'Settings' },
  ];

  return (
    <div>
      <div className="app-header">
        <span style={{fontSize:20}}>🗓️</span>
        <h1>Production Scheduler</h1>
        <span className="badge">Sapiens · LJ</span>
        <div className="header-right">
          {/* Scenario toggle */}
          <div style={{display:'flex',alignItems:'center',gap:0,border:'1px solid #d1d5db',borderRadius:8,overflow:'hidden',fontSize:12}}>
            <button
              onClick={()=>{ setScenario('A'); if(results) handleRun('A'); }}
              style={{padding:'5px 12px',border:'none',cursor:'pointer',fontWeight:600,
                background: scenario==='A' ? '#059669' : '#fff',
                color:      scenario==='A' ? '#fff'    : '#374151',
                transition:'all .15s'}}>
              A — Revenue Max
            </button>
            <button
              onClick={()=>{ setScenario('B'); if(results) handleRun('B'); }}
              style={{padding:'5px 12px',border:'none',borderLeft:'1px solid #d1d5db',cursor:'pointer',fontWeight:600,
                background: scenario==='B' ? '#7c3aed' : '#fff',
                color:      scenario==='B' ? '#fff'    : '#374151',
                transition:'all .15s'}}>
              B — Min Changeover
            </button>
          </div>
          {saveStatus && <span style={{fontSize:11,color:'#059669'}}>{saveStatus}</span>}
          <span>{userRef.current?.email}</span>
          <button className="btn btn-secondary btn-sm" onClick={logout}>Logout</button>
        </div>
      </div>

      <div className="tabs">
        {TABS.map(t => (
          <button key={t.key} className={`tab-btn${tab===t.key?' active':''}`} onClick={()=>setTab(t.key)}>
            {t.label}
            {t.key==='queue' && results && <span style={{marginLeft:4,background:'#059669',color:'white',borderRadius:8,padding:'1px 5px',fontSize:10}}>✓</span>}
          </button>
        ))}
      </div>

      <div className="content">
        {tab === 'plan'     && <SupplyPlanTab skus={skus} plan={plan} setPlan={setPlanSaving} stockData={stockData} setStockData={setStockSaving} onRun={handleRun} results={results} config={config}/>}
        {tab === 'queue'    && <QueueTab results={results} workingDays={workingDays} config={config} scenario={scenario}/>}
        {tab === 'schedule' && <ScheduleTab results={results} workingDays={workingDays} setWorkingDays={setWDSaving} config={config} skus={skus} stockData={stockData} plan={plan}/>}
        {tab === 'settings' && <SettingsTab config={config} setConfig={setConfigSaving} skus={skus} setSkus={setSkusSaving}/>}
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
