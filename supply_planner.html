<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Mosaic Supply Planner</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.5/babel.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: Arial, sans-serif; font-size: 13px; background: #f1f5f9; color: #1e293b; }
    #root { min-height: 100vh; }

    /* ── layout ── */
    .app-header { background: #1e293b; color: white; padding: 12px 20px; display: flex; align-items: center; gap: 16px; }
    .app-header h1 { font-size: 17px; font-weight: 700; letter-spacing: .3px; }
    .app-header .badge { background: #4f46e5; color: white; font-size: 11px; padding: 2px 8px; border-radius: 10px; }
    .month-labels { margin-left: auto; display: flex; gap: 8px; align-items: center; }
    .month-labels label { font-size: 11px; color: #94a3b8; }
    .month-input { background: #334155; border: 1px solid #475569; color: white; border-radius: 4px; padding: 3px 6px; width: 70px; font-size: 12px; }

    .tabs { background: white; border-bottom: 1px solid #e2e8f0; display: flex; gap: 0; }
    .tab-btn { padding: 12px 22px; cursor: pointer; border: none; background: none; font-size: 13px; color: #64748b; border-bottom: 3px solid transparent; transition: all .15s; font-family: Arial, sans-serif; }
    .tab-btn:hover { color: #4f46e5; background: #f8fafc; }
    .tab-btn.active { color: #4f46e5; border-bottom-color: #4f46e5; font-weight: 600; }

    .content { padding: 16px 20px; }

    /* ── toolbar ── */
    .toolbar { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; margin-bottom: 12px; }
    .toolbar .sub-tabs { display: flex; background: #e2e8f0; border-radius: 6px; padding: 2px; }
    .sub-tab { padding: 5px 14px; border-radius: 4px; cursor: pointer; font-size: 12px; color: #64748b; border: none; background: none; font-family: Arial, sans-serif; }
    .sub-tab.active { background: white; color: #4f46e5; font-weight: 600; box-shadow: 0 1px 3px rgba(0,0,0,.1); }
    .btn { padding: 6px 12px; border-radius: 6px; cursor: pointer; font-size: 12px; border: 1px solid transparent; font-family: Arial, sans-serif; display: inline-flex; align-items: center; gap: 5px; }
    .btn-primary { background: #4f46e5; color: white; border-color: #4f46e5; }
    .btn-primary:hover { background: #4338ca; }
    .btn-secondary { background: white; color: #374151; border-color: #d1d5db; }
    .btn-secondary:hover { background: #f9fafb; }
    .btn-danger { background: #ef4444; color: white; border-color: #ef4444; }
    .btn-danger:hover { background: #dc2626; }
    .btn-sm { padding: 3px 8px; font-size: 11px; }
    .btn-icon { background: none; border: none; cursor: pointer; color: #64748b; padding: 2px 4px; font-size: 14px; }
    .btn-icon:hover { color: #4f46e5; }
    .spacer { flex: 1; }
    .label-info { font-size: 11px; color: #94a3b8; }

    /* ── table ── */
    .tbl-wrap { overflow: auto; max-height: calc(100vh - 200px); border: 1px solid #e2e8f0; border-radius: 8px; background: white; }
    table { border-collapse: collapse; width: 100%; }
    thead th { position: sticky; top: 0; z-index: 5; background: #1e293b; color: white; padding: 8px 10px; text-align: left; font-size: 11px; font-weight: 600; white-space: nowrap; border-right: 1px solid #334155; }
    thead th.group-hdr { text-align: center; background: #0f172a; font-size: 10px; letter-spacing: .5px; text-transform: uppercase; color: #94a3b8; }
    thead th.m1-hdr { background: #1e3a5f; }
    thead th.m2-hdr { background: #1e4d3b; }
    tbody tr:nth-child(even) { background: #f8fafc; }
    tbody tr:hover { background: #eff6ff; }
    td { padding: 6px 10px; border-right: 1px solid #f1f5f9; border-bottom: 1px solid #f1f5f9; white-space: nowrap; vertical-align: middle; }
    td.m1-col { background: rgba(30,58,95,.04); }
    td.m2-col { background: rgba(30,77,59,.04); }
    td.center { text-align: center; }
    td.right { text-align: right; }
    td.monospace { font-family: monospace; font-size: 12px; }
    .num-input { width: 80px; padding: 3px 5px; border: 1px solid #d1d5db; border-radius: 4px; font-size: 12px; text-align: right; }
    .num-input:focus { outline: none; border-color: #4f46e5; box-shadow: 0 0 0 2px rgba(79,70,229,.2); }
    .status-pill { display: inline-block; padding: 2px 8px; border-radius: 10px; font-size: 10px; font-weight: 600; text-transform: uppercase; letter-spacing: .3px; }
    .status-none { background: #d1fae5; color: #065f46; }
    .status-desired { background: #fef3c7; color: #92400e; }
    .status-excess { background: #fee2e2; color: #991b1b; }
    .status-dash { color: #94a3b8; font-size: 12px; }

    /* ── modal ── */
    .modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,.5); z-index: 200; display: flex; align-items: center; justify-content: center; padding: 20px; }
    .modal { background: white; border-radius: 12px; padding: 0; max-width: 760px; width: 100%; max-height: 90vh; display: flex; flex-direction: column; box-shadow: 0 20px 60px rgba(0,0,0,.3); }
    .modal-hdr { padding: 18px 24px; border-bottom: 1px solid #e2e8f0; display: flex; align-items: center; gap: 10px; }
    .modal-hdr h2 { font-size: 15px; font-weight: 700; flex: 1; }
    .modal-body { padding: 20px 24px; overflow-y: auto; flex: 1; display: flex; flex-direction: column; gap: 16px; }
    .modal-ftr { padding: 14px 24px; border-top: 1px solid #e2e8f0; display: flex; gap: 8px; justify-content: flex-end; }

    /* ── import-specific ── */
    .upload-zone { border: 2px dashed #c7d2fe; border-radius: 8px; padding: 32px; text-align: center; color: #6366f1; cursor: pointer; transition: all .15s; }
    .upload-zone:hover, .upload-zone.drag { border-color: #4f46e5; background: #eef2ff; }
    .upload-zone input { display: none; }
    .upload-icon { font-size: 32px; margin-bottom: 8px; }
    .upload-text { font-size: 13px; font-weight: 600; }
    .upload-hint { font-size: 11px; color: #94a3b8; margin-top: 4px; }
    .col-detect { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
    .col-card { border: 1px solid #e2e8f0; border-radius: 8px; padding: 12px; }
    .col-card label { font-size: 11px; font-weight: 600; color: #64748b; display: block; margin-bottom: 6px; text-transform: uppercase; }
    .col-card select { width: 100%; padding: 6px 8px; border: 1px solid #d1d5db; border-radius: 4px; font-size: 12px; }
    .preview-tbl { width: 100%; border-collapse: collapse; font-size: 11px; }
    .preview-tbl th { background: #f8fafc; padding: 4px 8px; border: 1px solid #e2e8f0; text-align: left; }
    .preview-tbl td { padding: 3px 8px; border: 1px solid #f1f5f9; }
    .preview-tbl .hi { background: #eef2ff; font-weight: 600; }
    .match-summary { display: flex; gap: 16px; }
    .match-card { flex: 1; border-radius: 8px; padding: 12px 16px; text-align: center; }
    .match-card.ok { background: #d1fae5; }
    .match-card.warn { background: #fef3c7; }
    .match-card .big { font-size: 24px; font-weight: 700; }
    .match-card .lbl { font-size: 11px; color: #64748b; margin-top: 2px; }
    .unmatched-list { max-height: 200px; overflow-y: auto; border: 1px solid #e2e8f0; border-radius: 6px; }
    .unmatched-list table { width: 100%; border-collapse: collapse; font-size: 11px; }
    .unmatched-list th { background: #fef3c7; padding: 5px 10px; text-align: left; position: sticky; top: 0; }
    .unmatched-list td { padding: 4px 10px; border-bottom: 1px solid #f1f5f9; }

    /* ── vendor map ── */
    .vmap-row { display: flex; gap: 8px; align-items: center; padding: 6px 0; border-bottom: 1px solid #f1f5f9; }
    .vmap-row input { flex: 1; padding: 5px 8px; border: 1px solid #d1d5db; border-radius: 4px; font-size: 12px; }
    .vmap-row select { flex: 1.5; padding: 5px 8px; border: 1px solid #d1d5db; border-radius: 4px; font-size: 12px; }
    .chip { display: inline-flex; align-items: center; gap: 4px; background: #e0e7ff; color: #4338ca; padding: 2px 7px; border-radius: 10px; font-size: 10px; }
    .chip-remove { cursor: pointer; color: #818cf8; font-size: 12px; line-height: 1; }
    .chip-remove:hover { color: #4338ca; }

    /* ── misc ── */
    .badge-cnt { background: #4f46e5; color: white; border-radius: 10px; padding: 1px 6px; font-size: 10px; margin-left: 4px; }
    .empty-state { text-align: center; padding: 40px; color: #94a3b8; }
    .empty-state .icon { font-size: 36px; margin-bottom: 8px; }
    .info-box { background: #eff6ff; border: 1px solid #bfdbfe; border-radius: 6px; padding: 10px 14px; font-size: 12px; color: #1e40af; }
    .warn-box { background: #fffbeb; border: 1px solid #fde68a; border-radius: 6px; padding: 10px 14px; font-size: 12px; color: #92400e; }
    .section-title { font-size: 12px; font-weight: 700; color: #374151; text-transform: uppercase; letter-spacing: .5px; margin-bottom: 8px; }
    .dot { width: 8px; height: 8px; border-radius: 50%; display: inline-block; }
    .dot-green { background: #10b981; }
    .dot-yellow { background: #f59e0b; }
    .dot-red { background: #ef4444; }
    .search-input { padding: 6px 10px; border: 1px solid #d1d5db; border-radius: 6px; font-size: 12px; width: 200px; }
    .search-input:focus { outline: none; border-color: #4f46e5; }
    .toggle-row { display: flex; gap: 10px; align-items: center; font-size: 12px; }
    .toggle-row label { color: #374151; font-weight: 500; }
    .toggle-row select { padding: 4px 8px; border: 1px solid #d1d5db; border-radius: 4px; font-size: 12px; }
    a.link { color: #4f46e5; cursor: pointer; text-decoration: underline; }
  </style>
</head>

// ─────────────────────────────────────────────
function isNumeric(v) {
  if (v == null || v === '') return false;
  return !isNaN(parseFloat(String(v).replace(/,/g,'')));
}

function parseNum(v) {
  if (v == null || v === '') return 0;
  const n = parseFloat(String(v).replace(/,/g,''));
  return isNaN(n) ? 0 : n;
}

function fmt(n, dec=0) {
  if (n == null) return '—';
  return Number(n).toLocaleString('en-IN', {minimumFractionDigits: dec, maximumFractionDigits: dec});
}

function fmtPct(n) {
  if (!n) return '—';
  return (n * 100).toFixed(1) + '%';
}

// ─────────────────────────────────────────────
// MATERIAL RESOLUTION (match import codes/names to internal IDs)
// ─────────────────────────────────────────────
function resolveInternal(value, materials) {
  if (!value) return [];
  const v = String(value).trim();
  const vn = norm(v);
  const matches = new Set();
  for (const m of materials) {
    const candidates = [m.id, m.code, m.name, ...(m.aliases || []), ...(m.mosaicCodes || [])];
    for (const c of candidates) {
      if (c && norm(String(c)) === vn) { matches.add(m.id); break; }
    }
  }
  return [...matches];
}

function resolveAll(value, materials, vendorMap) {
  if (!value) return [];
  const v = String(value).trim();
  // Check vendorMap first: external code → internal id
  const mapped = vendorMap && vendorMap[norm(v)];
  if (mapped) return Array.isArray(mapped) ? mapped : [mapped];
  const vn = norm(v);
  const matches = new Set();
  for (const m of materials) {
    // Check sprivilCode (may be comma-separated)
    const spCodes = String(m.sprivilCode || '').split(',').map(c => norm(c.trim())).filter(Boolean);
    if (spCodes.includes(vn)) { matches.add(m.id); continue; }
    const candidates = [m.id, m.code, m.name, ...(m.aliases || []), ...(m.mosaicCodes || [])];
    for (const c of candidates) {
      if (c && norm(String(c)) === vn) { matches.add(m.id); break; }
    }
  }
  return [...matches];
}

// ─────────────────────────────────────────────
// CALCULATIONS
// ─────────────────────────────────────────────
function calcM1(mat) {
  const { stock, openPO, reqM1, moq } = mat;
  const avail = (stock||0) + (openPO||0);
  const req = reqM1||0;
  const doc = req > 0 ? ((stock||0) * 30 / req) : null;
  const desired = Math.max(0, req - avail);
  let actual;
  if (desired === 0) { actual = 0; }
  else if ((moq||0) > 0 && desired < (moq||0)) { actual = moq; }
  else { actual = desired; }
  const isExcess = actual > desired && desired > 0;
  const status = desired === 0 ? 'none' : isExcess ? 'excess' : 'desired';
  const diff = isExcess && desired > 0 ? (actual - desired) / desired : 0;
  return { avail, doc, desired, actual, status, diff };
}

function calcM2(mat, m1) {
  const { stock, openPO, supplyM2, reqM1, reqM2, moq } = mat;
  const opening = Math.max(0, (stock||0) + (openPO||0) + (m1.actual||0) - (reqM1||0));
  const avail = opening + (supplyM2||0);
  const req = reqM2||0;
  const doc = req > 0 ? (opening * 30 / req) : null;
  const desired = Math.max(0, req - avail);
  let actual;
  if (desired === 0) { actual = 0; }
  else if ((moq||0) > 0 && desired < (moq||0)) { actual = moq; }
  else { actual = desired; }
  const isExcess = actual > desired && desired > 0;
  const status = desired === 0 ? 'none' : isExcess ? 'excess' : 'desired';
  const diff = isExcess && desired > 0 ? (actual - desired) / desired : 0;
  return { opening, avail, doc, desired, actual, status, diff };
}

// ─────────────────────────────────────────────
// FILE PARSING
// ─────────────────────────────────────────────
async function parseUpload(file) {
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onload = e => {
      try {
        const data = e.target.result;
        const wb = XLSX.read(data, { type: 'binary' });
        const ws = wb.Sheets[wb.SheetNames[0]];
        const rows = XLSX.utils.sheet_to_json(ws, { header: 1, defval: '' });
        // find header row (first row with >1 non-empty cell)
        let headerIdx = 0;
        for (let i = 0; i < Math.min(10, rows.length); i++) {
          const nonEmpty = rows[i].filter(c => String(c).trim() !== '').length;
          if (nonEmpty > 1) { headerIdx = i; break; }
        }
        const headers = rows[headerIdx].map(h => String(h).trim());
        const dataRows = rows.slice(headerIdx + 1)
          .filter(r => r.some(c => String(c).trim() !== ''))
          .map(r => {
            const obj = {};
            headers.forEach((h, i) => { obj[h] = r[i] != null ? r[i] : ''; });
            return obj;
          });
        resolve({ headers, rows: dataRows });
      } catch(err) { reject(err); }
    };
    reader.onerror = reject;
    reader.readAsBinaryString(file);
  });
}

function detectIdentifierCol(headers, rows, materials, vendorMap) {
  let best = { col: headers[0], score: -1 };
  for (const h of headers) {
    let score = 0;
    for (const row of rows) {
      const ids = resolveAll(row[h], materials, vendorMap);
      if (ids.length > 0) score++;
    }
    if (score > best.score) best = { col: h, score };
  }
  return best;
}

function detectQtyCol(headers, rows, excludeCol) {
  let best = { col: null, score: -1 };
  for (const h of headers) {
    if (h === excludeCol) continue;
    let score = 0;
    for (const row of rows) {
      if (isNumeric(row[h])) score++;
    }
    if (score > best.score) best = { col: h, score };
  }
  return best;
}

// Detect M1 and M2 qty columns from header text
function detectReqCols(headers, excludeCol) {
  const m1kw = ['m1','month1','month 1','req1','reqm1','qty1','quantity1'];
  const m2kw = ['m2','month2','month 2','req2','reqm2','qty2','quantity2'];
  let m1col = null, m2col = null;
  for (const h of headers) {
    if (h === excludeCol) continue;
    const hn = h.toLowerCase().replace(/\s+/g,'');
    if (!m1col && m1kw.some(k => hn.includes(k))) m1col = h;
    else if (!m2col && m2kw.some(k => hn.includes(k))) m2col = h;
  }
  // fallback: first two numeric-looking columns
  if (!m1col || !m2col) {
    const numeric = headers.filter(h => h !== excludeCol && h !== m1col && h !== m2col);
    if (!m1col) m1col = numeric[0] || null;
    if (!m2col) m2col = numeric[1] || null;
  }
  return { m1col, m2col };
}

// ─────────────────────────────────────────────
// IMPORT MODAL
// ─────────────────────────────────────────────
function ImportModal({ title, importType, materials, vendorMap, onApply, onClose }) {
  // importType: 'stock' | 'supplyM1' | 'supplyM2' | 'req' | 'moq'
  const [phase, setPhase] = useState('upload'); // upload | configure | preview | done
  const [drag, setDrag] = useState(false);
  const [parsed, setParsed] = useState(null); // {headers, rows}
  const [idCol, setIdCol] = useState('');
  const [qtyCol, setQtyCol] = useState('');
  const [m1Col, setM1Col] = useState('');
  const [m2Col, setM2Col] = useState('');
  const [reqMode, setReqMode] = useState('vendor'); // 'internal' | 'vendor'
  const [result, setResult] = useState(null); // {updates, unmatched}
  const [error, setError] = useState('');
  const fileRef = useRef();
  const isReq = importType === 'req';

  async function handleFile(file) {
    if (!file) return;
    setError('');
    try {
      const p = await parseUpload(file);
      setParsed(p);
      // auto-detect
      const idDet = detectIdentifierCol(p.headers, p.rows, materials, vendorMap);
      setIdCol(idDet.col || p.headers[0] || '');
      if (isReq) {
        const { m1col, m2col } = detectReqCols(p.headers, idDet.col || '');
        setM1Col(m1col || '');
        setM2Col(m2col || '');
      } else {
        const qtyDet = detectQtyCol(p.headers, p.rows, idDet.col || '');
        setQtyCol(qtyDet.col || '');
      }
      setPhase('configure');
    } catch(e) {
      setError('Failed to parse file: ' + e.message);
    }
  }

  function runPreview() {
    if (!parsed) return;
    const resolveFn = isReq && reqMode === 'internal'
      ? (v) => resolveInternal(v, materials)
      : (v) => resolveAll(v, materials, vendorMap);

    const updates = {}; // matId → delta
    const unmatched = [];

    for (const row of parsed.rows) {
      const rawId = row[idCol];
      const ids = resolveFn(rawId);

      if (ids.length === 0) {
        unmatched.push({ identifier: rawId, reason: 'Identifier not recognised' });
        continue;
      }

      if (isReq) {
        const v1 = m1Col ? parseNum(row[m1Col]) : 0;
        const v2 = m2Col ? parseNum(row[m2Col]) : 0;
        if (!m1Col && !m2Col) {
          unmatched.push({ identifier: rawId, reason: 'No M1/M2 qty columns selected' });
          continue;
        }
        for (const id of ids) {
          if (!updates[id]) updates[id] = { reqM1: 0, reqM2: 0 };
          updates[id].reqM1 += v1;
          updates[id].reqM2 += v2;
        }
      } else {
        const rawQty = row[qtyCol];
        if (!isNumeric(rawQty)) {
          unmatched.push({ identifier: rawId, reason: 'No numeric quantity in this row' });
          continue;
        }
        const qty = parseNum(rawQty);
        for (const id of ids) {
          if (!updates[id]) updates[id] = { [importType]: importType === 'moq' ? Infinity : 0 };
          if (importType === 'moq') {
            updates[id][importType] = Math.min(updates[id][importType], qty);
          } else {
            updates[id][importType] = (updates[id][importType] || 0) + qty;
          }
        }
      }
    }

    // clean up MOQ Infinity
    for (const id of Object.keys(updates)) {
      if (importType === 'moq' && updates[id].moq === Infinity) updates[id].moq = 0;
    }

    setResult({ updates, unmatched });
    setPhase('preview');
  }

  function apply() {
    if (!result) return;
    onApply(result.updates, importType, isReq);
    setPhase('done');
  }

  const matchedCount = result ? Object.keys(result.updates).length : 0;
  const unmatchedCount = result ? result.unmatched.length : 0;

  return (
    <div className="modal-overlay" onClick={e => e.target === e.currentTarget && onClose()}>
      <div className="modal">
        <div className="modal-hdr">
          <h2>📥 {title}</h2>
          <button className="btn btn-secondary btn-sm" onClick={onClose}>✕ Close</button>
        </div>
        <div className="modal-body">
          {error && <div className="warn-box">⚠️ {error}</div>}

          {phase === 'upload' && (
            <div
              className={`upload-zone${drag?' drag':''}`}
              onDragOver={e=>{e.preventDefault();setDrag(true);}}
              onDragLeave={()=>setDrag(false)}
              onDrop={e=>{e.preventDefault();setDrag(false);handleFile(e.dataTransfer.files[0]);}}
              onClick={()=>fileRef.current.click()}
            >
              <input ref={fileRef} type="file" accept=".csv,.xlsx,.xls" onChange={e=>handleFile(e.target.files[0])} />
              <div className="upload-icon">📂</div>
              <div className="upload-text">Drop a CSV or XLSX file here</div>
              <div className="upload-hint">Supported: .csv · .xlsx · .xls</div>
            </div>
          )}

          {phase === 'configure' && parsed && (
            <>
              <div className="info-box">
                📊 Loaded <strong>{parsed.rows.length}</strong> data rows across <strong>{parsed.headers.length}</strong> columns.
                Review the auto-detected columns below and adjust if needed.
              </div>

              {isReq && (
                <div className="toggle-row">
                  <label>Match identifiers by:</label>
                  <select value={reqMode} onChange={e=>setReqMode(e.target.value)}>
                    <option value="vendor">Vendor code / full resolution (§4)</option>
                    <option value="internal">Internal code / name only</option>
                  </select>
                </div>
              )}

              <div className="col-detect">
                <div className="col-card">
                  <label>Identifier column</label>
                  <select value={idCol} onChange={e=>setIdCol(e.target.value)}>
                    {parsed.headers.map(h=><option key={h} value={h}>{h || '(blank)'}</option>)}
                  </select>
                </div>
                {!isReq && (
                  <div className="col-card">
                    <label>Quantity column</label>
                    <select value={qtyCol} onChange={e=>setQtyCol(e.target.value)}>

                      <label>M2 quantity column</label>
                      <select value={m2Col} onChange={e=>setM2Col(e.target.value)}>

                        {parsed.headers.filter(h=>h!==idCol&&h!==m1Col).map(h=><option key={h} value={h}>{h}</option>)}

                        </tr>
                      ))}
                    </tbody>
                  </table>
                </div>
              </div>
            </>
          )}

          {phase === 'preview' && result && (
            <>
              <div className="match-summary">
                <div className="match-card ok">
                  <div className="big">{matchedCount}</div>
                  <div className="lbl">materials matched</div>
                </div>
                <div className={`match-card${unmatchedCount>0?' warn':' ok'}`}>
                  <div className="big">{unmatchedCount}</div>
                  <div className="lbl">rows unmatched</div>
                </div>

              {unmatchedCount > 0 && (
                <div>
                  <div className="section-title">Unmatched rows</div>
                  <div className="unmatched-list">
                    <table>
                      <thead><tr><th>Identifier</th><th>Reason</th></tr></thead>
                      <tbody>
                        {result.unmatched.map((u,i)=>(

              {matchedCount > 0 && (
                <div>
                  <div className="section-title">Changes to apply</div>
                  <div className="unmatched-list" style={{maxHeight:'150px'}}>
                    <table>
                      <thead>
                        <tr>
                          <th>Material ID</th>
                          {isReq ? <><th>Req M1</th><th>Req M2</th></> : <th>{importType === 'moq' ? 'MOQ' : 'Qty'}</th>}
                        </tr>
                      </thead>
                      <tbody>
                        {Object.entries(result.updates).map(([id,upd])=>(
                          <tr key={id}>
                            <td style={{fontFamily:'monospace',fontSize:'11px'}}>{id}</td>
                            {isReq ? <><td>{fmt(upd.reqM1)}</td><td>{fmt(upd.reqM2)}</td></> : <td>{fmt(Object.values(upd)[0])}</td>}

                      </tbody>
                    </table>
                  </div>
                </div>

          {phase === 'done' && (
            <div style={{textAlign:'center',padding:'24px'}}>
              <div style={{fontSize:'40px'}}>✅</div>
              <div style={{marginTop:'8px',fontWeight:'600',color:'#065f46'}}>Import applied successfully</div>
              <div style={{fontSize:'12px',color:'#64748b',marginTop:'4px'}}>{matchedCount} materials updated</div>

          )}
        </div>
        <div className="modal-ftr">
          {phase === 'upload' && (
            <button className="btn btn-secondary" onClick={onClose}>Cancel</button>
          )}
          {phase === 'configure' && (
            <>
              <button className="btn btn-secondary" onClick={()=>setPhase('upload')}>← Back</button>
              <button className="btn btn-primary" onClick={runPreview}>Preview →</button>
            </>
          )}
          {phase === 'preview' && (
            <>
              <button className="btn btn-secondary" onClick={()=>setPhase('configure')}>← Back</button>
              <button className="btn btn-primary" disabled={matchedCount===0} onClick={apply}>Apply {matchedCount} updates</button>
            </>
          )}
          {phase === 'done' && (
            <button className="btn btn-primary" onClick={onClose}>Done</button>
          )}
        </div>
      </div>
    </div>
  );
}

// ─────────────────────────────────────────────
// VENDOR MAP MODAL
// ─────────────────────────────────────────────
function VendorMapModal({ vendorMap, rmMaterials, pmMaterials, onSave, onClose }) {
  const [entries, setEntries] = useState(() =>
    Object.entries(vendorMap).map(([vc, ids]) => ({ vc, ids: [...ids], id: Math.random() }))
  );
  const [newVc, setNewVc] = useState('');
  const allMats = [...rmMaterials, ...pmMaterials];

  function addEntry() {
    if (!newVc.trim()) return;
    setEntries(e => [...e, { vc: newVc.trim(), ids: [], id: Math.random() }]);
    setNewVc('');
  }

  function removeEntry(idx) {
    setEntries(e => e.filter((_,i)=>i!==idx));
  }

  function toggleMat(idx, matId) {
    setEntries(e => e.map((ent,i) => {
      if (i !== idx) return ent;
      const ids = ent.ids.includes(matId) ? ent.ids.filter(x=>x!==matId) : [...ent.ids, matId];
      return { ...ent, ids };
    }));
  }

  function save() {
    const map = {};
    for (const { vc, ids } of entries) {
      if (vc.trim() && ids.length > 0) map[vc.trim()] = ids;
    }
    onSave(map);
    onClose();
  }

  return (
    <div className="modal-overlay" onClick={e=>e.target===e.currentTarget&&onClose()}>
      <div className="modal" style={{maxWidth:'900px'}}>
        <div className="modal-hdr">
          <h2>🔗 Vendor Code Map</h2>
          <button className="btn btn-secondary btn-sm" onClick={onClose}>✕</button>
        </div>
        <div className="modal-body">
          <div className="info-box">
            Map vendor/external codes to one or more internal materials. Used by all imports for identifier resolution (§4 priority 3).
            Entries here survive file imports — they are permanently saved.
          </div>
          <div style={{display:'flex',gap:'8px',marginBottom:'4px'}}>
            <input
              className="num-input" style={{width:'300px',textAlign:'left'}}
              placeholder="New vendor code / sub-name…"
              value={newVc} onChange={e=>setNewVc(e.target.value)}
              onKeyDown={e=>e.key==='Enter'&&addEntry()}
            />
            <button className="btn btn-primary btn-sm" onClick={addEntry}>+ Add</button>
          </div>
          <div style={{maxHeight:'420px',overflowY:'auto',border:'1px solid #e2e8f0',borderRadius:'6px',padding:'8px'}}>
            {entries.length === 0 && <div className="empty-state" style={{padding:'24px'}}>No vendor codes defined yet.</div>}
            {entries.map((ent, idx) => (
              <div key={ent.id} style={{borderBottom:'1px solid #f1f5f9',paddingBottom:'12px',marginBottom:'12px'}}>
                <div style={{display:'flex',gap:'8px',alignItems:'center',marginBottom:'6px'}}>
                  <input
                    className="num-input" style={{width:'280px',textAlign:'left'}}
                    value={ent.vc}
                    onChange={e=>setEntries(prev=>prev.map((x,i)=>i===idx?{...x,vc:e.target.value}:x))}
                  />
                  <span style={{fontSize:'11px',color:'#64748b'}}>→ maps to:</span>
                  <button className="btn btn-danger btn-sm" onClick={()=>removeEntry(idx)}>Remove</button>
                </div>
                <div style={{display:'flex',flexWrap:'wrap',gap:'4px',marginLeft:'8px'}}>
                  {allMats.map(m=>(
                    <button
                      key={m.id}
                      onClick={()=>toggleMat(idx,m.id)}
                      style={{
                        padding:'2px 8px',fontSize:'10px',borderRadius:'10px',cursor:'pointer',
                        border:'1px solid',
                        background:ent.ids.includes(m.id)?'#4f46e5':'white',
                        color:ent.ids.includes(m.id)?'white':'#374151',
                        borderColor:ent.ids.includes(m.id)?'#4f46e5':'#d1d5db',
                      }}
                    >
                      {m.code||m.id} — {m.name.slice(0,30)}
                    </button>
                  ))}
                </div>
              </div>
            ))}
          </div>
        </div>
        <div className="modal-ftr">
          <button className="btn btn-secondary" onClick={onClose}>Cancel</button>
          <button className="btn btn-primary" onClick={save}>Save</button>
        </div>
      </div>
    </div>
  );
}

// ─────────────────────────────────────────────
// SKU SUPPLY IMPORT MODAL
// ─────────────────────────────────────────────
function SkuImportModal({ skus, m1Label, m2Label, onApply, onClose }) {
  const [phase, setPhase] = useState('upload'); // upload | configure | preview | done
  const [drag, setDrag] = useState(false);
  const [parsed, setParsed] = useState(null);
  const [idCol, setIdCol] = useState('');
  const [m1Col, setM1Col] = useState('');
  const [m2Col, setM2Col] = useState('');
  const [result, setResult] = useState(null);
  const [error, setError] = useState('');
  const fileRef = useRef();

  async function handleFile(file) {
    if (!file) return;
    setError('');
    try {
      const p = await parseUpload(file);
      setParsed(p);
      // auto-detect SKU code column
      let bestId = { col: p.headers[0], score: -1 };
      for (const h of p.headers) {
        let score = 0;
        for (const row of p.rows) {
          const v = norm(String(row[h]));
          if (skus.some(s => norm(s.code) === v || norm(s.name) === v)) score++;
        }
        if (score > bestId.score) bestId = { col: h, score };
      }
      setIdCol(bestId.col || p.headers[0] || '');
      // auto-detect M1/M2 qty cols from header text
      const m1kw = ['m1','month1','month 1','supply1','supplym1'];
      const m2kw = ['m2','month2','month 2','supply2','supplym2'];
      let m1c = null, m2c = null;
      for (const h of p.headers) {
        const hn = h.toLowerCase().replace(/[\s_-]/g,'');
        if (!m1c && m1kw.some(k => hn.includes(k))) m1c = h;
        else if (!m2c && m2kw.some(k => hn.includes(k))) m2c = h;
      }
      // fallback: first two numeric columns after id col
      if (!m1c || !m2c) {
        const numCols = p.headers.filter(h => h !== (bestId.col||'') && h !== m1c && h !== m2c);
        if (!m1c) m1c = numCols[0] || null;
        if (!m2c) m2c = numCols[1] || null;
      }
      setM1Col(m1c || '');
      setM2Col(m2c || '');
      setPhase('configure');
    } catch(e) {
      setError('Failed to parse file: ' + e.message);
    }
  }

  function runPreview() {
    if (!parsed) return;
    const updates = {};
    const unmatched = [];
    for (const row of parsed.rows) {
      const rawId = String(row[idCol] || '').trim();
      if (!rawId) continue;
      const n = norm(rawId);
      const sku = skus.find(s => norm(s.code) === n || norm(s.name) === n);
      if (!sku) {
        unmatched.push(rawId);
        continue;
      }
      updates[sku.id] = {
        supplyM1: m1Col ? parseNum(row[m1Col]) : (updates[sku.id]?.supplyM1 || 0),
        supplyM2: m2Col ? parseNum(row[m2Col]) : (updates[sku.id]?.supplyM2 || 0),
      };
    }
    setResult({ updates, unmatched });
    setPhase('preview');
  }

  function apply() {
    if (!result) return;
    onApply(result.updates);
    setPhase('done');
  }

  const matchedCount = result ? Object.keys(result.updates).length : 0;
  const unmatchedCount = result ? result.unmatched.length : 0;

  return (
    <div className="modal-overlay" onClick={e => e.target === e.currentTarget && onClose()}>
      <div className="modal">
        <div className="modal-hdr">
          <h2>📥 Import Supply Numbers</h2>
          <button className="btn btn-secondary btn-sm" onClick={onClose}>✕ Close</button>
        </div>
        <div className="modal-body">
          {error && <div className="warn-box">⚠️ {error}</div>}

          {phase === 'upload' && (
            <div
              className={`upload-zone${drag?' drag':''}`}
              onDragOver={e=>{e.preventDefault();setDrag(true);}}
              onDragLeave={()=>setDrag(false)}
              onDrop={e=>{e.preventDefault();setDrag(false);handleFile(e.dataTransfer.files[0]);}}
              onClick={()=>fileRef.current.click()}
            >
              <input ref={fileRef} type="file" accept=".csv,.xlsx,.xls" onChange={e=>handleFile(e.target.files[0])} />
              <div className="upload-icon">📂</div>
              <div className="upload-text">Drop a CSV or XLSX file here</div>
              <div className="upload-hint">Expected columns: SKU Code · Supply {m1Label} · Supply {m2Label}</div>
            </div>
          )}

          {phase === 'configure' && parsed && (
            <>
              <div className="info-box">
                📊 Loaded <strong>{parsed.rows.length}</strong> rows · <strong>{parsed.headers.length}</strong> columns.
                Adjust column mapping if needed.
              </div>
              <div className="col-detect">
                <div className="col-card">
                  <label>SKU identifier column</label>
                  <select value={idCol} onChange={e=>setIdCol(e.target.value)}>
                    {parsed.headers.map(h=><option key={h} value={h}>{h||'(blank)'}</option>)}
                  </select>
                </div>
                <div className="col-card">
                  <label>Supply {m1Label} column</label>
                  <select value={m1Col} onChange={e=>setM1Col(e.target.value)}>
                    <option value="">— none —</option>
                    {parsed.headers.filter(h=>h!==idCol).map(h=><option key={h} value={h}>{h}</option>)}
                  </select>
                </div>
                <div className="col-card">
                  <label>Supply {m2Label} column</label>
                  <select value={m2Col} onChange={e=>setM2Col(e.target.value)}>
                    <option value="">— none —</option>
                    {parsed.headers.filter(h=>h!==idCol&&h!==m1Col).map(h=><option key={h} value={h}>{h}</option>)}
                  </select>
                </div>
              </div>
              <div>
                <div className="section-title">Preview (first 6 rows)</div>
                <div style={{overflowX:'auto'}}>
                  <table className="preview-tbl">
                    <thead>
                      <tr>{parsed.headers.map(h=><th key={h} className={[idCol,m1Col,m2Col].includes(h)?'hi':''}>{h||'(blank)'}</th>)}</tr>
                    </thead>
                    <tbody>
                      {parsed.rows.slice(0,6).map((row,i)=>(
                        <tr key={i}>{parsed.headers.map(h=><td key={h} className={[idCol,m1Col,m2Col].includes(h)?'hi':''}>{String(row[h]).slice(0,40)}</td>)}</tr>
                      ))}
                    </tbody>
                  </table>
                </div>
              </div>
            </>
          )}

          {phase === 'preview' && result && (
            <>
              <div className="match-summary">
                <div className="match-card ok"><div className="big">{matchedCount}</div><div className="lbl">SKUs matched</div></div>
                <div className={`match-card${unmatchedCount>0?' warn':' ok'}`}><div className="big">{unmatchedCount}</div><div className="lbl">rows unmatched</div></div>
              </div>
              {unmatchedCount > 0 && (
                <div>
                  <div className="section-title">Unmatched rows</div>
                  <div className="unmatched-list">
                    <table><thead><tr><th>SKU identifier</th></tr></thead>
                      <tbody>{result.unmatched.map((u,i)=><tr key={i}><td style={{fontFamily:'monospace'}}>{u.slice(0,60)}</td></tr>)}</tbody>
                    </table>
                  </div>
                </div>
              )}
              {matchedCount > 0 && (
                <div>
                  <div className="section-title">Changes to apply</div>
                  <div className="unmatched-list" style={{maxHeight:'160px'}}>
                    <table>
                      <thead><tr><th>SKU Code</th><th>Supply {m1Label}</th><th>Supply {m2Label}</th></tr></thead>
                      <tbody>
                        {Object.entries(result.updates).map(([id,u])=>(
                          <tr key={id}><td style={{fontFamily:'monospace',fontSize:'11px'}}>{id}</td><td>{fmt(u.supplyM1)}</td><td>{fmt(u.supplyM2)}</td></tr>
                        ))}
                      </tbody>
                    </table>
                  </div>
                </div>
              )}
            </>
          )}

          {phase === 'done' && (
            <div style={{textAlign:'center',padding:'24px'}}>
              <div style={{fontSize:'40px'}}>✅</div>
              <div style={{marginTop:'8px',fontWeight:'600',color:'#065f46'}}>Supply numbers imported</div>
              <div style={{fontSize:'12px',color:'#64748b',marginTop:'4px'}}>{matchedCount} SKUs updated</div>
            </div>
          )}
        </div>
        <div className="modal-ftr">
          {phase === 'upload' && <button className="btn btn-secondary" onClick={onClose}>Cancel</button>}
          {phase === 'configure' && <>
            <button className="btn btn-secondary" onClick={()=>setPhase('upload')}>← Back</button>
            <button className="btn btn-primary" onClick={runPreview}>Preview →</button>
          </>}
          {phase === 'preview' && <>
            <button className="btn btn-secondary" onClick={()=>setPhase('configure')}>← Back</button>
            <button className="btn btn-primary" disabled={matchedCount===0} onClick={apply}>Apply {matchedCount} updates</button>
          </>}
          {phase === 'done' && <button className="btn btn-primary" onClick={onClose}>Done</button>}
        </div>
      </div>
    </div>
  );
}

// ─────────────────────────────────────────────
// REQ QTY IMPORT MODAL (M1 + M2 separate uploads)
// ─────────────────────────────────────────────
function ReqImportModal({ kind, materials, vendorMap, onApply, onClose }) {
  const m1Ref = useRef(); const m2Ref = useRef();
  const [m1Data, setM1Data] = useState(null); // {matches, unmatched}
  const [m2Data, setM2Data] = useState(null);
  const [error, setError] = useState('');

  function detectIdAndQty(p) {
    const hn = p.headers.map(h => String(h||'').toLowerCase().trim());
    // qty col: first numeric-looking column that isn't the id col
    const idIdx = hn.findIndex(h => h.includes('code') || h.includes('name') || h.includes('material') || h.includes('ingredient'));
    const idCol = p.headers[idIdx >= 0 ? idIdx : 0];
    const qtyCol = p.headers.find(h => h !== idCol && p.rows.slice(0,5).some(r => isNumeric(r[h]))) || p.headers[1];
    return { idCol, qtyCol };
  }

  async function handleFile(file, month) {
    if (!file) return;
    setError('');
    try {
      const p = await parseUpload(file);
      const { idCol, qtyCol } = detectIdAndQty(p);
      const matches = {}; const unmatched = [];
      for (const row of p.rows) {
        const rawId = row[idCol];
        const qty = parseNum(row[qtyCol]);
        const ids = resolveAll(rawId, materials, vendorMap);
        if (ids.length === 0) { if (rawId) unmatched.push(String(rawId)); continue; }
        for (const id of ids) matches[id] = (matches[id] || 0) + qty;
      }
      const result = { matches, unmatched, fileName: file.name, idCol, qtyCol };
      if (month === 1) setM1Data(result);
      else setM2Data(result);
    } catch(e) {
      setError('Failed to parse: ' + e.message);
    }
  }

  function applyAll() {
    const updates = {};
    if (m1Data) for (const [id, qty] of Object.entries(m1Data.matches)) {
      if (!updates[id]) updates[id] = { reqM1: 0, reqM2: 0 };
      updates[id].reqM1 = qty;
    }
    if (m2Data) for (const [id, qty] of Object.entries(m2Data.matches)) {
      if (!updates[id]) updates[id] = { reqM1: updates[id]?.reqM1 || 0, reqM2: 0 };
      updates[id].reqM2 = qty;
    }
    onApply(updates, 'req', true);
    onClose();
  }

  const canApply = m1Data || m2Data;

  function renderReqZone(month) {
    const data    = month === 1 ? m1Data : m2Data;
    const ref     = month === 1 ? m1Ref  : m2Ref;
    const label   = month === 1 ? 'M1' : 'M2';
    const color   = month === 1 ? '#1e40af' : '#065f46';
    const matched = data ? Object.keys(data.matches).length : 0;
    return (
      <div style={{flex:1,minWidth:'220px'}}>
        <div style={{fontWeight:'700',fontSize:'13px',marginBottom:'8px',color}}>{label} Required Qty</div>
        <div
          className="upload-zone"
          style={{padding:'16px',minHeight:'90px'}}
          onDragOver={e=>e.preventDefault()}
          onDrop={e=>{e.preventDefault();handleFile(e.dataTransfer.files[0],month);}}
          onClick={()=>ref.current.click()}
        >
          <input ref={ref} type="file" accept=".csv,.xlsx,.xls" onChange={e=>handleFile(e.target.files[0],month)} />
          {data ? (
            <div>
              <div style={{fontSize:'20px',marginBottom:'4px'}}>✅</div>
              <div style={{fontSize:'12px',fontWeight:'600',color:'#065f46'}}>{matched} matched</div>
              <div style={{fontSize:'11px',color:'#64748b',marginTop:'2px'}}>{data.fileName}</div>
              {data.unmatched.length > 0 && <div style={{fontSize:'11px',color:'#b45309',marginTop:'2px'}}>{data.unmatched.length} unmatched</div>}
            </div>
          ) : (
            <div>
              <div style={{fontSize:'24px',marginBottom:'4px'}}>📂</div>
              <div style={{fontSize:'12px',color:'#6366f1'}}>Upload {label} file</div>
              <div style={{fontSize:'11px',color:'#94a3b8',marginTop:'2px'}}>Identifier + Qty columns</div>
            </div>
          )}
        </div>
        {data && (
          <button style={{marginTop:'6px',fontSize:'11px',color:'#64748b',background:'none',border:'none',cursor:'pointer',textDecoration:'underline'}}
            onClick={()=>month===1?setM1Data(null):setM2Data(null)}>Clear</button>
        )}
      </div>
    );
  }

  return (
    <div className="modal-overlay" onClick={e=>e.target===e.currentTarget&&onClose()}>
      <div className="modal" style={{maxWidth:'560px'}}>
        <div className="modal-hdr">
          <h2>📥 Import Required Qty — {kind.toUpperCase()}</h2>
          <button className="btn btn-secondary btn-sm" onClick={onClose}>✕ Close</button>
        </div>
        <div className="modal-body">
          <p style={{fontSize:'13px',color:'#64748b',marginBottom:'16px'}}>
            Upload separate files for M1 and M2. Each file needs a material identifier column and a quantity column.
          </p>
          {error && <div className="warn-box">⚠️ {error}</div>}
          <div style={{display:'flex',gap:'16px',flexWrap:'wrap'}}>
            {renderReqZone(1)}
            {renderReqZone(2)}
          </div>
        </div>
        <div className="modal-footer">
          <button className="btn btn-secondary" onClick={onClose}>Cancel</button>
          <button className="btn btn-primary" onClick={applyAll} disabled={!canApply}>
            Apply {m1Data && m2Data ? 'M1 & M2' : m1Data ? 'M1' : m2Data ? 'M2' : ''}
          </button>
        </div>
      </div>
    </div>
  );
}

// ─────────────────────────────────────────────
// STOCK / OPEN PO IMPORT MODAL
// ─────────────────────────────────────────────
function StockPOImportModal({ kind, materials, onApply, onClose }) {
  const stockRef = useRef(); const openRef = useRef();
  const [stockData, setStockData] = useState(null);
  const [openData, setOpenData]   = useState(null);
  const [error, setError] = useState('');

  function normaliseSprivil(raw) {
    if (!raw) return '';
    let s = String(raw).trim();
    if (s.toUpperCase().startsWith('MOS_')) s = s.slice(4);
    return s.toUpperCase();
  }

  function buildSprivilMap() {
    const map = {};
    for (const m of materials) {
      // sprivilCode may be comma-separated (multiple factory codes per Mosaic code)
      const codes = String(m.sprivilCode || '').split(',').map(c => normaliseSprivil(c)).filter(Boolean);
      for (const sc of codes) map[sc] = m.id;
      // also index by Mosaic code itself
      map[normaliseSprivil(m.id)] = m.id;
    }
    return map;
  }

  async function handleFile(file, type) {
    if (!file) return;
    setError('');
    try {
      const p = await parseUpload(file);
      const sprivilMap = buildSprivilMap();
      const hn = p.headers.map(h => String(h||'').toLowerCase().trim());

      // Detect code column: prefer header containing 'code', else col 0
      const codeIdx = hn.findIndex(h => h.includes('code'));
      const codeCol = p.headers[codeIdx >= 0 ? codeIdx : 0];

      // Detect value column: try by keyword first, then fall back to first numeric col
      let valCol = null;
      if (type === 'stock') {
        const idx = hn.findIndex(h => h.includes('stock') || h.includes('unit') || h.includes('kg'));
        if (idx >= 0 && p.headers[idx] !== codeCol) valCol = p.headers[idx];
      } else {
        const idx = hn.findIndex(h => h.includes('open') || h.includes('po'));
        if (idx >= 0 && p.headers[idx] !== codeCol) valCol = p.headers[idx];
      }
      // Fallback: first column with mostly numeric values
      if (!valCol) {
        const detected = detectQtyCol(p.headers, p.rows, codeCol);
        valCol = detected.col || p.headers.find(h => h !== codeCol) || p.headers[1];
      }

      const matches = {}; const unmatched = [];
      for (const row of p.rows) {
        const rawCode = row[codeCol];
        const val = parseNum(row[valCol]);
        const normCode = normaliseSprivil(rawCode);
        const matId = sprivilMap[normCode];
        if (!matId) { if (rawCode) unmatched.push(String(rawCode)); continue; }
        // SUM values — multiple factory codes can map to the same Mosaic code
        matches[matId] = (matches[matId] || 0) + val;
      }
      const result = { matches, unmatched, fileName: file.name, detectedCols: { codeCol, valCol } };
      if (type === 'stock') setStockData(result);
      else setOpenData(result);
    } catch(e) {
      setError('Failed to parse: ' + e.message);
    }
  }

  function applyAll() {
    const updates = {};
    if (stockData) for (const [id, val] of Object.entries(stockData.matches)) {
      if (!updates[id]) updates[id] = { stock: 0, openPO: 0 };
      updates[id].stock = val;
    }
    if (openData) for (const [id, val] of Object.entries(openData.matches)) {
      if (!updates[id]) updates[id] = { stock: updates[id]?.stock || 0, openPO: 0 };
      updates[id].openPO = val;
    }
    // preserve existing values for fields not uploaded
    const finalUpdates = {};
    for (const [id, u] of Object.entries(updates)) {
      const existing = materials.find(m => m.id === id) || {};
      finalUpdates[id] = {
        stock:  'stock'  in u ? u.stock  : (existing.stock  || 0),
        openPO: 'openPO' in u ? u.openPO : (existing.openPO || 0),
      };
    }
    onApply(finalUpdates);
    onClose();
  }

  const canApply = stockData || openData;

  function renderZone(type) {
    const isStock = type === 'stock';
    const data    = isStock ? stockData : openData;
    const ref     = isStock ? stockRef  : openRef;
    const label   = isStock ? 'Stock' : 'Open PO';
    const color   = isStock ? '#1e40af' : '#065f46';
    const matched = data ? Object.keys(data.matches).length : 0;
    return (
      <div style={{flex:1,minWidth:'200px'}}>
        <div style={{fontWeight:'700',fontSize:'13px',marginBottom:'8px',color}}>{label}</div>
        <div
          className="upload-zone"
          style={{padding:'16px',minHeight:'90px'}}
          onDragOver={e=>e.preventDefault()}
          onDrop={e=>{e.preventDefault();handleFile(e.dataTransfer.files[0],type);}}
          onClick={()=>ref.current.click()}
        >
          <input ref={ref} type="file" accept=".csv,.xlsx,.xls" onChange={e=>handleFile(e.target.files[0],type)} />
          {data ? (
            <div>
              <div style={{fontSize:'20px',marginBottom:'4px'}}>✅</div>
              <div style={{fontSize:'12px',fontWeight:'600',color:'#065f46'}}>{matched} matched</div>
              <div style={{fontSize:'11px',color:'#64748b',marginTop:'2px'}}>{data.fileName}</div>
              {data.unmatched.length > 0 && <div style={{fontSize:'11px',color:'#b45309',marginTop:'2px'}}>{data.unmatched.length} unmatched</div>}
            </div>
          ) : (
            <div>
              <div style={{fontSize:'24px',marginBottom:'4px'}}>📂</div>
              <div style={{fontSize:'12px',color:'#6366f1'}}>Upload {label} file</div>
              <div style={{fontSize:'11px',color:'#94a3b8',marginTop:'2px'}}>Code + {label} columns</div>
            </div>
          )}
        </div>
        {data && (
          <button style={{marginTop:'6px',fontSize:'11px',color:'#64748b',background:'none',border:'none',cursor:'pointer',textDecoration:'underline'}}
            onClick={()=>isStock?setStockData(null):setOpenData(null)}>
            Clear
          </button>
        )}
      </div>
    );
  }

  return (
    <div className="modal-overlay" onClick={e=>e.target===e.currentTarget&&onClose()}>
      <div className="modal" style={{maxWidth:'560px'}}>
        <div className="modal-hdr">
          <h2>📦 Import Stock & Open PO — {kind.toUpperCase()}</h2>
          <button className="btn btn-secondary btn-sm" onClick={onClose}>✕ Close</button>
        </div>
        <div className="modal-body">
          <p style={{fontSize:'13px',color:'#64748b',marginBottom:'16px'}}>
            Upload separate files for Stock and Open PO. Each file needs a <strong>CODE</strong> column and a value column.
            {kind==='pm' && <span><br/><em>Codes accepted as <code>BBSS01</code> or <code>MOS_BBSS01</code></em></span>}
          </p>
          {error && <div className="warn-box">⚠️ {error}</div>}
          <div style={{display:'flex',gap:'16px',flexWrap:'wrap'}}>
            {renderZone('stock')}
            {renderZone('open')}
          </div>
        </div>
        <div className="modal-footer">
          <button className="btn btn-secondary" onClick={onClose}>Cancel</button>
          <button className="btn btn-primary" onClick={applyAll} disabled={!canApply}>
            Apply {stockData && openData ? 'Stock & Open PO' : stockData ? 'Stock' : openData ? 'Open PO' : ''}
          </button>
        </div>
      </div>
    </div>
  );
}

// ─────────────────────────────────────────────
// SKU DOC TAB
// ─────────────────────────────────────────────
function SkuDocTab({ skus, rmMaterials, pmMaterials, vendorMap, m1Label, m2Label }) {

  // Build RM rows from all materials with reqM1 > 0
  const rmRows = useMemo(() => {
    return rmMaterials.map(m => {
      const m1 = calcM1(m);
      const m2 = calcM2(m, m1);
      return { name: m.name, id: m.id, docM1: m1.doc, docM2: m2.doc };
    }).filter(r => r.docM1 != null || r.docM2 != null);
  }, [rmMaterials]);

  // Build PM rows from all materials with reqM1 > 0
  const pmRows = useMemo(() => {
    return pmMaterials.map(m => {
      const m1 = calcM1(m);
      const m2 = calcM2(m, m1);
      return { name: m.name, id: m.id, docM1: m1.doc, docM2: m2.doc };
    }).filter(r => r.docM1 != null || r.docM2 != null);
  }, [pmMaterials]);

  // Find bottlenecks
  const validDocM1 = r => r.docM1 != null;
  const validDocM2 = r => r.docM2 != null;
  const minRmM1 = rmRows.filter(validDocM1).length ? Math.min(...rmRows.filter(validDocM1).map(r => r.docM1)) : null;
  const minRmM2 = rmRows.filter(validDocM2).length ? Math.min(...rmRows.filter(validDocM2).map(r => r.docM2)) : null;
  const minPmM1 = pmRows.filter(validDocM1).length ? Math.min(...pmRows.filter(validDocM1).map(r => r.docM1)) : null;
  const minPmM2 = pmRows.filter(validDocM2).length ? Math.min(...pmRows.filter(validDocM2).map(r => r.docM2)) : null;

  const overallM1 = [minRmM1, minPmM1].filter(v => v != null).reduce((a, b) => Math.min(a, b), Infinity);
  const overallM2 = [minRmM2, minPmM2].filter(v => v != null).reduce((a, b) => Math.min(a, b), Infinity);

  function docColor(doc, minDoc, overallMin) {
    if (doc == null) return {};
    if (Math.abs(doc - overallMin) < 0.01) return { background: '#fef2f2', color: '#b91c1c', fontWeight: 700 }; // overall bottleneck
    if (Math.abs(doc - minDoc) < 0.01) return { background: '#fffbeb', color: '#92400e', fontWeight: 600 }; // local min
    return {};
  }

  function SummaryBox({ label, rmDoc, pmDoc, overallDoc }) {
    const binding = rmDoc != null && pmDoc != null ? (rmDoc <= pmDoc ? 'RM' : 'PM') : rmDoc != null ? 'RM' : pmDoc != null ? 'PM' : null;
    return (
      <div style={{display:'flex',gap:'12px',alignItems:'center',background:'#f8fafc',border:'1px solid #e2e8f0',borderRadius:'8px',padding:'12px 16px',marginBottom:'4px'}}>
        <span style={{fontWeight:700,color:'#1e293b',minWidth:'32px'}}>{label}</span>
        <span style={{fontSize:'13px',color:'#475569'}}>RM: <strong style={{color:'#1d4ed8'}}>{rmDoc != null ? fmt(rmDoc,1)+' days' : '—'}</strong></span>
        <span style={{fontSize:'13px',color:'#475569'}}>PM: <strong style={{color:'#7c3aed'}}>{pmDoc != null ? fmt(pmDoc,1)+' days' : '—'}</strong></span>
        {overallDoc !== Infinity && (
          <span style={{marginLeft:'auto',background:'#fef2f2',color:'#b91c1c',borderRadius:'6px',padding:'4px 12px',fontWeight:700,fontSize:'13px'}}>
            🚨 Bottleneck: {binding} — {fmt(overallDoc,1)} days
          </span>
        )}
      </div>
    );
  }

  function DocTable({ rows, kind, minM1, minM2, overallM1, overallM2 }) {
    if (!rows.length) return <div style={{color:'#94a3b8',fontSize:'13px',padding:'8px'}}>No {kind.toUpperCase()} materials with required quantities set.</div>;
    return (
      <table style={{width:'100%',borderCollapse:'collapse',fontSize:'13px'}}>
        <thead>
          <tr style={{background:'#f1f5f9'}}>
            <th style={{textAlign:'left',padding:'6px 10px',fontWeight:600}}>Material</th>
            <th style={{textAlign:'right',padding:'6px 10px'}}>{m1Label} Doc (days)</th>
            <th style={{textAlign:'right',padding:'6px 10px'}}>{m2Label} Doc (days)</th>
          </tr>
        </thead>
        <tbody>
          {rows.map((r, i) => (
            <tr key={i} style={{borderBottom:'1px solid #f1f5f9'}}>
              <td style={{padding:'5px 10px',color:'#1e293b'}}>{r.name}</td>
              <td style={{textAlign:'right',padding:'5px 10px',...docColor(r.docM1, minM1, overallM1)}}>
                {r.docM1 != null ? fmt(r.docM1,1) : '—'}
              </td>
              <td style={{textAlign:'right',padding:'5px 10px',...docColor(r.docM2, minM2, overallM2)}}>
                {r.docM2 != null ? fmt(r.docM2,1) : '—'}
              </td>
            </tr>
          ))}
        </tbody>
      </table>
    );
  }

  return (
    <div style={{padding:'16px'}}>
      {/* Header */}
      <div style={{marginBottom:'20px'}}>
        <div style={{fontWeight:700,fontSize:'15px',color:'#1e293b'}}>Materials DOC Overview</div>
        <div style={{fontSize:'13px',color:'#64748b',marginTop:'4px'}}>Days of Cover for all factory materials based on required quantities.</div>
      </div>

      {/* Summary */}
      {(minRmM1 != null || minPmM1 != null) && (
        <div style={{marginBottom:'20px'}}>
          <SummaryBox label={m1Label} rmDoc={minRmM1} pmDoc={minPmM1} overallDoc={overallM1} />
          <SummaryBox label={m2Label} rmDoc={minRmM2} pmDoc={minPmM2} overallDoc={overallM2} />
        </div>
      )}

      {/* RM Table */}
      <div style={{marginBottom:'20px'}}>
        <div style={{fontWeight:700,color:'#1d4ed8',marginBottom:'6px',fontSize:'13px',textTransform:'uppercase',letterSpacing:'0.04em'}}>
          Raw Materials
        </div>
        <div style={{border:'1px solid #e2e8f0',borderRadius:'8px',overflow:'hidden'}}>
          <DocTable rows={rmRows} kind="rm" minM1={minRmM1} minM2={minRmM2} overallM1={overallM1} overallM2={overallM2} />
        </div>
      </div>

      {/* PM Table */}
      <div>
        <div style={{fontWeight:700,color:'#7c3aed',marginBottom:'6px',fontSize:'13px',textTransform:'uppercase',letterSpacing:'0.04em'}}>
          Packaging Materials
        </div>
        <div style={{border:'1px solid #e2e8f0',borderRadius:'8px',overflow:'hidden'}}>
          <DocTable rows={pmRows} kind="pm" minM1={minPmM1} minM2={minPmM2} overallM1={overallM1} overallM2={overallM2} />
        </div>
      </div>
    </div>
  );
}

// ─────────────────────────────────────────────
// CONSOLIDATED TAB (RM or PM)
// ─────────────────────────────────────────────
function ConsolidatedTab({ kind, materials, vendorMap, onUpdate, m1Label, m2Label, factoryName, skus }) {
  const [modal, setModal] = useState(null);
  const [search, setSearch] = useState('');
  const [apiLoading, setApiLoading] = useState(false);
  const [apiResult, setApiResult] = useState(null); // null | { ok, data, applied }

  async function fetchReqQtyFromApi() {
    const items = (skus || [])
      .filter(s => (s.supplyM1 || 0) > 0)
      .map(s => ({ skuCode: s.code, quantity: s.supplyM1 }));

    if (!items.length) {
      alert('No SKUs with M1 supply quantities set. Enter supply numbers in the Supply Entry tab first.');
      return;
    }

    setApiLoading(true);
    setApiResult(null);
    try {
      const res = await fetch('/api/required-quantity', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ items })
      });
      const data = await res.json();
      if (!res.ok) {
        setApiResult({ ok: false, data, applied: 0 });
        setModal({ type: 'apiraw', data });
        return;
      }

      // Try to apply: look for a flat object or nested rm/pm keyed by material code
      const target = kind === 'rm'
        ? (data.rm || data.RM || data.rawMaterials || data)
        : (data.pm || data.PM || data.packagingMaterials || data);

      if (typeof target !== 'object' || Array.isArray(target)) {
        setApiResult({ ok: true, data, applied: 0 });
        setModal({ type: 'apiraw', data });
        return;
      }

      // Build an index: code → qty
      const lookup = {};
      Object.entries(target).forEach(([k, v]) => { lookup[k.trim().toUpperCase()] = parseFloat(v) || 0; });

      // Also try array form: [{code, quantity}]
      if (Array.isArray(data.items || data.results)) {
        (data.items || data.results).forEach(r => {
          const code = (r.code || r.materialCode || r.rm_code || r.pm_code || '').trim().toUpperCase();
          const qty  = parseFloat(r.quantity || r.qty || r.required || 0);
          if (code) lookup[code] = qty;
        });
      }

      let applied = 0;
      const updated = materials.map(m => {
        const key = (m.id || m.code || '').trim().toUpperCase();
        if (lookup[key] != null) {
          applied++;
          return { ...m, reqM1: lookup[key] };
        }
        // Also check sprivilCode / mosaicCodes
        const codes = [m.sprivilCode, ...(m.mosaicCodes || [])].map(c => String(c||'').trim().toUpperCase());
        for (const c of codes) {
          if (c && lookup[c] != null) {
            applied++;
            return { ...m, reqM1: lookup[c] };
          }
        }
        return m;
      });

      onUpdate(kind, updated);
      setApiResult({ ok: true, data, applied });
      if (applied === 0) setModal({ type: 'apiraw', data });
    } catch (err) {
      setApiResult({ ok: false, data: { error: err.message }, applied: 0 });
      setModal({ type: 'apiraw', data: { error: err.message } });
    } finally {
      setApiLoading(false);
    }
  }
  const [highlight, setHighlight] = useState('all'); // 'all'|'ordered'|'excess'
  const unit = kind === 'rm' ? 'kg' : 'units';

  function handleApply(updates, type, isReq) {
    const updated = materials.map(m => {
      if (!updates[m.id]) return m;
      const u = updates[m.id];
      if (isReq) return { ...m, reqM1: u.reqM1 != null ? u.reqM1 : m.reqM1, reqM2: u.reqM2 != null ? u.reqM2 : m.reqM2 };
      const val = Object.values(u)[0] || 0;
      return { ...m, [type]: val };
    });
    onUpdate(kind, updated);
    setModal(null);
  }

  function handleStockPOApply(updates) {
    const updated = materials.map(m => {
      if (!updates[m.id]) return m;
      return { ...m, stock: updates[m.id].stock, openPO: updates[m.id].openPO };
    });
    onUpdate(kind, updated);
    setModal(null);
  }

  function clearReq() {
    onUpdate(kind, materials.map(m => ({ ...m, reqM1: 0, reqM2: 0 })));
  }

  let filtered = search
    ? materials.filter(m => {
        const hay = norm([m.name, m.code, m.sprivilCode, ...(m.mosaicCodes||[])].join(' '));
        return hay.includes(norm(search));
      })
    : [...materials];

  if (highlight !== 'all') {
    filtered = filtered.filter(m => {
      const m1 = calcM1(m);
      const m2 = calcM2(m, m1);
      const any = s => s !== 'none';
      const exc = s => s === 'excess';
      if (highlight === 'ordered') return any(m1.status) || any(m2.status);
      if (highlight === 'excess') return exc(m1.status) || exc(m2.status);
      return true;
    });
  }

  return (
    <div>
      <div className="toolbar">
        <input className="search-input" placeholder="Search…" value={search} onChange={e=>setSearch(e.target.value)} />
        <select style={{padding:'5px 8px',border:'1px solid #d1d5db',borderRadius:'6px',fontSize:'12px'}} value={highlight} onChange={e=>setHighlight(e.target.value)}>
          <option value="all">Show all</option>
          <option value="ordered">Orders needed only</option>
          <option value="excess">Excess MOQ only</option>
        </select>
        <div className="spacer"/>

{`M1

DOC_M1    = stock × 30 / reqM1
desiredM1 = max(0, reqM1 − availM1)
actualM1  = 0             if desired=0
           moq             if moq>0 and desired<moq
           desired          otherwise

M2 (carry-forward from M1)

function ImportSkuListModal({ existingSkus, onApply, onClose }) {
  const [data, setData] = useState(null);
  const [error, setError] = useState('');
  const fileRef = useRef();
  async function handleFile(file) {
    try {
      const { headers, rows } = await parseUpload(file);
      const hi = kw => headers.findIndex(h => h.toLowerCase().includes(kw));
      const codeIdx = hi('code') >= 0 ? hi('code') : 0;
      const nameIdx = hi('name') >= 0 ? hi('name') : 1;
      const skus = rows.filter(r => r[headers[codeIdx]]).map(r => mkSKU(String(r[headers[codeIdx]]).trim(), String(r[headers[nameIdx]]||'').trim()));
      if (!skus.length) { setError('No SKU rows found'); return; }
      setData(skus); setError('');
    } catch(e) { setError(String(e)); }
  }
  function apply() {
    if (!data) return;
    const existCodes = new Set(existingSkus.map(s => s.code));
    const merged = [...existingSkus];
    for (const s of data) { if (!existCodes.has(s.code)) merged.push(s); }
    onApply(merged);
  }
  return (
    <div className="modal-overlay" onClick={e=>e.target===e.currentTarget&&onClose()}>
      <div className="modal" style={{maxWidth:'480px'}}>
        <div className="modal-hdr"><h2>📋 Import SKU List</h2><button className="btn btn-secondary btn-sm" onClick={onClose}>✕ Close</button></div>
        <div className="modal-body">
          <p style={{fontSize:'13px',color:'#64748b',marginBottom:'12px'}}>Upload Excel/CSV with <strong>SKU Code</strong> and <strong>SKU Name</strong> columns. Existing SKUs are preserved (supply quantities kept).</p>
          {error && <div className="warn-box">⚠️ {error}</div>}
          <div className="upload-zone" onClick={()=>fileRef.current?.click()} onDragOver={e=>e.preventDefault()} onDrop={e=>{e.preventDefault();handleFile(e.dataTransfer.files[0]);}}>
            <input ref={fileRef} type="file" accept=".xlsx,.csv" style={{display:'none'}} onChange={e=>handleFile(e.target.files[0])} />
            {data ? <span style={{color:'#16a34a'}}>✓ {data.length} SKUs ready to import</span> : <span>Click or drag Excel / CSV file here</span>}
          </div>
        </div>
        <div className="modal-footer">
          <button className="btn btn-secondary" onClick={onClose}>Cancel</button>
          <button className="btn btn-primary" onClick={()=>{apply();onClose();}} disabled={!data}>Import {data?.length||''} SKUs</button>
        </div>
      </div>
    </div>
  );
}
