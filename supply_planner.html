function SupplyEntryTab({ skus, onUpdateSkus, onExtract, onImportSkus, m1Label, m2Label }) {
  const [search, setSearch] = useState('');
  const [showImport, setShowImport] = useState(false);
  const [showImportSkus, setShowImportSkus] = useState(false);
  const filtered = search
    ? skus.filter(s => norm(s.name+' '+s.code).includes(norm(search)))
    : skus;

  function handleImportApply(updates) {
    onUpdateSkus(skus.map(s => updates[s.id] ? { ...s, ...updates[s.id] } : s));
    setShowImport(false);
  }

  return (
    <div>
      <div className="toolbar">
        <input className="search-input" placeholder="Search SKUs…" value={search} onChange={e=>setSearch(e.target.value)} />
        <div className="spacer"/>
        <button className="btn btn-secondary" onClick={()=>setShowImportSkus(true)}>📋 Import SKU List</button>
        <button className="btn btn-secondary" onClick={()=>setShowImport(true)}>📥 Import Supply Numbers</button>
        <button
          className="btn btn-primary"
          onClick={onExtract}
          title="Calculate RM & PM required quantities from SKU supply numbers using embedded BOM"
        >
          ⚡ Extract Required Quantities
        </button>
      </div>

      {showImportSkus && (
        <ImportSkuListModal
          existingSkus={skus}
          onApply={updated => { onImportSkus(updated); setShowImportSkus(false); }}
          onClose={()=>setShowImportSkus(false)}
        />
      )}

      {showImport && (
        <SkuImportModal
          skus={skus}
          m1Label={m1Label}
          m2Label={m2Label}
          onApply={handleImportApply}
          onClose={()=>setShowImport(false)}
        />
      )}

      <div className="tbl-wrap">
        <table>
          <thead>
            <tr>
              <th style={{minWidth:'200px'}}>SKU Code</th>
              <th style={{minWidth:'260px'}}>SKU Name</th>
              <th style={{minWidth:'140px'}}>Supply {m1Label} (units)</th>
              <th style={{minWidth:'140px'}}>Supply {m2Label} (units)</th>
            </tr>
          </thead>
          <tbody>
            {filtered.length === 0 && (
              <tr><td colSpan={4}><div className="empty-state"><div className="icon">🔍</div>No SKUs match your search.</div></td></tr>
            )}
            {filtered.map(s => (
              <tr key={s.id}>
                <td className="monospace" style={{fontSize:'11px'}}>{s.code}</td>
                <td>{s.name}</td>
                {['supplyM1','supplyM2'].map(field => (
                  <td key={field} className="right">
                    <input
                      type="number" className="num-input" value={s[field]||0} min={0} step="1"
                      onChange={e => {
                        const val = parseFloat(e.target.value)||0;
                        onUpdateSkus(skus.map(x => x.id===s.id ? {...x,[field]:val} : x));
                      }}
                    />
                  </td>
                ))}
              </tr>
            ))}
          </tbody>
        </table>
      </div>
    </div>
  );
}

// ─────────────────────────────────────────────
// CONSOLIDATED TAB (RM or PM)
// ─────────────────────────────────────────────
function ConsolidatedTab({ kind, materials, vendorMap, onUpdate, m1Label, m2Label, factoryName }) {
  const [modal, setModal] = useState(null);
  const [search, setSearch] = useState('');
  const [highlight, setHighlight] = useState('all'); // 'all'|'ordered'|'excess'
  const unit = kind === 'rm' ? 'kg' : 'units';

  function handleApply(updates, type, isReq) {
    const updated = materials.map(m => {
      if (!updates[m.id]) return m;
      const u = updates[m.id];
      if (isReq) return { ...m, reqM1: u.reqM1 != null ? u.reqM1 : m.reqM1, reqM2: u.reqM2 != null ? u.reqM2 : m.reqM2 };
      const val = Object.values(u)[0] || 0;
      return { ...m, [type]: val };
    });
    onUpdate(kind, updated);
    setModal(null);
  }

  function handleStockPOApply(updates) {
    const updated = materials.map(m => {
      if (!updates[m.id]) return m;
      return { ...m, stock: updates[m.id].stock, openPO: updates[m.id].openPO };
    });
    onUpdate(kind, updated);
    setModal(null);
  }

  function clearReq() {
    onUpdate(kind, materials.map(m => ({ ...m, reqM1: 0, reqM2: 0 })));
  }

  let filtered = search
    ? materials.filter(m => {
        const hay = norm([m.name, m.code, m.sprivilCode, ...(m.mosaicCodes||[])].join(' '));
        return hay.includes(norm(search));
      })
    : [...materials];

  if (highlight !== 'all') {
    filtered = filtered.filter(m => {
      const m1 = calcM1(m);
      const m2 = calcM2(m, m1);
      const any = s => s !== 'none';
      const exc = s => s === 'excess';
      if (highlight === 'ordered') return any(m1.status) || any(m2.status);
      if (highlight === 'excess') return exc(m1.status) || exc(m2.status);
      return true;
    });
  }

  return (
    <div>
      <div className="toolbar">
        <input className="search-input" placeholder="Search…" value={search} onChange={e=>setSearch(e.target.value)} />
        <select style={{padding:'5px 8px',border:'1px solid #d1d5db',borderRadius:'6px',fontSize:'12px'}} value={highlight} onChange={e=>setHighlight(e.target.value)}>
          <option value="all">Show all</option>
          <option value="ordered">Orders needed only</option>
          <option value="excess">Excess MOQ only</option>
        </select>
        <div className="spacer"/>
        <button className="btn btn-secondary" onClick={()=>setModal({type:'stockpo'})} style={{background:'#1e40af',color:'#fff',border:'none'}}>📦 Import Stock / Open PO</button>
        <button className="btn btn-secondary" onClick={()=>setModal({type:'req'})}>📥 Import Req Qty</button>
        <button className="btn btn-secondary" onClick={()=>setModal({type:'moq'})}>📥 Import MOQ</button>
        <button className="btn btn-secondary" onClick={clearReq} title="Reset all required quantities to 0">🗑 Clear Req</button>
        <button className="btn btn-secondary" onClick={()=>setModal({type:'vendorMap'})}>🔗 Vendor Codes</button>
        <button className="btn btn-secondary" onClick={()=>setModal({type:'factorymap'})} style={{background:'#7c3aed',color:'#fff',border:'none'}}>🔗 {factoryName} Code Mapping</button>
      </div>

      {materials.length === 0 && (
        <div style={{textAlign:'center',padding:'48px 24px',color:'#64748b'}}>
          <div style={{fontSize:'32px',marginBottom:'12px'}}>📋</div>
          <div style={{fontWeight:600,marginBottom:'6px'}}>No materials yet</div>
          <div style={{fontSize:'13px'}}>Click <strong>"{factoryName} Code Mapping"</strong> above to import this factory's materials list.</div>
        </div>
      )}
      <div className="tbl-wrap">
        <table>
          <colgroup>
            <col style={{minWidth:'44px'}}/>
            {kind==='pm' && <col style={{minWidth:'140px'}}/>}
            {kind==='pm' && <col style={{minWidth:'140px'}}/>}
            {kind==='rm' && <col style={{minWidth:'120px'}}/>}
            {kind==='rm' && <col style={{minWidth:'120px'}}/>}
            <col style={{minWidth:'200px'}}/>
            <col style={{minWidth:'80px'}}/>
            <col style={{minWidth:'80px'}}/>
            <col style={{minWidth:'90px'}}/>
            {/* M1 */}
            <col style={{minWidth:'80px'}}/>
            <col style={{minWidth:'70px'}}/>
            <col style={{minWidth:'80px'}}/>
            <col style={{minWidth:'80px'}}/>
            <col style={{minWidth:'60px'}}/>
            <col style={{minWidth:'110px'}}/>
            {/* M2 */}
            <col style={{minWidth:'80px'}}/>
            <col style={{minWidth:'80px'}}/>
            <col style={{minWidth:'70px'}}/>
            <col style={{minWidth:'80px'}}/>
            <col style={{minWidth:'80px'}}/>
            <col style={{minWidth:'60px'}}/>
            <col style={{minWidth:'110px'}}/>
          </colgroup>
          <thead>
            <tr>
              <th rowSpan={2} style={{textAlign:'center',minWidth:'44px'}}>#</th>
              {kind==='pm' && <th rowSpan={2} style={{background:'#2d3748',color:'#fbbf24'}}>{factoryName} Code</th>}
              {kind==='pm' && <th rowSpan={2} style={{background:'#2d3748',color:'#86efac'}}>Mosaic PM Code</th>}
              {kind==='rm' && <th rowSpan={2} style={{background:'#2d3748',color:'#fbbf24'}}>{factoryName} Code</th>}
              {kind==='rm' && <th rowSpan={2} style={{background:'#2d3748',color:'#86efac'}}>Mosaic RM Code</th>}
              <th rowSpan={2}>Name</th>
              <th rowSpan={2}>MOQ ({unit})</th>
              <th rowSpan={2}>Stock ({unit})</th>
              <th rowSpan={2}>Open PO ({unit})</th>
              <th colSpan={6} className="group-hdr m1-hdr">{m1Label}</th>
              <th colSpan={7} className="group-hdr m2-hdr">{m2Label}</th>
            </tr>
            <tr>
              {/* M1 */}
              <th className="m1-hdr">Req ({unit})</th>
              <th className="m1-hdr">DOC (d)</th>
              <th className="m1-hdr">Desired ({unit})</th>
              <th className="m1-hdr">Actual PO ({unit})</th>
              <th className="m1-hdr">Diff %</th>
              <th className="m1-hdr">Status</th>
              {/* M2 */}
              <th className="m2-hdr">Opening ({unit})</th>
              <th className="m2-hdr">Req ({unit})</th>
              <th className="m2-hdr">DOC (d)</th>
              <th className="m2-hdr">Desired ({unit})</th>
              <th className="m2-hdr">Actual PO ({unit})</th>
              <th className="m2-hdr">Diff %</th>
              <th className="m2-hdr">Status</th>
            </tr>
          </thead>
          <tbody>
            {filtered.length === 0 && (
              <tr><td colSpan={kind==='pm'?21:21}><div className="empty-state"><div className="icon">📋</div>No results.</div></td></tr>
            )}
            {filtered.map((m, idx) => {
              const m1 = calcM1(m);
              const m2 = calcM2(m, m1);
              return (
                <tr key={m.id}>
                  <td className="center" style={{color:'#64748b',fontSize:'11px',fontWeight:'600'}}>{idx+1}</td>
                  {kind==='pm' && (
                    <td className="monospace" style={{fontSize:'10px',color:'#b45309',background:'#fffbeb'}}>
                      {m.sprivilCode || <span style={{color:'#94a3b8'}}>—</span>}
                    </td>
                  )}
                  {kind==='pm' && (
                    <td style={{fontSize:'10px',background:'#f0fdf4',fontFamily:'monospace',color:'#166534'}}>
                      {m.id || <span style={{color:'#94a3b8'}}>—</span>}
                    </td>
                  )}
                  {kind==='rm' && (
                    <td className="monospace" style={{fontSize:'10px',color:'#b45309',background:'#fffbeb'}}>
                      {m.sprivilCode || <span style={{color:'#94a3b8'}}>—</span>}
                    </td>
                  )}
                  {kind==='rm' && (
                    <td className="monospace" style={{fontSize:'10px',color:'#166534',background:'#f0fdf4'}}>
                      {m.code || <span style={{color:'#94a3b8'}}>—</span>}
                    </td>
                  )}
                  <td>{m.name}</td>
                  {/* MOQ editable */}
                  <td className="right">
                    <input type="number" className="num-input" value={m.moq||0} min={0}
                      onChange={e=>{
                        const v=parseFloat(e.target.value)||0;
                        onUpdate(kind,materials.map(x=>x.id===m.id?{...x,moq:v}:x));
                      }}
                    />
                  </td>
                  {/* Stock + Open PO */}
                  <td className="right">{fmt(m.stock)}</td>
                  <td className="right">
                    <input type="number" className="num-input" value={m.openPO||0} min={0}
                      onChange={e=>{
                        const v=parseFloat(e.target.value)||0;
                        onUpdate(kind,materials.map(x=>x.id===m.id?{...x,openPO:v}:x));
                      }}
                    />
                  </td>
                  {/* M1 */}
                  <td className="right m1-col">
                    <input type="number" className="num-input" style={{background:'transparent'}} value={m.reqM1||0} min={0}
                      onChange={e=>{
                        const v=parseFloat(e.target.value)||0;
                        onUpdate(kind,materials.map(x=>x.id===m.id?{...x,reqM1:v}:x));
                      }}
                    />
                  </td>
                  <td className="right m1-col">{m1.doc != null ? fmt(m1.doc, 1) : '—'}</td>
                  <td className="right m1-col">{fmt(m1.desired)}</td>
                  <td className="right m1-col" style={{fontWeight:m1.actual>0?'600':'normal'}}>{fmt(m1.actual)}</td>
                  <td className="right m1-col">{fmtPct(m1.diff)}</td>
                  <td className="m1-col center"><StatusPill status={m1.status}/></td>
                  {/* M2 */}
                  <td className="right m2-col">{fmt(m2.opening)}</td>
                  <td className="right m2-col">
                    <input type="number" className="num-input" style={{background:'transparent'}} value={m.reqM2||0} min={0}
                      onChange={e=>{
                        const v=parseFloat(e.target.value)||0;
                        onUpdate(kind,materials.map(x=>x.id===m.id?{...x,reqM2:v}:x));
                      }}
                    />
                  </td>
                  <td className="right m2-col">{m2.doc != null ? fmt(m2.doc, 1) : '—'}</td>
                  <td className="right m2-col">{fmt(m2.desired)}</td>
                  <td className="right m2-col" style={{fontWeight:m2.actual>0?'600':'normal'}}>{fmt(m2.actual)}</td>
                  <td className="right m2-col">{fmtPct(m2.diff)}</td>
                  <td className="m2-col center"><StatusPill status={m2.status}/></td>
                </tr>
              );
            })}
          </tbody>
        </table>
      </div>

      {modal && modal.type === 'stockpo' && (
        <StockPOImportModal
          kind={kind}
          materials={materials}
          onApply={handleStockPOApply}
          onClose={()=>setModal(null)}
        />
      )}

      {modal && modal.type === 'req' && (
        <ReqImportModal
          kind={kind}
          materials={materials}
          vendorMap={vendorMap}
          onApply={handleApply}
          onClose={()=>setModal(null)}
        />
      )}

      {modal && modal.type === 'moq' && (
        <ImportModal
          title={`Import MOQ — ${kind.toUpperCase()}`}
          importType="moq"
          materials={materials}
          vendorMap={vendorMap}
          onApply={handleApply}
          onClose={()=>setModal(null)}
        />
      )}

      {modal && modal.type === 'vendorMap' && (
        <VendorMapModal
          vendorMap={vendorMap}
          rmMaterials={[]}
          pmMaterials={materials}
          onSave={map => {/* handled in App */}}
          onClose={()=>setModal(null)}
        />
      )}

      {modal?.type==='factorymap' && (
        <FactoryCodeMapModal
          kind={kind}
          materials={materials}
          factoryName={factoryName}
          onApply={updated => { onUpdate(kind, updated); setModal(null); }}
          onClose={()=>setModal(null)}
        />
      )}
    </div>
  );
}

function HelpModal({ onClose }) {
  return (
    <div className="modal-overlay" onClick={e=>e.target===e.currentTarget&&onClose()}>
      <div className="modal" style={{maxWidth:'600px'}}>
        <div className="modal-hdr">
          <h2>ℹ️ How to use Supply Planner</h2>
          <button className="btn btn-secondary btn-sm" onClick={onClose}>✕</button>
        </div>
        <div className="modal-body" style={{fontSize:'12px',lineHeight:'1.7'}}>
          <div className="section-title">Workflow</div>
          <ol style={{paddingLeft:'16px',marginBottom:'12px'}}>
            <li><strong>Supply Entry tab</strong> — Upload or manually enter Current Stock and Expected Supply for M1 &amp; M2 (separate files per RM / PM).</li>
            <li><strong>Consolidated RM / PM tabs</strong> — Upload Required Qty (both M1 &amp; M2 columns in one file). Set MOQ per row or import. The tool computes DOC, Desired Qty, Actual PO qty, Diff%, and Status live.</li>
            <li><strong>Vendor Code Map</strong> (🔗 button) — Map external/vendor codes to internal materials. Imported files are matched using this map.</li>
          </ol>
          <div className="section-title">Identifier Resolution (§4 priority order)</div>
          <ol style={{paddingLeft:'16px',marginBottom:'12px'}}>
            <li>Exact internal code match</li>
            <li>Exact material name match</li>
            <li>Vendor code map lookup (fan-out to multiple materials)</li>
            <li>Alias fallback</li>
          </ol>
          <div className="section-title">Status colours</div>
          <p><span className="status-pill status-none">No Order</span> — nothing needed. <span className="status-pill status-desired">Order Desired</span> — shortfall exists. <span className="status-pill status-excess">Order Excess</span> — MOQ floor pushed order above shortfall.</p>
          <div style={{marginTop:'12px'}} className="section-title">Calculations</div>
          <pre style={{background:'#f8fafc',border:'1px solid #e2e8f0',borderRadius:'4px',padding:'8px',fontSize:'11px',overflowX:'auto'}}>
{`M1
availM1   = stock + supplyM1
DOC_M1    = stock × 30 / reqM1
desiredM1 = max(0, reqM1 − availM1)
actualM1  = 0             if desired=0
           moq             if moq>0 and desired<moq
           desired          otherwise

M2 (carry-forward from M1)
openingM2 = max(0, stock+supplyM1+actualM1−reqM1)
availM2   = openingM2 + supplyM2
DOC_M2    = openingM2 × 30 / reqM2
desiredM2 = max(0, reqM2 − availM2)
actualM2  = same MOQ-floor rule as M1`}
          </pre>
        </div>
        <div className="modal-ftr">
          <button className="btn btn-primary" onClick={onClose}>Got it</button>
        </div>
      </div>
    </div>
  );
}

          </div>
          <div style={{display:'flex',gap:'20px'}}>
            <label style={{display:'flex',alignItems:'center',gap:'6px',cursor:'pointer'}}><input type="checkbox" checked={hasRM} onChange={e=>setHasRM(e.target.checked)} /> Track Raw Materials (RM)</label>
            <label style={{display:'flex',alignItems:'center',gap:'6px',cursor:'pointer'}}><input type="checkbox" checked={hasPM} onChange={e=>setHasPM(e.target.checked)} /> Track Packaging (PM)</label>
          </div>
        </div>
        <div className="modal-footer">
          <button className="btn btn-secondary" onClick={onClose}>Cancel</button>
          <button className="btn btn-primary" onClick={()=>{if(name.trim()){onAdd(name.trim(),hasRM,hasPM);onClose();}}} disabled={!name.trim()}>Add Factory</button>
        </div>
      </div>
    </div>
  );
}

// ─────────────────────────────────────────────
// IMPORT SKU LIST MODAL
// ─────────────────────────────────────────────
function ImportSkuListModal({ existingSkus, onApply, onClose }) {
  const [data, setData] = useState(null);
  const [error, setError] = useState('');
  const fileRef = useRef();
  async function handleFile(file) {
    try {
      const { headers, rows } = await parseUpload(file);
      const hi = kw => headers.findIndex(h => h.toLowerCase().includes(kw));
      const codeIdx = hi('code') >= 0 ? hi('code') : 0;
      const nameIdx = hi('name') >= 0 ? hi('name') : 1;
      const skus = rows.filter(r => r[headers[codeIdx]]).map(r => mkSKU(String(r[headers[codeIdx]]).trim(), String(r[headers[nameIdx]]||'').trim()));
      if (!skus.length) { setError('No SKU rows found'); return; }
      setData(skus); setError('');
    } catch(e) { setError(String(e)); }
  }
  function apply() {
    if (!data) return;
    const existCodes = new Set(existingSkus.map(s => s.code));
    const merged = [...existingSkus];
    for (const s of data) { if (!existCodes.has(s.code)) merged.push(s); }
    onApply(merged);
  }
  return (
    <div className="modal-overlay" onClick={e=>e.target===e.currentTarget&&onClose()}>
      <div className="modal" style={{maxWidth:'480px'}}>
        <div className="modal-hdr"><h2>📋 Import SKU List</h2><button className="btn btn-secondary btn-sm" onClick={onClose}>✕ Close</button></div>
        <div className="modal-body">
          <p style={{fontSize:'13px',color:'#64748b',marginBottom:'12px'}}>Upload Excel/CSV with <strong>SKU Code</strong> and <strong>SKU Name</strong> columns. Existing SKUs are preserved (supply quantities kept).</p>
          {error && <div className="warn-box">⚠️ {error}</div>}
          <div className="upload-zone" onClick={()=>fileRef.current?.click()} onDragOver={e=>e.preventDefault()} onDrop={e=>{e.preventDefault();handleFile(e.dataTransfer.files[0]);}}>
            <input ref={fileRef} type="file" accept=".xlsx,.csv" style={{display:'none'}} onChange={e=>handleFile(e.target.files[0])} />
            {data ? <span style={{color:'#16a34a'}}>✓ {data.length} SKUs ready to import</span> : <span>Click or drag Excel / CSV file here</span>}
          </div>
        </div>
        <div className="modal-footer">
          <button className="btn btn-secondary" onClick={onClose}>Cancel</button>
          <button className="btn btn-primary" onClick={()=>{apply();onClose();}} disabled={!data}>Import {data?.length||''} SKUs</button>
        </div>
      </div>
    </div>
  );
}

// ─────────────────────────────────────────────
// FACTORY CODE MAP MODAL
// ─────────────────────────────────────────────
function FactoryCodeMapModal({ kind, materials, factoryName, onApply, onClose }) {
  const [data, setData] = useState(null);
  const [detectedCols, setDetectedCols] = useState(null);
  const [error, setError] = useState('');
  const fileRef = useRef();
  async function handleFile(file) {
    try {
      const { headers, rows } = await parseUpload(file);
      // Try multiple keywords for each column
      const hi = (...kws) => { for (const kw of kws) { const i = headers.findIndex(h => h.toLowerCase().includes(kw)); if (i >= 0) return i; } return -1; };
      // Mosaic code column: most specific - detect first
      const mcIdx = (() => {
        const i = hi('mosaic rm', 'mosaic pm', 'mosaic code', 'mosaic', 'internal code', 'rm code', 'pm code');
        return i >= 0 ? i : -1;
      })();
      // Factory code column: detect by various possible names used in real files
      const fcIdx = (() => {
        const candidates = [factoryName.toLowerCase(), 'manufacturer', 'mfr', 'sprivil', 'factory', 'vendor', 'supplier', 'external'];
        for (const kw of candidates) {
          const i = hi(kw);
          if (i >= 0 && i !== mcIdx) return i;
        }
        return mcIdx === 0 ? 1 : 0;
      })();
      // Name column: prefer mosaic description or material name, not SKU name
      const mnIdx = (() => {
        const i = hi('mosaic pm_d', 'mosaic rm_d', 'mosaic description', 'material', 'description', 'name');
        if (i >= 0 && i !== fcIdx && i !== mcIdx) return i;
        return headers.findIndex((_,idx) => idx !== fcIdx && idx !== mcIdx);
      })();
      const mapped = rows
        .filter(r => r[headers[fcIdx]] && r[headers[mcIdx]])
        .map(r => ({
          factoryCode: String(r[headers[fcIdx]]).trim(),
          mosaicCode: String(r[headers[mcIdx]]).trim(),
          mosaicName: String(r[headers[mnIdx]] || '').trim()
        }));
      if (!mapped.length) { setError('No mapping rows found. Check your file has data rows.'); return; }
      setDetectedCols({ fc: headers[fcIdx], mc: headers[mcIdx], mn: headers[mnIdx] });
      setData(mapped); setError('');
    } catch(e) { setError(String(e)); }
  }
  // Group rows by mosaicCode → collect all factory codes per Mosaic code
  const groupedData = useMemo(() => {
    if (!data) return [];
    const map = {};
    for (const r of data) {
      const key = r.mosaicCode.toUpperCase();
      if (!map[key]) map[key] = { mosaicCode: r.mosaicCode, mosaicName: r.mosaicName, factoryCodes: [] };
      if (r.factoryCode && !map[key].factoryCodes.includes(r.factoryCode)) {
        map[key].factoryCodes.push(r.factoryCode);
      }
    }
    return Object.values(map);
  }, [data]);
  const updateCount = useMemo(() => {
    if (!groupedData.length) return 0;
    const existingIds = new Set(materials.map(m => m.id.toUpperCase()));
    return groupedData.filter(r => existingIds.has(r.mosaicCode.toUpperCase())).length;
  }, [groupedData, materials]);
  const newCount = groupedData.length - updateCount;
  function apply() {
    if (!groupedData.length) return;
    const existingMap = Object.fromEntries(materials.map(m => [m.id.toUpperCase(), m]));
    const newMaterials = groupedData.map(r => {
      const sprivilCode = r.factoryCodes.join(', ');
      const existing = existingMap[r.mosaicCode.toUpperCase()];
      if (existing) {
        return { ...existing, sprivilCode, name: r.mosaicName || existing.name };
      }
      return {
        id: r.mosaicCode, code: r.mosaicCode,
        name: r.mosaicName || r.mosaicCode,
        sprivilCode,
        aliases: [], active: true,
        stock: 0, openPO: 0, reqM1: 0, reqM2: 0, moq: 0,
      };
    });
    onApply(newMaterials);
  }
  return (
    <div className="modal-overlay" onClick={e=>e.target===e.currentTarget&&onClose()}>
      <div className="modal" style={{maxWidth:'580px'}}>
        <div className="modal-hdr"><h2>🔗 {factoryName} Code Mapping — {kind.toUpperCase()}</h2><button className="btn btn-secondary btn-sm" onClick={onClose}>✕ Close</button></div>
        <div className="modal-body">
          <p style={{fontSize:'13px',color:'#64748b',marginBottom:'12px'}}>Upload Excel/CSV with three columns: <strong>{factoryName} Code</strong> | <strong>Mosaic Code</strong> | <strong>Material Name</strong>.</p>
          {error && <div className="warn-box">⚠️ {error}</div>}
          <div className="upload-zone" onClick={()=>fileRef.current?.click()} onDragOver={e=>e.preventDefault()} onDrop={e=>{e.preventDefault();handleFile(e.dataTransfer.files[0]);}}>
            <input ref={fileRef} type="file" accept=".xlsx,.csv" style={{display:'none'}} onChange={e=>handleFile(e.target.files[0])} />
            {data
              ? <span style={{color:'#16a34a'}}>✓ {data.length} rows loaded → {groupedData.length} unique materials</span>
              : <span>Click or drag Excel / CSV file here</span>}
          </div>
          {detectedCols && data && (
            <div style={{marginTop:'12px',fontSize:'12px'}}>
              <div style={{marginBottom:'6px',color:'#475569'}}>
                <strong>Detected columns:</strong>&nbsp;
                <span style={{background:'#e0f2fe',padding:'2px 6px',borderRadius:'4px',marginRight:'4px'}}>{detectedCols.fc} → Factory Code</span>
                <span style={{background:'#dcfce7',padding:'2px 6px',borderRadius:'4px',marginRight:'4px'}}>{detectedCols.mc} → Mosaic Code</span>
                <span style={{background:'#f3e8ff',padding:'2px 6px',borderRadius:'4px'}}>{detectedCols.mn} → Name</span>
              </div>
              <table style={{width:'100%',borderCollapse:'collapse',fontSize:'11px'}}>
                <thead><tr style={{background:'#f8fafc'}}>
                  <th style={{padding:'4px 6px',border:'1px solid #e2e8f0',textAlign:'left'}}>Factory Code</th>
                  <th style={{padding:'4px 6px',border:'1px solid #e2e8f0',textAlign:'left'}}>Mosaic Code</th>
                  <th style={{padding:'4px 6px',border:'1px solid #e2e8f0',textAlign:'left'}}>Material Name</th>
                  <th style={{padding:'4px 6px',border:'1px solid #e2e8f0',textAlign:'center'}}>Match?</th>
                </tr></thead>
                <tbody>
                  {data.slice(0,5).map((r,i) => {
                    const idMap = Object.fromEntries(materials.map(m=>[m.id.toUpperCase(),true]));
                    const nmMap = Object.fromEntries(materials.map(m=>[norm(m.name),true]));
                    const matched = idMap[r.mosaicCode.toUpperCase()] || nmMap[norm(r.mosaicName)];
                    return <tr key={i} style={{background: matched ? '#f0fdf4' : '#fff7ed'}}>
                      <td style={{padding:'3px 6px',border:'1px solid #e2e8f0'}}>{r.factoryCode}</td>
                      <td style={{padding:'3px 6px',border:'1px solid #e2e8f0'}}>{r.mosaicCode}</td>
                      <td style={{padding:'3px 6px',border:'1px solid #e2e8f0'}}>{r.mosaicName}</td>
                      <td style={{padding:'3px 6px',border:'1px solid #e2e8f0',textAlign:'center'}}>{matched ? '✅' : '❌'}</td>
                    </tr>;
                  })}
                </tbody>
              </table>
              {data.length > 5 && <div style={{color:'#64748b',marginTop:'4px'}}>…and {data.length-5} more rows</div>}
              <div style={{marginTop:'8px', color:'#16a34a', fontWeight:600}}>
                {dedupedData.length} materials will be imported
                {updateCount > 0 && <span style={{color:'#0369a1'}}> ({updateCount} updates, {newCount} new)</span>}
              </div>
            </div>
          )}
        </div>
        <div className="modal-footer">
          <button className="btn btn-secondary" onClick={onClose}>Cancel</button>
          <button className="btn btn-primary" onClick={()=>{apply();onClose();}} disabled={!groupedData.length}>Import {groupedData.length} Materials</button>
        </div>
      </div>
    </div>
  );
}

// ─────────────────────────────────────────────
// APP
// ─────────────────────────────────────────────
function App() {
  const [factories, setFactories] = useState(() => loadFactories() || [initSprivilFactory()]);
  const [activeFactoryId, setActiveFactoryId] = useState(() => loadActiveFactoryId());
  const [activeTab, setActiveTab] = useState('supply');
  const [modal, setModal] = useState(null);

  useEffect(() => { saveFactories(factories); }, [factories]);
  useEffect(() => { saveActiveFactoryId(activeFactoryId); }, [activeFactoryId]);

  const factory = factories.find(f => f.id === activeFactoryId) || factories[0];

  function updateFactory(updates) {
    setFactories(prev => prev.map(f => f.id === factory.id ? { ...f, ...updates } : f));
  }

  const { skus, rm: rmMaterials, pm: pmMaterials, vendorMap, m1Label, m2Label, hasRM, hasPM, name: factoryName } = factory;

  function handleUpdate(kind, updated) {
    if (kind === 'rm') updateFactory({ rm: updated });
    else updateFactory({ pm: updated });
  }

  const ordersRM = useMemo(() => hasRM ? rmMaterials.filter(m => { const m1=calcM1(m); const m2=calcM2(m,m1); return m1.actual>0||m2.actual>0; }).length : 0, [rmMaterials, hasRM]);
  const ordersPM = useMemo(() => hasPM ? pmMaterials.filter(m => { const m1=calcM1(m); const m2=calcM2(m,m1); return m1.actual>0||m2.actual>0; }).length : 0, [pmMaterials, hasPM]);

  function handleExtractBom() {
    const { rmM1, rmM2, pmM1, pmM2 } = extractBomQty(skus, rmMaterials, pmMaterials, vendorMap);
    updateFactory({
      rm: rmMaterials.map(m => ({ ...m, reqM1: rmM1[m.id]!=null ? Math.round(rmM1[m.id]*1000)/1000 : m.reqM1, reqM2: rmM2[m.id]!=null ? Math.round(rmM2[m.id]*1000)/1000 : m.reqM2 })),
      pm: pmMaterials.map(m => ({ ...m, reqM1: pmM1[m.id]!=null ? Math.round(pmM1[m.id]) : m.reqM1, reqM2: pmM2[m.id]!=null ? Math.round(pmM2[m.id]) : m.reqM2 })),
    });
    alert('✅ Required quantities updated in Consolidated RM & PM tabs!');
  }

  function resetFactory() {
    if (!window.confirm(`Reset ${factoryName}'s data to defaults? This cannot be undone.`)) return;
    updateFactory({ rm: SEED_RM, pm: SEED_PM, skus: factory.id==='sprivil' ? SEED_SKUS : [], vendorMap: {}, m1Label: 'M1', m2Label: 'M2' });
  }

  function addFactory(name, hasRM, hasPM) {
    const f = initNewFactory(name, hasRM, hasPM);
    setFactories(prev => [...prev, f]);
    setActiveFactoryId(f.id);
    setActiveTab('supply');
  }

  return (
    <div>
      <div className="app-header">
        <span style={{fontSize:'22px'}}>📦</span>
        <h1>Supply Planner</h1>
        <span className="badge">Mosaic Wellness</span>
        <div className="month-labels">
          <label style={{fontWeight:600,color:'#1e293b'}}>Factory:</label>
          <select
            value={activeFactoryId}
            onChange={e=>{setActiveFactoryId(e.target.value);setActiveTab('supply');}}
            style={{padding:'4px 10px',borderRadius:'6px',border:'1px solid #cbd5e1',fontSize:'13px',fontWeight:600,marginLeft:'4px'}}
          >
            {factories.map(f => <option key={f.id} value={f.id}>{f.name}</option>)}
          </select>
          <button className="btn btn-secondary btn-sm" style={{marginLeft:'4px'}} onClick={()=>setModal('addFactory')}>+ Add</button>
          <span style={{margin:'0 8px',color:'#cbd5e1'}}>|</span>
          <label>M1:</label>
          <input className="month-input" value={m1Label} onChange={e=>updateFactory({m1Label:e.target.value})} />
          <label style={{marginLeft:'8px'}}>M2:</label>
          <input className="month-input" value={m2Label} onChange={e=>updateFactory({m2Label:e.target.value})} />
          <button className="btn btn-secondary btn-sm" style={{marginLeft:'12px'}} onClick={()=>setModal('vendorMap')}>🔗 Vendor Map</button>
          <button className="btn btn-secondary btn-sm" onClick={()=>setModal('help')}>? Help</button>
          <button className="btn btn-secondary btn-sm" style={{color:'#ef4444',borderColor:'#fecaca'}} onClick={resetFactory}>↺ Reset</button>
        </div>
      </div>

      <div className="tabs">
        <button className={`tab-btn${activeTab==='supply'?' active':''}`} onClick={()=>setActiveTab('supply')}>Supply Entry</button>
        {hasRM && (
          <button className={`tab-btn${activeTab==='rm'?' active':''}`} onClick={()=>setActiveTab('rm')}>
            Consolidated RM{ordersRM>0&&<span className="badge-cnt">{ordersRM}</span>}
          </button>
        )}
        {hasPM && (
          <button className={`tab-btn${activeTab==='pm'?' active':''}`} onClick={()=>setActiveTab('pm')}>
            Consolidated PM{ordersPM>0&&<span className="badge-cnt">{ordersPM}</span>}
          </button>
        )}
        <button className={`tab-btn${activeTab==='skudoc'?' active':''}`} onClick={()=>setActiveTab('skudoc')}>SKU Doc</button>
      </div>

      <div className="content">
        {activeTab==='supply' && (
          <SupplyEntryTab
            skus={skus}
            onUpdateSkus={s=>updateFactory({skus:s})}
            onImportSkus={s=>updateFactory({skus:s})}
            onExtract={handleExtractBom}
            m1Label={m1Label}
            m2Label={m2Label}
          />
        )}
        {activeTab==='rm' && hasRM && (
          <ConsolidatedTab kind="rm" materials={rmMaterials} vendorMap={vendorMap} onUpdate={handleUpdate} m1Label={m1Label} m2Label={m2Label} factoryName={factoryName} />
        )}
        {activeTab==='pm' && hasPM && (
          <ConsolidatedTab kind="pm" materials={pmMaterials} vendorMap={vendorMap} onUpdate={handleUpdate} m1Label={m1Label} m2Label={m2Label} factoryName={factoryName} />
        )}
        {activeTab==='skudoc' && (
          <SkuDocTab skus={skus} rmMaterials={rmMaterials} pmMaterials={pmMaterials} vendorMap={vendorMap} m1Label={m1Label} m2Label={m2Label} />
        )}
      </div>

      {modal==='help' && <HelpModal onClose={()=>setModal(null)} />}
      {modal==='addFactory' && <AddFactoryModal onAdd={addFactory} onClose={()=>setModal(null)} />}
      {modal==='vendorMap' && (
        <GlobalVendorMapModal
          vendorMap={vendorMap}
          rmMaterials={rmMaterials}
          pmMaterials={pmMaterials}
          onSave={vm=>updateFactory({vendorMap:vm})}
          onClose={()=>setModal(null)}
        />
      )}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
