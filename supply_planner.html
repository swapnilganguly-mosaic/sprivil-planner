                  )}
                  <td>{m.name}</td>
                  {/* LT */}
                  <td className="center" style={{background:'#f0f9ff'}}>
                    <input type="number" className="num-input" style={{width:'60px',background:'transparent',textAlign:'center'}} value={m.lt||0} min={0}
                      onChange={e=>{const v=parseFloat(e.target.value)||0; onUpdate(kind,materials.map(x=>x.id===m.id?{...x,lt:v}:x));}}
                    />
                  </td>
                  {/* Min DOC */}
                  <td className="center" style={{background:'#f0f9ff'}}>
                    <input type="number" className="num-input" style={{width:'60px',background:'transparent',textAlign:'center'}} value={m.minDoc||0} min={0}
                      onChange={e=>{const v=parseFloat(e.target.value)||0; onUpdate(kind,materials.map(x=>x.id===m.id?{...x,minDoc:v}:x));}}
                    />
                  </td>
                  {/* MOQ editable */}
                  <td className="right">
                    <input type="number" className="num-input" value={m.moq||0} min={0}
                      onChange={e=>{
                        const v=parseFloat(e.target.value)||0;
                        onUpdate(kind,materials.map(x=>x.id===m.id?{...x,moq:v}:x));
                      }}
                    />
                  </td>
                  {/* Stock + Open PO */}
                  <td className="right">{fmt(m.stock)}</td>
                  <td className="right">
                    <input type="number" className="num-input" value={m.openPO||0} min={0}
                      onChange={e=>{
                        const v=parseFloat(e.target.value)||0;
                        onUpdate(kind,materials.map(x=>x.id===m.id?{...x,openPO:v}:x));
                      }}
                    />
                  </td>
                  {/* M1 */}
                  <td className="right m1-col">
                    <input type="number" className="num-input" style={{background:'transparent'}} value={m.reqM1||0} min={0}
                      onChange={e=>{
                        const v=parseFloat(e.target.value)||0;
                        onUpdate(kind,materials.map(x=>x.id===m.id?{...x,reqM1:v}:x));
                      }}
                    />
                  </td>
                  <td className="right m1-col">{m1.doc != null ? fmt(m1.doc, 1) : '—'}</td>
                  <td className="right m1-col">{fmt(m1.desired)}</td>
                  <td className="right m1-col" style={{fontWeight:m1.actual>0?'600':'normal'}}>{fmt(m1.actual)}</td>
                  <td className="right m1-col">{fmtPct(m1.diff)}</td>
                  <td className="m1-col center"><StatusPill status={m1.status}/></td>
                  {/* M2 */}
                  <td className="right m2-col">{fmt(m2.opening)}</td>
                  <td className="right m2-col">
                    <input type="number" className="num-input" style={{background:'transparent'}} value={m.reqM2||0} min={0}
                      onChange={e=>{
                        const v=parseFloat(e.target.value)||0;
                        onUpdate(kind,materials.map(x=>x.id===m.id?{...x,reqM2:v}:x));
                      }}
                    />
                  </td>
                  <td className="right m2-col">{m2.doc != null ? fmt(m2.doc, 1) : '—'}</td>
                  <td className="right m2-col">{fmt(m2.desired)}</td>
                  <td className="right m2-col" style={{fontWeight:m2.actual>0?'600':'normal'}}>{fmt(m2.actual)}</td>
                  <td className="right m2-col">{fmtPct(m2.diff)}</td>
                  <td className="m2-col center"><StatusPill status={m2.status}/></td>
                </tr>
              );
            })}
          </tbody>
        </table>
      </div>

      {modal && modal.type === 'stockpo' && (
        <StockPOImportModal
          kind={kind}
          materials={materials}
          onApply={handleStockPOApply}
          onClose={()=>setModal(null)}
        />
      )}

      {modal && modal.type === 'req' && (
        <ReqImportModal
          kind={kind}
          materials={materials}
          vendorMap={vendorMap}
          onApply={handleApply}
          onClose={()=>setModal(null)}
        />
      )}

      {modal && modal.type === 'moq' && (
        <ImportModal
          title={`Import MOQ — ${kind.toUpperCase()}`}
          importType="moq"
          materials={materials}
          vendorMap={vendorMap}
          onApply={handleApply}
          onClose={()=>setModal(null)}
        />
      )}

      {modal && modal.type === 'vendorMap' && (
        <VendorMapModal
          vendorMap={vendorMap}
          rmMaterials={[]}
          pmMaterials={materials}
          onSave={map => {/* handled in App */}}
          onClose={()=>setModal(null)}
        />
      )}

      {modal?.type==='factorymap' && (
        <FactoryCodeMapModal
          kind={kind}
          materials={materials}
          factoryName={factoryName}
          onApply={updated => { onUpdate(kind, updated); setModal(null); }}
          onClose={()=>setModal(null)}
        />
      )}

      {modal?.type==='apiraw' && (
        <div className="modal-overlay" onClick={e=>e.target===e.currentTarget&&setModal(null)}>
          <div className="modal" style={{maxWidth:'680px'}}>
            <div className="modal-hdr">
              <h2>🌐 API Raw Response</h2>
              <button className="btn btn-secondary btn-sm" onClick={()=>setModal(null)}>✕ Close</button>

              <p style={{color:'#64748b',fontSize:'13px',marginBottom:'12px'}}>
                {apiResult?.applied === 0
                  ? "Couldn't auto-map this response to materials. Share this JSON so we can wire up the parser."

              <pre style={{background:'#f8fafc',border:'1px solid #e2e8f0',borderRadius:'8px',padding:'12px',fontSize:'12px',overflow:'auto',maxHeight:'400px',whiteSpace:'pre-wrap',wordBreak:'break-all'}}>
                {JSON.stringify(modal.data, null, 2)}
              </pre>
            </div>
          </div>
        </div>

function ImportSkuListModal({ existingSkus, onApply, onClose }) {
  const [data, setData] = useState(null);
  const [error, setError] = useState('');
  const fileRef = useRef();
  async function handleFile(file) {
    try {
      const { headers, rows } = await parseUpload(file);
      const hi = kw => headers.findIndex(h => h.toLowerCase().includes(kw));
      const codeIdx = hi('code') >= 0 ? hi('code') : 0;
      const nameIdx = hi('name') >= 0 ? hi('name') : 1;
      const skus = rows.filter(r => r[headers[codeIdx]]).map(r => mkSKU(String(r[headers[codeIdx]]).trim(), String(r[headers[nameIdx]]||'').trim()));

// ─────────────────────────────────────────────
// FACTORY CODE MAP MODAL
// ─────────────────────────────────────────────
function FactoryCodeMapModal({ kind, materials, factoryName, onApply, onClose }) {
  const [data, setData] = useState(null);
  const [detectedCols, setDetectedCols] = useState(null);
  const [error, setError] = useState('');
  const fileRef = useRef();
  async function handleFile(file) {
    try {
      const { headers, rows } = await parseUpload(file);
      // Try multiple keywords for each column
      const hi = (...kws) => { for (const kw of kws) { const i = headers.findIndex(h => h.toLowerCase().includes(kw)); if (i >= 0) return i; } return -1; };
      // Mosaic code column: most specific - detect first
      const mcIdx = (() => {
        const i = hi('mosaic rm', 'mosaic pm', 'mosaic code', 'mosaic', 'internal code', 'rm code', 'pm code');
        return i >= 0 ? i : -1;
      })();
      // Factory code column: detect by various possible names used in real files
      const fcIdx = (() => {
        const candidates = [factoryName.toLowerCase(), 'manufacturer', 'mfr', 'sprivil', 'factory', 'vendor', 'supplier', 'external'];
        for (const kw of candidates) {
          const i = hi(kw);
          if (i >= 0 && i !== mcIdx) return i;
        }
        return mcIdx === 0 ? 1 : 0;
      })();
      // Name column: prefer mosaic description or material name, not SKU name
      const mnIdx = (() => {
        const i = hi('mosaic pm_d', 'mosaic rm_d', 'mosaic description', 'material', 'description', 'name');
        if (i >= 0 && i !== fcIdx && i !== mcIdx) return i;
        return headers.findIndex((_,idx) => idx !== fcIdx && idx !== mcIdx);
      })();
      const mapped = rows
        .filter(r => r[headers[fcIdx]] && r[headers[mcIdx]])
        .map(r => ({
          factoryCode: String(r[headers[fcIdx]]).trim(),
          mosaicCode: String(r[headers[mcIdx]]).trim(),
          mosaicName: String(r[headers[mnIdx]] || '').trim()
        }));
      if (!mapped.length) { setError('No mapping rows found. Check your file has data rows.'); return; }
      setDetectedCols({ fc: headers[fcIdx], mc: headers[mcIdx], mn: headers[mnIdx] });
      setData(mapped); setError('');
    } catch(e) { setError(String(e)); }
  }
  // Group rows by mosaicCode → collect all factory codes per Mosaic code
  const groupedData = useMemo(() => {
    if (!data) return [];
    const map = {};
    for (const r of data) {
      const key = r.mosaicCode.toUpperCase();
      if (!map[key]) map[key] = { mosaicCode: r.mosaicCode, mosaicName: r.mosaicName, factoryCodes: [] };
      if (r.factoryCode && !map[key].factoryCodes.includes(r.factoryCode)) {
        map[key].factoryCodes.push(r.factoryCode);
      }
    }
    return Object.values(map);
  }, [data]);
  const updateCount = useMemo(() => {
    if (!groupedData.length) return 0;
    const existingIds = new Set(materials.map(m => m.id.toUpperCase()));
    return groupedData.filter(r => existingIds.has(r.mosaicCode.toUpperCase())).length;
  }, [groupedData, materials]);
  const newCount = groupedData.length - updateCount;
  function apply() {
    if (!groupedData.length) return;
    const existingMap = Object.fromEntries(materials.map(m => [m.id.toUpperCase(), m]));
    const newMaterials = groupedData.map(r => {
      const sprivilCode = r.factoryCodes.join(', ');
      const existing = existingMap[r.mosaicCode.toUpperCase()];
      if (existing) {
        return { ...existing, sprivilCode, name: r.mosaicName || existing.name };
      }
      return {
        id: r.mosaicCode, code: r.mosaicCode,
        name: r.mosaicName || r.mosaicCode,
        sprivilCode,
        aliases: [], active: true,
        stock: 0, openPO: 0, reqM1: 0, reqM2: 0, moq: 0,
      };
    });
    onApply(newMaterials);
  }
  return (
    <div className="modal-overlay" onClick={e=>e.target===e.currentTarget&&onClose()}>
      <div className="modal" style={{maxWidth:'580px'}}>
        <div className="modal-hdr"><h2>🔗 {factoryName} Code Mapping — {kind.toUpperCase()}</h2><button className="btn btn-secondary btn-sm" onClick={onClose}>✕ Close</button></div>
        <div className="modal-body">
          <p style={{fontSize:'13px',color:'#64748b',marginBottom:'12px'}}>Upload Excel/CSV with three columns: <strong>{factoryName} Code</strong> | <strong>Mosaic Code</strong> | <strong>Material Name</strong>.</p>
          {error && <div className="warn-box">⚠️ {error}</div>}
          <div className="upload-zone" onClick={()=>fileRef.current?.click()} onDragOver={e=>e.preventDefault()} onDrop={e=>{e.preventDefault();handleFile(e.dataTransfer.files[0]);}}>
            <input ref={fileRef} type="file" accept=".xlsx,.csv" style={{display:'none'}} onChange={e=>handleFile(e.target.files[0])} />
            {data
              ? <span style={{color:'#16a34a'}}>✓ {data.length} rows loaded → {groupedData.length} unique materials</span>
              : <span>Click or drag Excel / CSV file here</span>}
          </div>
          {detectedCols && data && (
            <div style={{marginTop:'12px',fontSize:'12px'}}>
              <div style={{marginBottom:'6px',color:'#475569'}}>
                <strong>Detected columns:</strong>&nbsp;
                <span style={{background:'#e0f2fe',padding:'2px 6px',borderRadius:'4px',marginRight:'4px'}}>{detectedCols.fc} → Factory Code</span>
                <span style={{background:'#dcfce7',padding:'2px 6px',borderRadius:'4px',marginRight:'4px'}}>{detectedCols.mc} → Mosaic Code</span>
                <span style={{background:'#f3e8ff',padding:'2px 6px',borderRadius:'4px'}}>{detectedCols.mn} → Name</span>
              </div>
              <table style={{width:'100%',borderCollapse:'collapse',fontSize:'11px'}}>
                <thead><tr style={{background:'#f8fafc'}}>
                  <th style={{padding:'4px 6px',border:'1px solid #e2e8f0',textAlign:'left'}}>Factory Code</th>
                  <th style={{padding:'4px 6px',border:'1px solid #e2e8f0',textAlign:'left'}}>Mosaic Code</th>
                  <th style={{padding:'4px 6px',border:'1px solid #e2e8f0',textAlign:'left'}}>Material Name</th>
                  <th style={{padding:'4px 6px',border:'1px solid #e2e8f0',textAlign:'center'}}>Match?</th>
                </tr></thead>
                <tbody>
                  {data.slice(0,5).map((r,i) => {
                    const idMap = Object.fromEntries(materials.map(m=>[m.id.toUpperCase(),true]));
                    const nmMap = Object.fromEntries(materials.map(m=>[norm(m.name),true]));
                    const matched = idMap[r.mosaicCode.toUpperCase()] || nmMap[norm(r.mosaicName)];
                    return <tr key={i} style={{background: matched ? '#f0fdf4' : '#fff7ed'}}>
                      <td style={{padding:'3px 6px',border:'1px solid #e2e8f0'}}>{r.factoryCode}</td>
                      <td style={{padding:'3px 6px',border:'1px solid #e2e8f0'}}>{r.mosaicCode}</td>
                      <td style={{padding:'3px 6px',border:'1px solid #e2e8f0'}}>{r.mosaicName}</td>
                      <td style={{padding:'3px 6px',border:'1px solid #e2e8f0',textAlign:'center'}}>{matched ? '✅' : '❌'}</td>
                    </tr>;
                  })}
                </tbody>
              </table>
              {data.length > 5 && <div style={{color:'#64748b',marginTop:'4px'}}>…and {data.length-5} more rows</div>}
              <div style={{marginTop:'8px', color:'#16a34a', fontWeight:600}}>
                {groupedData.length} materials will be imported
                {updateCount > 0 && <span style={{color:'#0369a1'}}> ({updateCount} updates, {newCount} new)</span>}
              </div>
            </div>
          )}
        </div>
        <div className="modal-footer">
          <button className="btn btn-secondary" onClick={onClose}>Cancel</button>
          <button className="btn btn-primary" onClick={()=>{apply();onClose();}} disabled={!groupedData.length}>Import {groupedData.length} Materials</button>
        </div>
      </div>
    </div>
  );
}

// ─────────────────────────────────────────────
// ORDER SCHEDULE ENGINE
// ─────────────────────────────────────────────
function parseISODate(str) {
  if (!str) { const n = new Date(); n.setDate(1); n.setHours(0,0,0,0); return n; }
  const parts = str.split('-').map(Number);
  return new Date(parts[0], parts[1]-1, parts[2]||1);
}
function addDays(date, n) { const r = new Date(date); r.setDate(r.getDate()+n); return r; }
function fmtDate(d) { return d instanceof Date ? d.toLocaleDateString('en-IN',{day:'numeric',month:'short'}) : '—'; }
function daysBetween(a,b) { return Math.floor((b-a)/86400000); }

function buildOrderSchedule(mat, monthPlans, m1Start) {
  const lt = mat.lt || 0;
  const minDoc = mat.minDoc || 0;
  if (!lt || !minDoc) return { tranches:[], rop:0, drrs:[], daily:[], totalDays:0 };

  const totalDays = monthPlans.reduce((s,m)=>s+m.days,0);
  const daily = [];
  const drrs = monthPlans.map(m => m.days>0 ? m.req/m.days : 0);
  monthPlans.forEach((m,mi) => { for(let d=0;d<m.days;d++) daily.push(drrs[mi]); });

  const drr0 = drrs[0] || 0;
  const rop = Math.round(minDoc * drr0);
  const stock = mat.stock || 0;
  const openPO = mat.openPO || 0;
  const moq = mat.moq || 0;
  const effectiveCovDays = drr0>0 ? Math.max(0,(stock-rop)/drr0) : 9999;

  // build LT-day tranches
  const tranches = [];
  let ts = 0;
  while (ts < totalDays) {
    const te = Math.min(ts+lt, totalDays);
    const qty = Math.round(daily.slice(ts,te).reduce((a,b)=>a+b,0));
    tranches.push({
      ts, te, qty,
      startDate: addDays(m1Start, ts),
      endDate:   addDays(m1Start, te-1),
      orderByDate: addDays(m1Start, ts-lt),
    });
    ts = te;
  }

  let remPO = openPO;
  const today = new Date(); today.setHours(0,0,0,0);

  // If stock < ROP, compute how much extra we need on the first order to top up to ROP.
  // Open PO is checked first — it may already cover the gap.
  let ropTopUp = stock < rop ? Math.max(0, rop - stock - remPO) : 0;
  if (stock < rop) remPO = Math.max(0, remPO - (rop - stock)); // PO absorbs ROP gap first

  const result = tranches.map((t, ti) => {
    if (t.ts < effectiveCovDays) return {...t, orderQty:0, coveredBy:'stock', status:'covered'};
    if (remPO >= t.qty) { remPO-=t.qty; return {...t, orderQty:0, coveredBy:'po', status:'covered-po'}; }
    const shortfall = t.qty - remPO; remPO=0;
    // First uncovered tranche: add ROP top-up so stock never goes below ROP
    const extra = ti===0 ? ropTopUp : 0; ropTopUp=0;
    const rawQty = Math.round(shortfall) + extra;
    const orderQty = moq>0 ? Math.max(rawQty, moq) : rawQty;
    const ob = new Date(t.orderByDate); ob.setHours(0,0,0,0);
    const diff = daysBetween(today,ob);
    const status = diff<0 ? 'overdue' : diff<=7 ? 'soon' : 'upcoming';
    return {...t, orderQty, coveredBy:null, status};
  });

  return { tranches:result, rop, drrs, daily, totalDays };
}

// ─────────────────────────────────────────────
// INVENTORY CHART (SVG sawtooth)
// ─────────────────────────────────────────────
function InventoryChart({ mat, monthPlans, schedule }) {
  const W=680, H=200, PL=56, PR=12, PT=12, PB=30;
  const cw=W-PL-PR, ch=H-PT-PB;
  const { daily=[], totalDays=0, rop=0, tranches=[] } = schedule;
  if (!totalDays) return null;

  // simulate inventory from M1 day 0
  const receipts = {};
  for(const t of tranches) if(t.orderQty>0) receipts[t.ts]=(receipts[t.ts]||0)+t.orderQty;
  let inv = mat.stock || 0;
  const pts = [];
  for(let d=0;d<=totalDays;d++) {
    if(receipts[d]) inv+=receipts[d];
    pts.push(Math.max(0, inv));
    if(daily[d]!=null) inv-=daily[d];
  }
  const maxInv = Math.max(rop*1.6, ...pts, 1);
  const xs = d => PL+(d/totalDays)*cw;
  const ys = v => PT+ch-(v/maxInv)*ch;
  const pathD = pts.map((v,i)=>`${i===0?'M':'L'}${xs(i).toFixed(1)},${ys(v).toFixed(1)}`).join(' ');

  // month separator days
  const sepDays=[], cumDays=[]; let cum=0;
  monthPlans.forEach((m,i)=>{ cumDays.push(cum); cum+=m.days; if(i<monthPlans.length-1) sepDays.push(cum); });

  const ropY = ys(rop);
  const yTicks = [0, Math.round(maxInv*0.5), Math.round(maxInv)];

  return (
    <svg width="100%" viewBox={`0 0 ${W} ${H}`} style={{display:'block',background:'#f8fafc',borderRadius:'8px',border:'1px solid #d1fae5'}}>
      {/* month separators */}
      {sepDays.map(d=><line key={d} x1={xs(d)} y1={PT} x2={xs(d)} y2={PT+ch} stroke="#e2e8f0" strokeDasharray="4 2"/>)}
      {/* month labels */}
      {monthPlans.map((m,mi)=>(
        <text key={mi} x={xs(cumDays[mi]+m.days/2)} y={H-6} textAnchor="middle" fontSize="10" fill="#94a3b8">{m.label}</text>
      ))}
      {/* receipt lines */}
      {tranches.filter(t=>t.orderQty>0).map((t,i)=>(
        <line key={i} x1={xs(t.ts)} y1={PT} x2={xs(t.ts)} y2={PT+ch} stroke="#059669" strokeWidth="1.5" opacity="0.4"/>
      ))}
      {/* ROP line */}
      <line x1={PL} y1={ropY} x2={PL+cw} y2={ropY} stroke="#ef4444" strokeDasharray="6 3" strokeWidth="1.5"/>
      <text x={PL-4} y={ropY+4} textAnchor="end" fontSize="9" fill="#ef4444" fontWeight="600">ROP</text>
      {/* inventory line */}
      <path d={pathD} fill="none" stroke="#059669" strokeWidth="2"/>
      {/* fill below line */}
      <path d={pathD+` L${xs(totalDays).toFixed(1)},${PT+ch} L${PL},${PT+ch} Z`} fill="#059669" opacity="0.07"/>
      {/* y-axis */}
      <line x1={PL} y1={PT} x2={PL} y2={PT+ch} stroke="#d1fae5"/>
      {yTicks.map(v=>(
        <text key={v} x={PL-5} y={ys(v)+4} textAnchor="end" fontSize="9" fill="#94a3b8">
          {v.toLocaleString('en-IN')}
        </text>
      ))}
      {/* x-axis */}
      <line x1={PL} y1={PT+ch} x2={PL+cw} y2={PT+ch} stroke="#d1fae5"/>
      {/* legend */}
      <line x1={PL+10} y1={PT+6} x2={PL+26} y2={PT+6} stroke="#059669" strokeWidth="2"/>
      <text x={PL+30} y={PT+10} fontSize="9" fill="#059669">Inventory</text>
      <line x1={PL+90} y1={PT+6} x2={PL+106} y2={PT+6} stroke="#ef4444" strokeDasharray="4 2" strokeWidth="1.5"/>
      <text x={PL+110} y={PT+10} fontSize="9" fill="#ef4444">Reorder Point</text>
      <line x1={PL+190} y1={PT+6} x2={PL+206} y2={PT+6} stroke="#059669" strokeWidth="1.5" opacity="0.5"/>
      <text x={PL+210} y={PT+10} fontSize="9" fill="#059669" opacity="0.7">Receipt</text>
    </svg>
  );
}

const STATUS_META = {
  overdue:    { label:'🔴 Overdue',      bg:'#fee2e2', color:'#991b1b' },
  soon:       { label:'🟠 Due soon',     bg:'#fef3c7', color:'#92400e' },
  upcoming:   { label:'🟢 Upcoming',     bg:'#ecfdf5', color:'#059669' },
  covered:    { label:'✅ Covered',      bg:'#d1fae5', color:'#065f46' },
  'covered-po':{ label:'✅ PO covers',  bg:'#d1fae5', color:'#065f46' },
};
function StatusBadge({ status }) {
  const m = STATUS_META[status] || STATUS_META.covered;
  return <span style={{display:'inline-block',padding:'2px 8px',borderRadius:'10px',fontSize:'10px',fontWeight:700,background:m.bg,color:m.color,letterSpacing:'.3px'}}>{m.label}</span>;
}

function ActionBanner({ allSchedules }) {
  const urgent=[], soon=[];
  for(const {mat,schedule} of allSchedules) {
    for(const t of (schedule.tranches||[])) {
      if(t.orderQty<=0) continue;
      if(t.status==='overdue') urgent.push({mat,t});
      else if(t.status==='soon') soon.push({mat,t});
    }
  }
  if(!urgent.length && !soon.length) return (
    <div style={{background:'#d1fae5',border:'1px solid #a7f3d0',borderRadius:'8px',padding:'10px 16px',marginBottom:'14px',display:'flex',alignItems:'center',gap:'8px',color:'#065f46',fontSize:'12px',fontWeight:600}}>
      ✅ All orders on track — no urgent actions today
    </div>
  );
  return (
    <div style={{marginBottom:'14px',display:'flex',flexDirection:'column',gap:'8px'}}>
      {urgent.length>0 && (
        <div style={{background:'#fee2e2',border:'1px solid #fca5a5',borderRadius:'8px',padding:'10px 16px',color:'#991b1b',fontSize:'12px'}}>
          <strong>🔴 {urgent.length} OVERDUE order{urgent.length>1?'s':''} — place immediately:</strong>
          <div style={{marginTop:'4px',display:'flex',flexWrap:'wrap',gap:'6px'}}>
            {urgent.map((u,i)=>(
              <span key={i} style={{background:'#fecaca',padding:'2px 8px',borderRadius:'6px',fontSize:'11px',fontWeight:600}}>
                {u.mat.name} · {fmt(u.t.orderQty)} units · was due {fmtDate(u.t.orderByDate)}
              </span>
            ))}
          </div>
        </div>
      )}
      {soon.length>0 && (
        <div style={{background:'#fef3c7',border:'1px solid #fde68a',borderRadius:'8px',padding:'10px 16px',color:'#92400e',fontSize:'12px'}}>
          <strong>🟠 {soon.length} order{soon.length>1?'s':''} due within 7 days:</strong>
          <div style={{marginTop:'4px',display:'flex',flexWrap:'wrap',gap:'6px'}}>
            {soon.map((u,i)=>(
              <span key={i} style={{background:'#fde68a',padding:'2px 8px',borderRadius:'6px',fontSize:'11px',fontWeight:600}}>
                {u.mat.name} · {fmt(u.t.orderQty)} units · by {fmtDate(u.t.orderByDate)}
              </span>
            ))}
          </div>
        </div>
      )}
    </div>
  );
}

function OrderScheduleTab({ rmMaterials, pmMaterials, onUpdate, m1Label, m2Label, m3Label, m4Label, m1StartDate, onUpdateFactory }) {
  const [kind, setKind] = useState('rm');
  const [filterStatus, setFilterStatus] = useState('all');
  const [expandedKey, setExpandedKey] = useState(null);

  const m1Start = useMemo(()=>parseISODate(m1StartDate),[m1StartDate]);

  const getMonthPlans = useCallback((mat)=>[
    { label:m1Label, days:30, req:mat.reqM1||0 },
    { label:m2Label, days:31, req:mat.reqM2||0 },
    { label:m3Label, days:30, req:mat.reqM3||0 },
    { label:m4Label, days:31, req:mat.reqM4||0 },
  ],[m1Label,m2Label,m3Label,m4Label]);

  const materials = kind==='rm' ? rmMaterials : pmMaterials;

  const allSchedules = useMemo(()=>
    materials.map(mat=>({ mat, schedule: buildOrderSchedule(mat, getMonthPlans(mat), m1Start) })),
    [materials, getMonthPlans, m1Start]
  );

  const allRows = useMemo(()=>{
    const rows=[];
    for(const {mat,schedule} of allSchedules) {
      for(const t of schedule.tranches) rows.push({mat,t,schedule});
    }
    rows.sort((a,b)=>a.t.orderByDate-b.t.orderByDate);
    return rows;
  },[allSchedules]);

  const filtered = useMemo(()=>{
    if(filterStatus==='all') return allRows;
    if(filterStatus==='action') return allRows.filter(r=>['overdue','soon','upcoming'].includes(r.t.status));
    return allRows.filter(r=>r.t.status===filterStatus);
  },[allRows,filterStatus]);

  const missingConfig = materials.filter(m=>(!m.lt||!m.minDoc)&&(m.reqM1||m.reqM2||m.reqM3||m.reqM4));
  const urgentCount = allRows.filter(r=>r.t.status==='overdue'&&r.t.orderQty>0).length;
  const soonCount   = allRows.filter(r=>r.t.status==='soon'&&r.t.orderQty>0).length;

  return (
    <div>
      <ActionBanner allSchedules={allSchedules} />

      {missingConfig.length>0 && (
        <div className="warn-box" style={{marginBottom:'12px',fontSize:'12px'}}>
          ⚠️ {missingConfig.length} material{missingConfig.length>1?'s':''} have no Lead Time / Min DOC set. Go to the RM or PM tab to fill these in.
        </div>
      )}

      <div className="toolbar" style={{marginBottom:'12px'}}>
        <div className="sub-tabs">
          <button className={`sub-tab ${kind==='rm'?'active':''}`} onClick={()=>setKind('rm')}>
            RM {urgentCount>0&&kind==='rm'&&<span className="badge-cnt" style={{background:'#ef4444'}}>{urgentCount}</span>}
          </button>
          <button className={`sub-tab ${kind==='pm'?'active':''}`} onClick={()=>setKind('pm')}>PM</button>
        </div>

        <select style={{padding:'5px 8px',border:'1px solid #d1d5db',borderRadius:'6px',fontSize:'12px'}} value={filterStatus} onChange={e=>setFilterStatus(e.target.value)}>
          <option value="all">All tranches</option>
          <option value="action">⚡ Action needed</option>
          <option value="overdue">🔴 Overdue</option>
          <option value="soon">🟠 Due this week</option>
          <option value="upcoming">🟢 Upcoming</option>
          <option value="covered">✅ Covered</option>
          <option value="covered-po">✅ PO covers</option>
        </select>

        <div style={{display:'flex',alignItems:'center',gap:'6px',fontSize:'12px',color:'#64748b'}}>
          <span>M1 starts:</span>
          <input type="date" value={m1StartDate||''} onChange={e=>onUpdateFactory({m1StartDate:e.target.value})}
            style={{padding:'4px 8px',border:'1px solid #d1d5db',borderRadius:'6px',fontSize:'12px'}} />
        </div>

        <div className="spacer"/>
        <span style={{fontSize:'11px',color:'#94a3b8'}}>{filtered.length} rows</span>
      </div>

      <div className="tbl-wrap">
        <table>
          <thead>
            <tr>
              <th style={{minWidth:180}}>Material</th>
              <th style={{minWidth:60,textAlign:'center'}}>LT (d)</th>
              <th style={{minWidth:70,textAlign:'center'}}>Min DOC (d)</th>
              <th style={{minWidth:110,textAlign:'center'}}>Covers</th>
              <th style={{minWidth:100,textAlign:'right'}}>Order Qty</th>
              <th style={{minWidth:100,textAlign:'center'}}>Order By</th>
              <th style={{minWidth:130,textAlign:'center'}}>Status</th>
              <th style={{minWidth:44,textAlign:'center'}}>📈</th>
            </tr>
          </thead>
          <tbody>
            {filtered.length===0 && (
              <tr><td colSpan={8}>
                <div className="empty-state">
                  <div className="icon">📊</div>
                  <div>No orders found. Set Lead Time + Min DOC in the RM/PM tabs.</div>
                </div>
              </td></tr>
            )}
            {filtered.map(({mat,t,schedule},idx)=>{
              const rowKey = `${mat.id}-${t.ts}`;
              const isExp = expandedKey===rowKey;
              const mp = getMonthPlans(mat);
              return (
                <React.Fragment key={rowKey}>
                  <tr style={{background:idx%2===0?'white':'#f0faf4',cursor:'pointer'}} onClick={()=>setExpandedKey(isExp?null:rowKey)}>
                    <td style={{fontWeight:600,fontSize:'12px'}}>
                      <span style={{marginRight:'6px',fontSize:'10px',color:'#94a3b8'}}>{isExp?'▼':'▶'}</span>
                      {mat.name}
                    </td>
                    <td style={{textAlign:'center',color:'#0369a1',fontWeight:700}}>{mat.lt||<span style={{color:'#cbd5e1'}}>—</span>}</td>
                    <td style={{textAlign:'center',color:'#0369a1',fontWeight:700}}>{mat.minDoc||<span style={{color:'#cbd5e1'}}>—</span>}</td>
                    <td style={{textAlign:'center',fontSize:'11px',color:'#64748b'}}>
                      {fmtDate(t.startDate)} → {fmtDate(t.endDate)}
                    </td>
                    <td style={{textAlign:'right',fontWeight:t.orderQty>0?700:400,fontSize:'13px',color:t.orderQty>0?'#1e293b':'#94a3b8'}}>
                      {t.orderQty>0 ? fmt(t.orderQty) : '—'}
                    </td>
                    <td style={{textAlign:'center',fontSize:'12px',fontWeight:t.orderQty>0?600:400,

                      {t.orderQty>0 ? fmtDate(t.orderByDate) : '—'}
                    </td>
                    <td style={{textAlign:'center'}}><StatusBadge status={t.status}/></td>
                    <td style={{textAlign:'center',color:'#94a3b8',fontSize:'14px'}}>{isExp?'▲':'↕'}</td>
                  </tr>
                  {isExp && (
                    <tr>
                      <td colSpan={8} style={{padding:'20px',background:'#f8fafc',borderBottom:'2px solid #d1fae5'}}>
                        {/* Key metrics */}
                        <div style={{display:'flex',gap:'20px',flexWrap:'wrap',marginBottom:'14px'}}>
                          {[
                            ['📦 Stock', fmt(mat.stock||0)],
                            ['📋 Open PO', fmt(mat.openPO||0)],
                            ['🎯 ROP', fmt(schedule.rop)],
                            ['📏 Lead Time', (mat.lt||0)+'d'],
                            ['🛡 Min DOC', (mat.minDoc||0)+'d'],
                            ...schedule.drrs.map((drr,i)=>[`📅 ${mp[i].label} DRR`, drr.toFixed(1)+'/d']),
                          ].map(([k,v])=>(
                            <div key={k} style={{background:'white',border:'1px solid #d1fae5',borderRadius:'8px',padding:'8px 14px',minWidth:'90px'}}>
                              <div style={{fontSize:'10px',color:'#64748b',marginBottom:'2px'}}>{k}</div>
                              <div style={{fontSize:'14px',fontWeight:700,color:'#1e293b'}}>{v}</div>
                            </div>
                          ))}
                        </div>
                        {/* M1–M4 req inputs */}
                        <div style={{marginBottom:'14px'}}>
                          <div style={{fontSize:'11px',fontWeight:700,color:'#374151',textTransform:'uppercase',letterSpacing:'.5px',marginBottom:'8px'}}>
                            Required Qty (edit per month)

                          <div style={{display:'flex',gap:'10px',flexWrap:'wrap'}}>

                              <div key={f} style={{display:'flex',flexDirection:'column',gap:'3px'}}>
                                <label style={{fontSize:'10px',color:'#64748b',fontWeight:600}}>{mp[i].label}</label>
                                <input type="number" className="num-input" style={{width:'100px'}} value={mat[f]||0} min={0}

                        <div style={{fontSize:'11px',fontWeight:700,color:'#374151',textTransform:'uppercase',letterSpacing:'.5px',marginBottom:'6px'}}>

      </div>

// APP
// ─────────────────────────────────────────────
function App() {
  const [authState, setAuthState] = useState('loading'); // 'loading' | 'login' | 'app'
  const [factories, setFactories] = useState([]);
  const [activeFactoryId, setActiveFactoryId] = useState(() => loadActiveFactoryId());
  const [activeTab, setActiveTab] = useState('supply');
  const [modal, setModal] = useState(null);
  const [dbLoading, setDbLoading] = useState(false);
  const sbRef = useRef(null);
  const userRef = useRef(null);

  useEffect(() => { saveActiveFactoryId(activeFactoryId); }, [activeFactoryId]);

  // Init Supabase + auth on mount
  useEffect(() => {
    async function init() {
      try {
        const res = await fetch('/api/config');
        const { supabaseUrl, supabaseKey } = await res.json();
        if (!supabaseUrl || !supabaseKey) { setAuthState('login'); return; }
        const sb = window.supabase.createClient(supabaseUrl, supabaseKey);
        sbRef.current = sb;
        const { data: { session } } = await sb.auth.getSession();
        if (session) {
          userRef.current = session.user;
          await loadFromDB(sb, session.user.id);
          setAuthState('app');
        } else {
          setAuthState('login');
        }
        sb.auth.onAuthStateChange(async (_event, session) => {
          if (session) {
            userRef.current = session.user;
            await loadFromDB(sb, session.user.id);
            setAuthState('app');
          } else {
            userRef.current = null;
            setFactories([]);
            setAuthState('login');
          }
        });
      } catch(e) { setAuthState('login'); }
    }
    init();
  }, []);

  async function loadFromDB(sb, userId) {
    setDbLoading(true);
    try {
      const { data, error } = await sb.from('factories').select('*');
      if (error) { console.error('loadFromDB error:', error.message); return; }
      if (data && data.length > 0) {
        const loaded = data.map(row => ({ ...row.data, id: row.factory_key, name: row.name }));
        setFactories(loaded);
        const saved = loadActiveFactoryId();
        if (loaded.find(f => f.id === saved)) setActiveFactoryId(saved);
        else setActiveFactoryId(loaded[0].id);
      } else {
        // First time user — create defaults
        const defaults = [initSprivilFactory(), initNgElectroFactory()];
        setFactories(defaults);
        setActiveFactoryId('sprivil');
        for (const f of defaults) await persistToDB(sb, userId, f);
      }
    } finally { setDbLoading(false); }
  }

  async function persistToDB(sb, userId, factory) {
    if (!sb || !userId) return;
    const { id, name, ...data } = factory;
    await sb.from('factories').upsert({
      user_id: userId,
      factory_key: id,
      name,
      data,
      updated_at: new Date().toISOString(),
    }, { onConflict: 'user_id,factory_key' });
  }

  async function handleLogin(mode, email, password) {
    const sb = sbRef.current;
    if (!sb) return { error: { message: 'Not initialized' } };
    if (mode === 'login') return sb.auth.signInWithPassword({ email, password });
    return sb.auth.signUp({ email, password });
  }

  async function handleLogout() {
    if (sbRef.current) await sbRef.current.auth.signOut();
  }

  const factory = factories.find(f => f.id === activeFactoryId) || factories[0];

  function updateFactory(updates) {
    if (!factory) return;
    setFactories(prev => {
      const next = prev.map(f => f.id === factory.id ? { ...f, ...updates } : f);
      const changed = next.find(f => f.id === factory.id);
      if (changed) persistToDB(sbRef.current, userRef.current?.id, changed);
      return next;
    });
  }

  const { skus=[], rm: rmMaterials=[], pm: pmMaterials=[], vendorMap={}, m1Label='M1', m2Label='M2', m3Label='M3', m4Label='M4', m1StartDate='', hasRM=false, hasPM=false, name: factoryName='' } = factory || {};

  function handleUpdate(kind, updated) {
    if (kind === 'rm') updateFactory({ rm: updated });
    else updateFactory({ pm: updated });
  }

  const ordersRM = useMemo(() => hasRM ? rmMaterials.filter(m => { const m1=calcM1(m); const m2=calcM2(m,m1); return m1.actual>0||m2.actual>0; }).length : 0, [rmMaterials, hasRM]);
  const ordersPM = useMemo(() => hasPM ? pmMaterials.filter(m => { const m1=calcM1(m); const m2=calcM2(m,m1); return m1.actual>0||m2.actual>0; }).length : 0, [pmMaterials, hasPM]);


  function resetFactory() {
    if (!window.confirm(`Reset ${factoryName}'s data to defaults? This cannot be undone.`)) return;
    updateFactory({ rm: SEED_RM, pm: SEED_PM, skus: factory.id==='sprivil' ? SEED_SKUS : [], vendorMap: {}, m1Label: 'M1', m2Label: 'M2' });
  }

  async function removeFactory() {
    if (!window.confirm(`Remove "${factoryName}" factory? All its data will be deleted. This cannot be undone.`)) return;
    const remaining = factories.filter(f => f.id !== factory.id);
    setFactories(remaining);
    setActiveFactoryId(remaining[0].id);
    if (sbRef.current && userRef.current) {
      const { error } = await sbRef.current.from('factories').delete()
        .eq('user_id', userRef.current.id).eq('factory_key', factory.id);
      if (error) alert('Failed to delete from database: ' + error.message);
    }
  }

  async function addFactory(name, hasRM, hasPM) {
    const f = initNewFactory(name, hasRM, hasPM);
    setFactories(prev => [...prev, f]);
    setActiveFactoryId(f.id);
    setActiveTab('supply');
    await persistToDB(sbRef.current, userRef.current?.id, f);
  }

  const [fetchReqStatus, setFetchReqStatus] = useState('idle');

  async function handleFetchReqQty() {
    const items = skus.filter(s => (s.supplyM1 || 0) > 0).map(s => ({ skuCode: s.code, quantity: s.supplyM1 }));
    if (!items.length) {
      alert('No SKUs with M1 supply quantities set. Enter supply numbers first.');
      return;
    }
    setFetchReqStatus('loading');
    try {
      const res = await fetch('/api/required-quantity', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ items })
      });
      const text = await res.text();
      let data;
      try { data = JSON.parse(text); } catch {
        setFetchReqStatus('⚠️ API only available on Vercel (not GitHub Pages)');
        return;
      }
      if (!res.ok) {
        setFetchReqStatus('❌ ' + (data.error || 'API error'));
        return;
      }

      // Build aggregated rm/pm lookup from various response shapes
      const rmAgg = {}, pmAgg = {};

      function addToAgg(agg, src) {
        if (!src) return;
        if (Array.isArray(src)) {
          for (const r of src) {
            const code = norm(String(r.mosaicRmCode || r.mosaicPmCode || r.materialCode || r.code || r.rmCode || r.pmCode || r.material || ''));
            const qty = parseFloat(r.kgRequired || r.unitsRequired || r.quantity || r.qty || r.required || r.reqQty || 0);
            if (code) agg[code] = (agg[code] || 0) + qty;
          }
        } else if (typeof src === 'object') {
          Object.entries(src).forEach(([k, v]) => { agg[norm(k)] = (agg[norm(k)] || 0) + (parseFloat(v) || 0); });
        }
      }

      // Always check top-level rm/pm arrays
      addToAgg(rmAgg, data.rm || data.RM || data.rawMaterials);
      addToAgg(pmAgg, data.pm || data.PM || data.packagingMaterials);
      // Also check per-product nested rm/pm (in case some entries are nested)
      if (data.products && Array.isArray(data.products)) {
        for (const p of data.products) {
          addToAgg(rmAgg, p.rm || p.RM || p.rawMaterials || p.rmRequirements);
          addToAgg(pmAgg, p.pm || p.PM || p.packagingMaterials || p.pmRequirements);
        }
      }

      function applyLookup(mats, lookup) {
        let applied = 0;
        const updated = mats.map(m => {
          const candidates = [m.id, m.code, m.sprivilCode, ...(m.mosaicCodes||[])].map(c => norm(String(c||'')));
          for (const c of candidates) {
            if (c && lookup[c] != null) { applied++; return { ...m, reqM1: lookup[c] }; }
          }
          return m;
        });
        return { updated, applied };
      }

      // Auto-create RM materials from API response if none exist yet
      let currentRM = rmMaterials;
      if (rmMaterials.length === 0 && Object.keys(rmAgg).length > 0) {
        const rmSrc = data.rm || data.RM || data.rawMaterials || [];
        if (Array.isArray(rmSrc)) {
          currentRM = rmSrc.map(r => {
            const code = r.mosaicRmCode || r.materialCode || r.code || '';
            const name = r.ingredientName || r.materialName || r.name || code;
            return { id: code, code, name, stock: 0, openPO: 0, supplyM1: 0, supplyM2: 0, reqM1: 0, reqM2: 0, reqM3: 0, reqM4: 0, moq: 0, lt: 0, minDoc: 0, aliases: [], mosaicCodes: [] };
          }).filter(m => m.id);
        }
      }

      // Auto-create PM materials from API response if none exist yet
      let currentPM = pmMaterials;
      if (pmMaterials.length === 0 && Object.keys(pmAgg).length > 0) {
        const pmSrc = data.pm || data.PM || data.packagingMaterials || [];
        if (Array.isArray(pmSrc)) {
          currentPM = pmSrc.map(r => {
            const code = r.mosaicPmCode || r.materialCode || r.code || '';
            const name = r.componentName || r.materialName || r.name || code;
            return { id: code, code, name, stock: 0, openPO: 0, supplyM1: 0, supplyM2: 0, reqM1: 0, reqM2: 0, reqM3: 0, reqM4: 0, moq: 0, lt: 0, minDoc: 0, aliases: [], mosaicCodes: [] };
          }).filter(m => m.id);
        }
      }

      let totalApplied = 0;
      if (Object.keys(rmAgg).length > 0) {
        const r = applyLookup(currentRM, rmAgg);
        if (r.applied > 0) { updateFactory({ rm: r.updated }); totalApplied += r.applied; }
      }
      if (Object.keys(pmAgg).length > 0) {
        const r = applyLookup(currentPM, pmAgg);
        if (r.applied > 0) { updateFactory({ pm: r.updated }); totalApplied += r.applied; }
      }

      if (totalApplied > 0) {
        setFetchReqStatus(`✓ ${totalApplied} materials updated`);
      } else {
        // Store raw for inspection
        window._lastApiResponse = data;
        setFetchReqStatus('⚠️ No match — open console and run: console.log(JSON.stringify(window._lastApiResponse, null, 2))');
      }
    } catch (err) {
      setFetchReqStatus('❌ ' + err.message);
    }
  }

  if (authState === 'loading') return (
    <div style={{minHeight:'100vh',display:'flex',alignItems:'center',justifyContent:'center',background:'#f1f5f9',color:'#64748b',fontSize:'14px'}}>
      Loading…
    </div>
  );
  if (authState === 'login') return <LoginScreen onLogin={handleLogin} />;
  if (!factory) return (
    <div style={{minHeight:'100vh',display:'flex',alignItems:'center',justifyContent:'center',background:'#f1f5f9',color:'#64748b',fontSize:'14px'}}>
      {dbLoading ? 'Loading your data…' : 'No factories found.'}
    </div>
  );

  return (
    <div>
      <div className="app-header">
        <span style={{fontSize:'22px'}}>📦</span>
        <h1>Supply Planner</h1>
        <span className="badge">Mosaic Wellness</span>
        <div className="month-labels">
          <label style={{fontWeight:600,color:'#1e293b'}}>Factory:</label>
          <select
            value={activeFactoryId}
            onChange={e=>{setActiveFactoryId(e.target.value);setActiveTab('supply');}}
            style={{padding:'4px 10px',borderRadius:'6px',border:'1px solid #cbd5e1',fontSize:'13px',fontWeight:600,marginLeft:'4px'}}
          >
            {factories.map(f => <option key={f.id} value={f.id}>{f.name}</option>)}
          </select>
          <button className="btn btn-secondary btn-sm" style={{marginLeft:'4px'}} onClick={()=>setModal('addFactory')}>+ Add</button>
          {factories.length > 1 && (
            <button className="btn btn-secondary btn-sm" style={{marginLeft:'4px',color:'#ef4444',borderColor:'#fecaca'}} onClick={removeFactory}>− Remove</button>
          )}
          <span style={{margin:'0 8px',color:'#cbd5e1'}}>|</span>
          <label>M1:</label>
          <input className="month-input" value={m1Label} onChange={e=>updateFactory({m1Label:e.target.value})} />
          <label style={{marginLeft:'4px'}}>M2:</label>
          <input className="month-input" value={m2Label} onChange={e=>updateFactory({m2Label:e.target.value})} />
          <label style={{marginLeft:'4px'}}>M3:</label>
          <input className="month-input" value={m3Label} onChange={e=>updateFactory({m3Label:e.target.value})} />
          <label style={{marginLeft:'4px'}}>M4:</label>
          <input className="month-input" value={m4Label} onChange={e=>updateFactory({m4Label:e.target.value})} />
          <button className="btn btn-secondary btn-sm" style={{color:'#ef4444',borderColor:'#fecaca'}} onClick={resetFactory}>↺ Reset</button>
          <span style={{margin:'0 8px',color:'#cbd5e1'}}>|</span>
          <span style={{fontSize:'11px',color:'#94a3b8'}}>{userRef.current?.email}</span>
          <button className="btn btn-secondary btn-sm" onClick={handleLogout}>Log out</button>
        </div>
      </div>

      <div className="tabs">
        <button className={`tab-btn${activeTab==='supply'?' active':''}`} onClick={()=>setActiveTab('supply')}>Supply Entry</button>
        {hasRM && (
          <button className={`tab-btn${activeTab==='rm'?' active':''}`} onClick={()=>setActiveTab('rm')}>
            Consolidated RM{ordersRM>0&&<span className="badge-cnt">{ordersRM}</span>}
          </button>
        )}
        {hasPM && (
          <button className={`tab-btn${activeTab==='pm'?' active':''}`} onClick={()=>setActiveTab('pm')}>
            Consolidated PM{ordersPM>0&&<span className="badge-cnt">{ordersPM}</span>}
          </button>
        )}
        <button className={`tab-btn${activeTab==='skudoc'?' active':''}`} onClick={()=>setActiveTab('skudoc')}>SKU Doc</button>
        <button className={`tab-btn${activeTab==='orderschedule'?' active':''}`} onClick={()=>setActiveTab('orderschedule')} style={{color: activeTab==='orderschedule'?'#059669':'#64748b'}}>
          📊 Order Schedule
        </button>
      </div>

      <div className="content">
        {activeTab==='supply' && (
          <SupplyEntryTab
            skus={skus}
            onUpdateSkus={s=>updateFactory({skus:s})}
            onImportSkus={s=>updateFactory({skus:s})}
            m1Label={m1Label}
            m2Label={m2Label}
            onFetchReqQty={handleFetchReqQty}
            fetchReqStatus={fetchReqStatus}
          />
        )}
        {activeTab==='rm' && hasRM && (
          <ConsolidatedTab kind="rm" materials={rmMaterials} vendorMap={vendorMap} onUpdate={handleUpdate} m1Label={m1Label} m2Label={m2Label} factoryName={factoryName} skus={skus} />
        )}
        {activeTab==='pm' && hasPM && (
          <ConsolidatedTab kind="pm" materials={pmMaterials} vendorMap={vendorMap} onUpdate={handleUpdate} m1Label={m1Label} m2Label={m2Label} factoryName={factoryName} skus={skus} />
        )}
        {activeTab==='skudoc' && (
          <SkuDocTab skus={skus} rmMaterials={rmMaterials} pmMaterials={pmMaterials} vendorMap={vendorMap} m1Label={m1Label} m2Label={m2Label} />
        )}
        {activeTab==='orderschedule' && (
          <OrderScheduleTab
            rmMaterials={rmMaterials}
            pmMaterials={pmMaterials}
            onUpdate={handleUpdate}
            m1Label={m1Label} m2Label={m2Label} m3Label={m3Label} m4Label={m4Label}
            m1StartDate={m1StartDate}
            onUpdateFactory={updateFactory}
          />
        )}
      </div>

      {modal==='help' && <HelpModal onClose={()=>setModal(null)} />}
      {modal==='addFactory' && <AddFactoryModal onAdd={addFactory} onClose={()=>setModal(null)} />}
      {modal==='vendorMap' && (
        <GlobalVendorMapModal
          vendorMap={vendorMap}
          rmMaterials={rmMaterials}
          pmMaterials={pmMaterials}
          onSave={vm=>updateFactory({vendorMap:vm})}
          onClose={()=>setModal(null)}
        />
      )}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
